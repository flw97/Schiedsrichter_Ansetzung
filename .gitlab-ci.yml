# Test, build and deploy to the Netcup webspace via FTPS. Setup and required CI/CD variables: docs/deployment.md
stages: [test, build, deploy]

variables:
  FTP_HOST: hosting256340.ae92d.netcup.net
  FTP_PATH: /ansetzung
  APP_URL: https://ansetzung.badminton-gomaringen.de
  COMPOSER_CACHE_DIR: $CI_PROJECT_DIR/.cache/composer
  npm_config_cache: $CI_PROJECT_DIR/.cache/npm

.composer:
  image: composer:2
  cache:
    key: composer
    paths: [.cache/composer/]

backend:test:
  extends: .composer
  stage: test
  script:
    - cd backend
    - composer install --no-interaction --no-progress
    - vendor/bin/pint --test
    - php artisan test

.npm:
  image: node:22-alpine
  cache:
    key: npm
    paths: [.cache/npm/]
  before_script:
    - cd frontend
    - npm ci --prefer-offline

# TODO: make blocking once the existing ESLint errors are fixed
frontend:lint:
  extends: .npm
  stage: test
  allow_failure: true
  script:
    - npm run lint

frontend:build:
  extends: .npm
  stage: build
  script:
    - npm run build
  artifacts:
    paths: [frontend/dist/]
    expire_in: 1 week

backend:build:
  extends: .composer
  stage: build
  script:
    - cd backend
    - composer install --no-dev --no-interaction --no-progress --optimize-autoloader
  artifacts:
    paths: [backend/vendor/, backend/bootstrap/cache/]
    expire_in: 1 week

deploy:
  stage: deploy
  image: alpine:3.22
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  resource_group: production
  environment:
    name: production
    url: $APP_URL
  before_script:
    - apk add --no-cache lftp curl ca-certificates
  script:
    - sh deploy/ftp-deploy.sh
