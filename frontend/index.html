<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="/layers.css">
    <link rel="icon" href="/favicon.ico?v=3" sizes="any">
    <link rel="icon" type="image/png" href="/favicon.png?v=3" sizes="32x32">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3">
    <meta name="theme-color" content="#F3F7F4">
    <meta name="color-scheme" content="light dark">
    <script>
      (function () {
        var choice = 'system'
        try { choice = localStorage.getItem('ansetzung-theme') || 'system' } catch (e) {}
        var dark = choice === 'dark' || (choice !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        var bg = dark ? '#0C1612' : '#F3F7F4'
        document.documentElement.style.background = bg
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', bg)
      })()
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ansetzung · Schiedsrichter</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
