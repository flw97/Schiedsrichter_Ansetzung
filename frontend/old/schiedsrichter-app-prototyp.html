// Archiv: Spiele mit Datum in der Vergangenheit werden automatisch hierher verschoben
// ---------------------------------------------------------------------------
function gameLabel(d, time) {
  const WD = ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"];
  const MON = ["Jan", "Feb", "Mär", "Apr", "Mai", "Jun", "Jul", "Aug", "Sep", "Okt", "Nov", "Dez"];
  return `${WD[d.getDay()]}, ${d.getDate()}. ${MON[d.getMonth()]} · ${time}`;
}

// Nachträgliche Korrektur eines archivierten Spiels (Admin): Termin, Halle, Besetzung
function ArchivEdit({ f, referees, onSave, onCancel }) {
  const d0 = gameDate(f);
  const t0 = f.date.match(/(\d{1,2}):(\d{2})/);
  const isT = f.type === "Turnier";
  const [day, setDay] = useState(d0 ? ymd(d0) : "");
  const [time, setTime] = useState(t0 ? `${t0[1].padStart(2, "0")}:${t0[2]}` : "");
  const [venue, setVenue] = useState(f.venue);
  const [chosen, setChosen] = useState(f.confirmedRefs || []);
  const [refName, setRefName] = useState(f.referee || "");
  const [err, setErr] = useState("");
  const toggle = (n) => setChosen((c) => (c.includes(n) ? c.filter((x) => x !== n) : [...c, n]));
  const inp = { border: `1px solid ${COLORS.hair}`, borderRadius: 6, padding: "6px 8px", fontSize: 12.5, ...bodyFont, boxSizing: "border-box", background: "#fff" };
  const save = () => {
    if (!day) { setErr("Bitte ein Datum angeben."); return; }
    const dt = new Date(day + "T00:00:00");
    const label = gameLabel(dt, time || (isT ? "ganztägig" : "00:00"));
    const crew = referees.filter((r) => chosen.includes(r.name));
    onSave({
      date: label,
      venue: venue.trim() || f.venue,
      confirmedRefs: crew.map((r) => r.name),
      referee: isT && refName ? refName : null,
      leader: isLeagueMatch(f) && crew.length ? pickLeader(crew).name : null,
      status: crew.length || (isT && refName) ? "bestätigt" : "offen",
    });
  };
  return (
    <div style={{ background: "#F8F6EF", borderRadius: 8, padding: 10, marginTop: 10 }}>
      <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "flex-end", marginBottom: 10 }}>
        <div><label style={{ ...bodyFont, fontSize: 11.5, color: COLORS.inkSoft, display: "block", marginBottom: 3 }}>Datum</label><input type="date" value={day} onChange={(e) => setDay(e.target.value)} style={inp} /></div>
        <div><label style={{ ...bodyFont, fontSize: 11.5, color: COLORS.inkSoft, display: "block", marginBottom: 3 }}>Uhrzeit</label><input type="time" value={time} onChange={(e) => setTime(e.target.value)} style={inp} /></div>
        <div style={{ flex: 1, minWidth: 180 }}><label style={{ ...bodyFont, fontSize: 11.5, color: COLORS.inkSoft, display: "block", marginBottom: 3 }}>Halle</label><input value={venue} onChange={(e) => setVenue(e.target.value)} style={{ ...inp, width: "100%" }} /></div>
      </div>
      <div style={{ ...bodyFont, fontSize: 11.5, color: COLORS.inkSoft, marginBottom: 6 }}>Besetzung (tatsächlich eingesetzte Schiedsrichter)</div>
      <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 10 }}>
        {referees.map((r) => (
          <label key={r.id} style={{ display: "flex", alignItems: "center", gap: 5, background: chosen.includes(r.name) ? "#EAF1EC" : "#fff", border: `1px solid ${chosen.includes(r.name) ? COLORS.court : COLORS.hair}`, borderRadius: 999, padding: "4px 10px", ...bodyFont, fontSize: 12, cursor: "pointer", color: COLORS.ink }}>
            <input type="checkbox" checked={chosen.includes(r.name)} onChange={() => toggle(r.name)} style={{ accentColor: COLORS.court }} /> {r.name}
          </label>
        ))}
      </div>
      {isT && (
        <div style={{ marginBottom: 10 }}>
          <label style={{ ...bodyFont, fontSize: 11.5, color: COLORS.inkSoft, display: "block", marginBottom: 3 }}>Referee (Oberschiedsrichter)</label>
          <select value={refName} onChange={(e) => setRefName(e.target.value)} style={inp}><option value="">— keiner —</option>{referees.map((r) => <option key={r.id} value={r.name}>{r.name}</option>)}</select>
        </div>
      )}
      {isLeagueMatch(f) && <div style={{ ...bodyFont, fontSize: 11.5, color: COLORS.inkSoft, marginBottom: 8 }}>Der verantwortliche Leiter ergibt sich weiterhin aus dem höheren Rang.</div>}
      <div style={{ ...bodyFont, fontSize: 11.5, color: COLORS.inkSoft, marginBottom: 8 }}>Liegt das neue Datum in der Zukunft, wandert das Spiel automatisch zurück in die aktuellen Listen.</div>
      {err && <div style={{ ...bodyFont, fontSize: 12, color: COLORS.rust, marginBottom: 8 }}>{err}</div>}
      <div style={{ display: "flex", gap: 8 }}>
        <button onClick={save} style={{ background: COLORS.court, color: "#fff", border: "none", borderRadius: 6, padding: "7px 12px", fontSize: 12, fontWeight: 600, cursor: "pointer", ...bodyFont }}>Speichern</button>
        <button onClick={onCancel} style={{ background: "#fff", color: COLORS.inkSoft, border: `1px solid ${COLORS.hair}`, borderRadius: 6, padding: "7px 12px", fontSize: 12, cursor: "pointer", ...bodyFont }}>Abbrechen</button>
      </div>
    </div>
  );
}

            <div style={{ ...bodyFont, fontSize: 13.5, fontWeight: 600, color: COLORS.ink, flex: 1 }}>{f.title}</div>
            {f.status === "bestätigt" ? <CourtBadge tone="moss">Besetzt</CourtBadge> : <CourtBadge tone="rust">Nicht besetzt</CourtBadge>}

            <div style={{ marginTop: 8 }}>

            </div>
          ) : null}
        </div>
      ))}
    </div>
  );
}

const VENUE_PLACE = {
  "Sporthalle Waldkirch": "nürtingen", "Halle am Steinbruch": "esslingen", "Sporthalle Fils": "göppingen", "Kreissporthalle Fils": "göppingen",
  "Hohenstaufenhalle": [48.7196, 9.7119], "Neckarhalle Neckartenzlingen": "neckartenzlingen", "Albhalle Reutlingen": "reutlingen",
  "Halle Nordstadt": "stuttgart", "Neckarhalle Tübingen": "tübingen",
};
const _geoCache = {};
// Ort in einem Adress- oder Hallentext finden (längster Treffer gewinnt)
function geoOf(text) {
  const t = (text || "").toLowerCase();
  if (_geoCache[t] !== undefined) return _geoCache[t];
  let best = null;
  Object.keys(GEO_PLACES).forEach((k) => { if (t.includes(k) && (!best || k.length > best.length)) best = k; });
  const res = best ? { lat: GEO_PLACES[best][0], lon: GEO_PLACES[best][1], ort: best, genau: "Ortsmitte" } : null;
  _geoCache[t] = res;
  return res;
}
function refGeo(r) {
  if (r.lat !== undefined && r.lon !== undefined) return { lat: r.lat, lon: r.lon, ort: "", genau: "Koordinaten" };
  return geoOf(r.address || "");
}
function venueGeo(v) {
  const p = VENUE_PLACE[v];
  if (Array.isArray(p)) return { lat: p[0], lon: p[1], ort: v, genau: "Ort" };
  if (p) return { lat: GEO_PLACES[p][0], lon: GEO_PLACES[p][1], ort: p, genau: "Ortsmitte" };
  return geoOf(v);
}
function haversineKm(a, b) {
  const R = 6371;
  const rad = (x) => (x * Math.PI) / 180;
  const dLat = rad(b.lat - a.lat);
  const dLon = rad(b.lon - a.lon);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

const MAP_CITIES = [["Stuttgart", "stuttgart", 1], ["Karlsruhe", "karlsruhe", 1], ["Mannheim", "mannheim", 1], ["Heidelberg", "heidelberg", 1], ["Heilbronn", "heilbronn", 1], ["Freiburg", "freiburg", 1], ["Ulm", "ulm", 1], ["Konstanz", "konstanz", 1], ["Tübingen", "tübingen", 0], ["Reutlingen", "reutlingen", 0], ["Esslingen", "esslingen", 0], ["Göppingen", "göppingen", 0], ["Pforzheim", "pforzheim", 1], ["Friedrichshafen", "friedrichshafen", 0], ["Ravensburg", "ravensburg", 0], ["Aalen", "aalen", 0], ["Offenburg", "offenburg", 0], ["Schwäbisch Hall", "schwäbisch hall", 0], ["Villingen-Schwenningen", "villingen-schwenningen", 0], ["Nürtingen", "nürtingen", 0], ["Kirchheim", "kirchheim", 0]];
const MAP_LON0 = 7.45;
const MAP_LAT1 = 49.85;
const MAP_KX = 111.32 * Math.cos((48.6 * Math.PI) / 180);
const MAP_KY = 111.32;
const mapX = (lon) => (lon - MAP_LON0) * MAP_KX;
const mapY = (lat) => (MAP_LAT1 - lat) * MAP_KY;
const MAP_W = mapX(10.55);
const MAP_H = mapY(47.5);
const mapPath = (pts, close) => pts.map((p, i) => `${i ? "L" : "M"}${mapX(p[0]).toFixed(1)},${mapY(p[1]).toFixed(1)}`).join(" ") + (close ? " Z" : "");

// Karte: points = [{ id, lat, lon, kind: "ref" | "hall" | "hotel", label }]
function GeoMap({ points, selectedId, onSelect, height = 520, fitKey }) {
  const full = { x: 0, y: 0, w: MAP_W, h: MAP_H };
  const [vb, setVb] = useState(full);
  const drag = useRef(null);
  const moved = useRef(false);
  const svgRef = useRef(null);
  const k = vb.w / MAP_W;
  const colors = { ref: "#2F6B4F", hall: "#2A5A9E", hotel: "#D9822B" };

  const fit = (list) => {
    const pts = (list && list.length ? list : points).filter((p) => p.lat !== undefined);
    if (!pts.length) { setVb(full); return; }
    const xs = pts.map((p) => mapX(p.lon));
    const ys = pts.map((p) => mapY(p.lat));
    const pad = 14;
    let w = Math.max(30, Math.max(...xs) - Math.min(...xs) + 2 * pad);
    let h = Math.max(30 * (MAP_H / MAP_W), Math.max(...ys) - Math.min(...ys) + 2 * pad);
    const ratio = MAP_H / MAP_W;
    if (h / w > ratio) w = h / ratio; else h = w * ratio;
    setVb({ x: (Math.min(...xs) + Math.max(...xs)) / 2 - w / 2, y: (Math.min(...ys) + Math.max(...ys)) / 2 - h / 2, w, h });
  };
  useEffect(() => { fit(null); }, [fitKey]);
  const zoomBy = (f) => setVb((v) => { const w = Math.min(MAP_W * 1.1, Math.max(14, v.w * f)); const h = w * (MAP_H / MAP_W); return { x: v.x + v.w / 2 - w / 2, y: v.y + v.h / 2 - h / 2, w, h }; });

  const onDown = (e) => {
    drag.current = { x: e.clientX, y: e.clientY, vb };
    moved.current = false;
    const mv = (ev) => {
      const d = drag.current;
      if (!d || !svgRef.current) return;
      const dx = ev.clientX - d.x;
      const dy = ev.clientY - d.y;
      if (Math.abs(dx) + Math.abs(dy) > 4) moved.current = true;
      const rect = svgRef.current.getBoundingClientRect();
      const ratio = Math.max(d.vb.w / rect.width, d.vb.h / rect.height);
      setVb({ ...d.vb, x: d.vb.x - dx * ratio, y: d.vb.y - dy * ratio });
    };
    const up = () => { window.removeEventListener("pointermove", mv); window.removeEventListener("pointerup", up); drag.current = null; };
    window.addEventListener("pointermove", mv);
    window.addEventListener("pointerup", up);
  };

  const scaleLen = [5, 10, 20, 50, 100].filter((n) => n <= vb.w / 3).pop() || 5;
  const btn = { background: "#fff", color: COLORS.ink, border: `1px solid ${COLORS.hair}`, borderRadius: 6, width: 32, height: 32, fontSize: 16, cursor: "pointer", ...bodyFont };
  return (
    <div style={{ position: "relative", background: "#DCE7EF", border: `1px solid ${COLORS.hair}`, borderRadius: 12, overflow: "hidden", height }}>
      <svg ref={svgRef} viewBox={`${vb.x} ${vb.y} ${vb.w} ${vb.h}`} width="100%" height="100%" preserveAspectRatio="xMidYMid meet" onPointerDown={onDown} style={{ display: "block", touchAction: "none", cursor: "grab" }} role="img" aria-label="Karte von Baden-Württemberg">
        <path d={mapPath(BW_OUTLINE, true)} fill="#F1F0E6" stroke="#9AA59C" strokeWidth={0.5 * Math.max(0.4, k)} strokeLinejoin="round" />
        <path d={mapPath(RIVER_RHINE, false)} fill="none" stroke="#8FB9D9" strokeWidth={1.6 * Math.max(0.4, k)} strokeLinecap="round" />
        <path d={mapPath(RIVER_NECKAR, false)} fill="none" stroke="#A9CCE3" strokeWidth={0.9 * Math.max(0.4, k)} strokeLinecap="round" />
        <path d={mapPath(RIVER_DONAU, false)} fill="none" stroke="#A9CCE3" strokeWidth={0.9 * Math.max(0.4, k)} strokeLinecap="round" />
        <path d={mapPath(BODENSEE, true)} fill="#BBD7EA" stroke="#8FB9D9" strokeWidth={0.4 * Math.max(0.4, k)} />
        {MAP_CITIES.filter((c) => c[2] === 1 || vb.w < 120).map((c) => {
          const g = GEO_PLACES[c[1]];
          return (
            <g key={c[0]} pointerEvents="none">
              <circle cx={mapX(g[1])} cy={mapY(g[0])} r={0.9 * k} fill="#8A948D" />
              <text x={mapX(g[1]) + 1.6 * k} y={mapY(g[0]) + 1.1 * k} fontSize={3.4 * k} fill="#6E7871" style={{ fontFamily: "Inter, sans-serif" }}>{c[0]}</text>
            </g>
          );
        })}
        {points.filter((p) => p.lat !== undefined).map((p) => {
          const x = mapX(p.lon);
          const y = mapY(p.lat);
          const sel = selectedId === p.id;
          const r = (sel ? 3.4 : 2.5) * k;
          return (
            <g key={p.id} onClick={() => { if (!moved.current && onSelect) onSelect(p.id); }} style={{ cursor: "pointer" }}>
              <title>{p.label}</title>
              {sel && <circle cx={x} cy={y} r={r * 1.9} fill="none" stroke={colors[p.kind]} strokeWidth={0.5 * k} opacity={0.7} />}
              {p.kind === "hall" ? <rect x={x - r} y={y - r} width={2 * r} height={2 * r} fill={colors.hall} stroke="#fff" strokeWidth={0.5 * k} /> : <circle cx={x} cy={y} r={r} fill={colors[p.kind]} stroke="#fff" strokeWidth={0.5 * k} />}
              {sel && <text x={x + r * 1.6} y={y - r * 1.2} fontSize={3.8 * k} fill="#1B241F" stroke="#fff" strokeWidth={0.9 * k} paintOrder="stroke" style={{ fontFamily: "Inter, sans-serif", fontWeight: 600 }}>{p.label}</text>}
            </g>
          );
        })}
        <g pointerEvents="none">
          <line x1={vb.x + 4 * k} y1={vb.y + vb.h - 6 * k} x2={vb.x + 4 * k + scaleLen} y2={vb.y + vb.h - 6 * k} stroke="#1B241F" strokeWidth={0.7 * k} />
          <text x={vb.x + 4 * k} y={vb.y + vb.h - 8 * k} fontSize={3.4 * k} fill="#1B241F" style={{ fontFamily: "Inter, sans-serif" }}>{scaleLen} km</text>
        </g>
      </svg>
      <div style={{ position: "absolute", top: 10, right: 10, display: "flex", flexDirection: "column", gap: 6 }}>
        <button onClick={() => zoomBy(0.6)} style={btn} aria-label="Hineinzoomen">+</button>
        <button onClick={() => zoomBy(1 / 0.6)} style={btn} aria-label="Herauszoomen">−</button>
        <button onClick={() => fit(null)} style={{ ...btn, fontSize: 12 }} aria-label="Alle Punkte zeigen" title="Alle Punkte zeigen">⌂</button>
      </div>
    </div>
  );
}

  const nearest = selected ? all.filter((p) => p.kind === "hall" && p.id !== selected.id).map((p) => ({ p, d: Math.round(haversineKm(selected, p) * 1.25) })).sort((a, b) => a.d - b.d).slice(0, 4) : [];

      <div style={{ ...bodyFont, fontSize: 11.5, color: COLORS.inkSoft, marginTop: 6 }}>Vektorkarte auf Basis echter Koordinaten (vereinfachter Umriss, Flüsse und Städte). Die Position wird aus Ortsname der Adresse bestimmt (Ortsmitte), nicht auf die Hausnummer genau.</div>

      {selected && (
        <div style={{ background: COLORS.panel, border: `1px solid ${COLORS.hair}`, borderRadius: 12, padding: 14, marginTop: 12 }}>
          <div style={{ ...bodyFont, fontSize: 14, fontWeight: 600, color: COLORS.ink }}>{selected.label}</div>

        <div style={{ ...bodyFont, fontSize: 13, fontWeight: 600, color: COLORS.ink, padding: "10px 14px", background: "#F8F6EF" }}>Schiedsrichter und hinterlegte Adressen</div>

          const g = refGeo(r);

  );

// Gemeinsamer Speicher für Unterkünfte (Datenbank), auf App-Ebene geladen
function useUnterkunftStore() {
  const [items, setItems] = useState(null);
  const [store, setStore] = useState({ db: null, ready: false });
  useEffect(() => {
    let dead = false;
    let unsub = null;
    let timer = null;
    (async () => {
      let db = null;
      try { db = window.claude && window.claude.use ? await window.claude.use("db") : null; } catch (e) { db = null; }
      if (dead) return;
      setStore({ db, ready: true });
      if (!db) { setItems([]); return; }
      timer = setTimeout(() => setItems((d) => d || []), 10000);
      unsub = db.collection("unterkuenfte").onSnapshot(
        (snap) => { clearTimeout(timer); setItems(snap.docs.map((s) => ({ id: s.id, ...s.data() }))); },
        () => { clearTimeout(timer); setItems((d) => d || []); }
      );
    })();
    return () => { dead = true; clearTimeout(timer); if (unsub) unsub(); };
  }, []);
  const save = async (id, data) => {
    if (!store.db) throw new Error("db");
    if (id) await store.db.doc("unterkuenfte/" + id).set(data);
    else await store.db.collection("unterkuenfte").doc().set(data);
  };
  const remove = async (id) => { if (!store.db) throw new Error("db"); await store.db.doc("unterkuenfte/" + id).delete(); };
  return { items, store, save, remove };
}

        <button onClick={onCancel} style={{ background: "#fff", color: COLORS.inkSoft, border: `1px solid ${COLORS.hair}`, borderRadius: 7, padding: "8px 16px", fontSize: 12.5, cursor: "pointer", ...bodyFont }}>Abbrechen</button>
      </div>
    </div>
  );
}

function UnterkuenfteTab({ hs, fixtures, userName, canManage, canPropose }) {
  const { items, store } = hs;
  const [q, setQ] = useState("");
  const [venue, setVenue] = useState("");
  const [sel, setSel] = useState(null);
  const [form, setForm] = useState(null); // { id, data }
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState(null);
  const [delId, setDelId] = useState(null);
  const [revId, setRevId] = useState(null);
  const [rev, setRev] = useState({ sterne: 4, text: "" });
  const [openCom, setOpenCom] = useState({});

  const venues = [...new Set([...Object.keys(VENUE_PLACE), ...(fixtures || []).map((f) => f.venue)])].filter((v) => venueGeo(v)).sort((a, b) => a.localeCompare(b, "de"));
  const rows = (items || []).map((h) => {
    const g = ukGeo(h);
    const vg = h.spielort ? venueGeo(h.spielort) : null;
    return { ...h, _g: g, _vg: vg, _dist: g && vg ? Math.round(haversineKm(g, vg) * 1.25) : null, _avg: ukAvg(h) };
  }).filter((h) => {
    if (venue && h.spielort !== venue) return false;
    const t = q.trim().toLowerCase();
    return !t || `${h.name} ${h.ort} ${h.strasse || ""} ${h.spielort || ""}`.toLowerCase().includes(t);
  }).sort((a, b) => (a.spielort || "").localeCompare(b.spielort || "", "de") || (a._dist === null ? 999 : a._dist) - (b._dist === null ? 999 : b._dist) || a.name.localeCompare(b.name, "de"));

  const clean = (o) => { const out = {}; Object.keys(o).forEach((k) => { if (o[k] !== undefined && k !== "id" && k[0] !== "_") out[k] = o[k]; }); return out; };
  const persist = async (id, data, ok) => {
    setBusy(true);
    setMsg(null);
    try { await hs.save(id, clean(data)); setMsg({ tone: "moss", text: ok }); return true; } catch (e) { setMsg({ tone: "rust", text: "Speichern nicht möglich — Speicher nicht verfügbar oder keine Berechtigung." }); return false; } finally { setBusy(false); }
  };
  const submitForm = async (data) => {
    if (!(canManage || canPropose)) return;
    const base = form.id ? (items || []).find((h) => h.id === form.id) || {} : {};
    const body = { bewertungen: base.bewertungen || [], addedBy: base.addedBy || userName, ...data, updatedAt: new Date().toISOString() };
    if (await persist(form.id, body, "Unterkunft gespeichert.")) setForm(null);
  };
  const remove = async (h) => {
    if (!canManage) return;
    setBusy(true);
    try { await hs.remove(h.id); setDelId(null); setSel(null); } catch (e) { setMsg({ tone: "rust", text: "Löschen nicht möglich." }); }
    setBusy(false);
  };
  const submitReview = async (h) => {
    if (!canPropose) return;
    const others = (h.bewertungen || []).filter((b) => b.name !== userName);
    const body = { ...h, bewertungen: [...others, { name: userName, sterne: Number(rev.sterne), text: rev.text.trim(), at: new Date().toISOString() }] };
    if (await persist(h.id, body, "Bewertung gespeichert.")) { setRevId(null); setRev({ sterne: 4, text: "" }); }
  };

  const pts = rows.filter((h) => h._g).map((h) => ({ id: `u:${h.id}`, kind: "hotel", lat: h._g.lat, lon: h._g.lon, label: h.name }));
  const seenVenues = {};
  rows.forEach((h) => { if (h._vg && !seenVenues[h.spielort]) { seenVenues[h.spielort] = true; pts.push({ id: `v:${h.spielort}`, kind: "hall", lat: h._vg.lat, lon: h._vg.lon, label: h.spielort }); } });
  const sf = { border: `1px solid ${COLORS.hair}`, borderRadius: 6, padding: "7px 9px", fontSize: 12.5, ...bodyFont, background: "#fff" };
  const linkBtn = { background: "none", border: "none", color: COLORS.court, fontSize: 12.5, cursor: "pointer", padding: 0, textDecoration: "none", ...bodyFont };

  return (
    <div style={{ maxWidth: 1100 }}>
      <h1 style={{ ...displayFont, fontSize: 26, color: COLORS.ink, margin: "0 0 4px" }}>Unterkünfte</h1>
      <div style={{ ...bodyFont, fontSize: 13, color: COLORS.inkSoft, marginBottom: 14 }}>Interne Liste von Übernachtungsmöglichkeiten bei den Spielorten — mit Bewertungen und Kommentaren der Schiedsrichter.</div>

      {store.ready && !store.db && <div style={{ ...bodyFont, fontSize: 12.5, color: COLORS.rust, background: "#FBEAE5", borderRadius: 10, padding: 12, marginBottom: 14 }}>Der Speicher für Unterkünfte ist in dieser Ansicht nicht verfügbar. Bitte die Seite neu laden oder in claude.ai öffnen.</div>}

      <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 14 }}>
        <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Suche: Name oder Ort" style={{ ...sf, flex: 1, minWidth: 180 }} aria-label="Suche" />
        <select value={venue} onChange={(e) => setVenue(e.target.value)} style={sf} aria-label="Spielort"><option value="">Alle Spielorte</option>{venues.map((v) => <option key={v} value={v}>{v}</option>)}</select>
        {(canPropose || canManage) && !form && store.db && <button onClick={() => setForm({ id: null, data: { ...UK_EMPTY, spielort: venue } })} style={{ background: COLORS.court, color: "#fff", border: "none", borderRadius: 8, padding: "8px 16px", fontSize: 13, fontWeight: 600, cursor: "pointer", ...bodyFont }}>Unterkunft eintragen</button>}
      </div>
      {form && <UnterkunftForm initial={form.data} venues={venues} busy={busy} onSave={submitForm} onCancel={() => setForm(null)} />}
      {msg && <div style={{ ...bodyFont, fontSize: 12.5, color: msg.tone === "moss" ? COLORS.moss : COLORS.rust, marginBottom: 12 }}>{msg.text}</div>}

      <div style={{ display: "flex", gap: 16, flexWrap: "wrap", alignItems: "flex-start" }}>
        <div style={{ flex: "1.2 1 380px", minWidth: 300 }}>
          <div style={{ ...bodyFont, fontSize: 12, color: COLORS.inkSoft, marginBottom: 8 }}>{items === null ? "Lade Unterkünfte …" : `${rows.length} von ${(items || []).length} Unterkünften`}</div>
          {items !== null && rows.length === 0 && <div style={{ ...bodyFont, fontSize: 13, color: COLORS.inkSoft, background: COLORS.panel, border: `1px solid ${COLORS.hair}`, borderRadius: 12, padding: 16 }}>{(items || []).length === 0 ? "Noch keine Unterkünfte eingetragen." : "Keine Unterkunft für diesen Filter."}</div>}
          {rows.map((h) => {
            const isSel = sel === `u:${h.id}`;
            const mine = (h.bewertungen || []).find((b) => b.name === userName);
            const komm = (h.bewertungen || []).filter((b) => b.text);
            return (
              <div key={h.id} style={{ background: COLORS.panel, border: `1px solid ${isSel ? COLORS.court : COLORS.hair}`, borderRadius: 12, padding: 14, marginBottom: 10 }}>
                <div style={{ ...bodyFont, fontSize: 14.5, fontWeight: 600, color: COLORS.ink }}>{h.name}</div>
                <div style={{ ...bodyFont, fontSize: 12.5, color: COLORS.inkSoft }}>{[h.strasse, `${h.plz || ""} ${h.ort}`.trim()].filter(Boolean).join(", ")}</div>
                <div style={{ ...bodyFont, fontSize: 12.5, color: COLORS.ink, marginTop: 3 }}>Spielort: {h.spielort || "—"}{h._dist !== null ? ` · ${h._dist} km` : ""}</div>
                <div style={{ ...bodyFont, fontSize: 12.5, color: "#B7791F", marginTop: 3 }}>{h._avg !== null ? <><span style={{ letterSpacing: 1 }}>{ukStars(h._avg)}</span> <span style={{ color: COLORS.ink }}>{h._avg.toFixed(1).replace(".", ",")} ({h.bewertungen.length})</span></> : <span style={{ color: COLORS.inkSoft }}>Noch keine Bewertung</span>}</div>

                <div style={{ display: "flex", gap: 14, flexWrap: "wrap", marginTop: 10, paddingTop: 10, borderTop: `1px solid ${COLORS.hair}` }}>
                  <a href={ukNavLink(h)} target="_blank" rel="noopener noreferrer" style={{ ...linkBtn, fontWeight: 600 }}>Navigation starten</a>
                  {h.spielort && <a href={ukRouteLink(h)} target="_blank" rel="noopener noreferrer" style={linkBtn}>Route zum Spielort</a>}
                  {h._g && <button onClick={() => setSel(`u:${h.id}`)} style={linkBtn}>Auf der Karte zeigen</button>}
                  {canPropose && <button onClick={() => { setRevId(revId === h.id ? null : h.id); setRev(mine ? { sterne: mine.sterne, text: mine.text } : { sterne: 4, text: "" }); }} style={linkBtn}>{mine ? "Meine Bewertung ändern" : "Bewerten & kommentieren"}</button>}
                  {komm.length > 0 && <button onClick={() => setOpenCom((o) => ({ ...o, [h.id]: !o[h.id] }))} style={linkBtn}>{openCom[h.id] ? "Kommentare ausblenden" : `Kommentare (${komm.length})`}</button>}
                  {canManage && <button onClick={() => setForm({ id: h.id, data: { ...UK_EMPTY, ...clean(h) } })} style={linkBtn}>Bearbeiten</button>}
                  {canManage && (delId === h.id ? (
                    <span style={{ ...bodyFont, fontSize: 12, color: COLORS.ink }}>Wirklich löschen? <button onClick={() => remove(h)} style={{ background: "none", border: "none", color: COLORS.rust, fontWeight: 600, cursor: "pointer", ...bodyFont, fontSize: 12 }}>Ja</button> · <button onClick={() => setDelId(null)} style={{ background: "none", border: "none", color: COLORS.inkSoft, cursor: "pointer", ...bodyFont, fontSize: 12 }}>Nein</button></span>
                  ) : <button onClick={() => setDelId(h.id)} style={{ ...linkBtn, color: COLORS.rust }}>Löschen</button>)}
                </div>

                {openCom[h.id] && (
                  <div style={{ marginTop: 8 }}>
                    {komm.map((b, i) => (
                      <div key={i} style={{ ...bodyFont, fontSize: 12.5, color: COLORS.ink, padding: "6px 0", borderTop: `1px solid ${COLORS.hair}` }}>
                        <span style={{ color: "#B7791F", letterSpacing: 1 }}>{ukStars(b.sterne)}</span> <strong style={{ fontWeight: 600 }}>{b.name}</strong> <span style={{ color: COLORS.inkSoft, fontSize: 11.5 }}>{b.at ? new Date(b.at).toLocaleDateString("de-DE") : ""}</span>
                        <div>{b.text}</div>
                      </div>
                    ))}
                  </div>
                )}
                {revId === h.id && canPropose && (
                  <div style={{ background: "#F8F6EF", borderRadius: 8, padding: 10, marginTop: 10 }}>
                    <div style={{ display: "flex", gap: 8, alignItems: "center", marginBottom: 8 }}>
                      <span style={{ ...bodyFont, fontSize: 12.5, color: COLORS.ink }}>Bewertung:</span>
                      <select value={rev.sterne} onChange={(e) => setRev({ ...rev, sterne: e.target.value })} style={sf}>{[5, 4, 3, 2, 1].map((n) => <option key={n} value={n}>{n} — {ukStars(n)}</option>)}</select>
                    </div>
                    <textarea value={rev.text} maxLength={300} rows={2} onChange={(e) => setRev({ ...rev, text: e.target.value })} placeholder="Kommentar (Lage, Frühstück, Ruhe, Anreise …)" style={{ ...sf, width: "100%", boxSizing: "border-box", marginBottom: 8, resize: "vertical" }} />
                    <div style={{ display: "flex", gap: 8 }}>
                      <button onClick={() => submitReview(h)} disabled={busy} style={{ background: COLORS.court, color: "#fff", border: "none", borderRadius: 6, padding: "6px 12px", fontSize: 12, fontWeight: 600, cursor: "pointer", ...bodyFont }}>Speichern</button>
                      <button onClick={() => setRevId(null)} style={{ background: "#fff", color: COLORS.inkSoft, border: `1px solid ${COLORS.hair}`, borderRadius: 6, padding: "6px 12px", fontSize: 12, cursor: "pointer", ...bodyFont }}>Abbrechen</button>
                    </div>
                  </div>
                )}
              </div>
            );
          })}
        </div>
        <div style={{ flex: "1 1 340px", minWidth: 300, position: "sticky", top: 12 }}>
          <GeoMap points={pts} selectedId={sel} onSelect={setSel} height={520} fitKey={`${rows.length}|${venue}`} />
          <div style={{ ...bodyFont, fontSize: 11.5, color: COLORS.inkSoft, marginTop: 6 }}>Orange: Unterkünfte, blau: zugehörige Spielorte. Position = Ortsmitte bzw. eingetragene Koordinaten; Entfernung = Luftlinie × 1,25.</div>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [auth, setAuth] = useState(null);
  const [view, setView] = useState(null);
  const [openFixture, setOpenFixture] = useState(null);
  const [fixtures, setFixtures] = useState(FIXTURES_INITIAL);
  const [staged, setStaged] = useState(NULIGA_STAGED);
  const [referees, setReferees] = useState(REFEREES_INITIAL);
  const [notifications, setNotifications] = useState([]);
  const [toasts, setToasts] = useState([]);
  const [responses, setResponses] = useState(RESPONSES_INITIAL); // Rückmeldungen der Saisonabfrage je Spiel-ID und Schiedsrichter
  const [abfrage, setAbfrage] = useState({ von: isoDays(-7), bis: isoDays(14) }); // Abfragezeitraum
  const [accessLog, setAccessLog] = useState([]);
  const [sessionNote, setSessionNote] = useState("");
  const [beobachtungen, setBeobachtungen] = useState(BEOBACHTUNGEN_INITIAL);
  const regel = useRegelStore();
  const hs = useUnterkunftStore();
  const [users, setUsers] = useState(USERS_INITIAL);
  const [roleLog, setRoleLog] = useState([]);

  const pushNotify = (text) => {
    const id = Math.random().toString(36).slice(2);
    setToasts((t) => [...t, { id, text }]);
    setNotifications((n) => [{ id, text, time: "gerade eben" }, ...n]);
    setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), 4000);
  };

  const handleLogin = ({ username, role }) => {
    // Rolle aus dem Konto (Rollenverwaltung); unbekannte Namen nutzen die Demo-Auswahl
    const acc = users.find((u) => u.username === username.trim().toLowerCase());
    if (acc && !acc.active) { logAccess("Anmeldung abgelehnt (Konto deaktiviert)", acc.name); return "Dieses Konto ist deaktiviert."; }
    const r = acc ? acc.role : role;
    setAuth({ username: acc ? acc.name : username, role: r });
    setView(r === "schiri" ? "abfrage" : "ansetzungen");
    logAccess("Anmeldung", `${acc ? acc.name : username} (${ROLE_LABEL[r]})`);
    setSessionNote("");
    return null;
  };
  const logRole = (text) => setRoleLog((l) => [{ id: Date.now() + Math.random(), at: new Date().toLocaleString("de-DE"), text: `${auth ? auth.username : "System"}: ${text}` }, ...l].slice(0, 50));
  const setUserRole = (id, role) => {
    if (!allow("rollen")) return;
    const u = users.find((x) => x.id === id);
    setUsers((us) => us.map((x) => (x.id === id ? { ...x, role } : x)));
    if (u) logRole(`Rolle von ${u.name} geändert: ${ROLE_LABEL[u.role]} → ${ROLE_LABEL[role]}`);
  };
  const toggleUserActive = (id) => {
    if (!allow("rollen")) return;
    const u = users.find((x) => x.id === id);
    setUsers((us) => us.map((x) => (x.id === id ? { ...x, active: !x.active } : x)));
    if (u) logRole(`Konto von ${u.name} ${u.active ? "deaktiviert" : "aktiviert"}`);
  };
  const addUser = (u) => {
    if (!allow("rollen")) return;
    setUsers((us) => [...us, { id: "u-" + Date.now(), active: true, ...u }]);
    logRole(`Konto angelegt: ${u.name} (${ROLE_LABEL[u.role]})`);
  };
  const handleLogout = () => { logAccess("Abmeldung"); setAuth(null); setView(null); setOpenFixture(null); };

  const toFixture = (item) => ({ id: item.id, title: item.title, type: item.type, date: item.date, venue: item.venue, status: "offen", wettbewerb: item.wettbewerb || "Regionalliga Südost", neededCount: isLeagueMatch({ type: item.type, wettbewerb: item.wettbewerb }) ? 2 : item.neededCount || 1, requiredLevel: requiredLevelFor(item.wettbewerb || "Regionalliga Südost"), confirmedRefs: [], homeTeam: item.homeTeam, awayTeam: item.awayTeam });
  const importOne = (item, opts) => {
    if (!allow("ansetzen")) return;
    const requestedBy = opts && opts.requestedBy;
    const ex = fixtures.find((f) => f.title === item.title);
    if (ex) {
      // Termin eines bereits bekannten Spiels hat sich verschoben: bestehende Ansetzung aktualisieren, Schiedsrichter bestätigen neu
      const assigned = ex.status === "bestätigt" ? [...ex.confirmedRefs, ...(ex.referee ? [ex.referee] : [])] : [];
      setFixtures((fs) => fs.map((f) => (f.id === ex.id ? { ...f, date: item.date, venue: item.venue || f.venue, terminAenderung: assigned.length ? { alt: ex.date, neu: item.date } : null, reconfirmed: [] } : f)));
      assigned.forEach((n) => { const r = referees.find((x) => x.name === n); pushNotify(`Push an ${n}${r ? ` (${r.phone})` : ""}: Termin geändert (${ex.date} → ${item.date}) — bitte neu bestätigen: ${ex.title}`); });
      return;
    }
    setFixtures((f) => [...f, requestedBy ? { ...toFixture(item), requestedBy } : toFixture(item)]);
  };
  const importAll = (items) => items.forEach((it) => importOne(it));
  const applySeasonPlan = (rows, mode) => {
    if (!allow("saisonplanung")) return;
    const full = (row) => row.refs.length >= 2;
    const names = (row) => row.refs.map((r) => r.name);
    const patchFor = (row) => {
      if (!full(row)) return { status: "offen", plannedRefs: undefined };
      if (mode === "festlegen") return { status: "bestätigt", confirmedRefs: names(row), leader: isLeagueMatch(row.game) && row.leader ? row.leader.name : null, referee: null, plannedRefs: undefined, reopened: null, terminAenderung: null, reconfirmed: [] };
      return { status: "vorschlag", plannedRefs: names(row) };
    };
    setFixtures((fs) => {
      const next = fs.map((f) => { const row = rows.find((x) => x.game.title === f.title); return row && f.status !== "bestätigt" ? { ...f, ...patchFor(row) } : f; });
      rows.forEach((row) => { if (!fs.some((f) => f.title === row.game.title)) next.push({ ...toFixture(row.game), ...patchFor(row) }); });
      return next;
    });
    setStaged((s) => s.filter((x) => !rows.some((row) => row.game.title === x.title)));
    if (mode === "festlegen") {
      // Eine Push-Mitteilung je Schiedsrichter (nicht je Spiel)
      const per = {};
      rows.filter(full).forEach((row) => row.refs.forEach((r) => { (per[r.name] = per[r.name] || []).push(row.game); }));
      Object.entries(per).forEach(([n, gs]) => { const r = referees.find((x) => x.name === n); pushNotify(`Push an ${n}${r ? ` (${r.phone})` : ""}: ${gs.length} neue Ansetzung${gs.length === 1 ? "" : "en"} — erstes Spiel: ${gs[0].title} (${gs[0].date.split(" · ")[0]})`); });
    }
  };
  // Teilweise Auswahl speichern (ohne Benachrichtigung): Spiel bleibt offen, Auswahl wird als Entwurf abgelegt
  const saveSelection = (fixture, chosenRefs, referee) => {
    if (!allow("ansetzen")) return;
    const names = chosenRefs.map((r) => r.name);
    setFixtures((fs) => fs.map((f) => (f.id === fixture.id ? { ...f, plannedRefs: names, plannedReferee: referee ? referee.name : undefined, status: "offen" } : f)));
  };
  const confirmAssignment = (fixture, chosenRefs, extra) => {
    if (!allow("ansetzen")) return;
    const leader = extra && extra.leader;
    const referee = extra && extra.referee;
    setFixtures((fs) => fs.map((f) => (f.id === fixture.id ? { ...f, status: "bestätigt", confirmedRefs: chosenRefs.map((r) => r.name), leader: leader ? leader.name : null, referee: referee ? referee.name : null, reopened: null, terminAenderung: null, reconfirmed: [] } : f)));
    chosenRefs.forEach((r) => pushNotify(`Push an ${r.name} (${r.phone})${leader && leader.id === r.id ? " als verantwortlicher Leiter" : ""}: Neue Ansetzung bestätigt — ${fixture.title}`));
    if (referee) pushNotify(`Push an ${referee.name} (${referee.phone}) als Referee: Neue Ansetzung bestätigt — ${fixture.title}`);
  };
  // Sicherheit: Zugriffsprotokoll, Rechteprüfung bei jeder Aktion, automatische Abmeldung nach Inaktivität
  const logAccess = (text, who) => setAccessLog((l) => [{ id: Date.now() + Math.random(), at: new Date().toLocaleString("de-DE"), text: `${who || (auth ? `${auth.username} (${ROLE_LABEL[auth.role]})` : "System")}: ${text}` }, ...l].slice(0, 100));
  const allow = (...keys) => {
    const ok = !!auth && keys.some((k) => can(auth.role, k));
    if (!ok) logAccess(`Aktion abgelehnt — Berechtigung fehlt (${keys.join(" / ")})`);
    return ok;
  };
  useEffect(() => {
    if (!auth) return;
    const SESSION_MS = 15 * 60 * 1000;
    let t = null;
    const out = () => {
      logAccess("Automatische Abmeldung nach 15 Minuten Inaktivität");
      setAuth(null); setView(null); setOpenFixture(null);
      setSessionNote("Aus Sicherheitsgründen wurdest du nach 15 Minuten Inaktivität abgemeldet.");
    };
    const reset = () => { clearTimeout(t); t = setTimeout(out, SESSION_MS); };
    const evs = ["mousemove", "keydown", "click", "touchstart", "scroll"];
    evs.forEach((e) => window.addEventListener(e, reset, { passive: true }));
    reset();
    return () => { clearTimeout(t); evs.forEach((e) => window.removeEventListener(e, reset)); };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [auth]);
  // Lizenz-Erinnerung: 1 Jahr vor Lizenzende Push an den Schiedsrichter (einmal je Lizenzzeitraum)
  useEffect(() => {
    if (!auth) return;
    const due = referees.filter(reminderDue);
    if (due.length === 0) return;
    setReferees((rs) => rs.map((r) => (due.some((d) => d.id === r.id) ? { ...r, licenseRemindedFor: r.licenseValidUntil } : r)));
    due.forEach((r) => pushNotify(`Push an ${r.name} (${r.phone}): Deine Lizenz (${r.license}) läuft am ${r.licenseValidUntil} ab — in 12 Monaten. Bitte rechtzeitig einen Leistungsnachweis erbringen.`));
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [auth]);
  const reconfirmTermin = (fixture) => {
    if (!allow("eigene")) return;
    setFixtures((fs) => fs.map((f) => {
      if (f.id !== fixture.id) return f;
      const done = [...(f.reconfirmed || []), CURRENT_REFEREE_NAME];
      const all = [...f.confirmedRefs, ...(f.referee ? [f.referee] : [])];
      return all.every((n) => done.includes(n)) ? { ...f, terminAenderung: null, reconfirmed: [] } : { ...f, reconfirmed: done };
    }));
  };
  const saveReport = (fixture, rep, author) => {
    if (!allow("eigene", "ansetzen")) return;
    const has = rep.notiz || (rep.karten || []).length > 0;
    setFixtures((fs) => fs.map((f) => (f.id === fixture.id ? { ...f, report: has ? { ...rep, von: author || CURRENT_REFEREE_NAME, am: new Date().toLocaleDateString("de-DE") } : undefined } : f)));
  };
  const editGame = (fixture, patch) => { if (!allow("ansetzen")) return; setFixtures((fs) => fs.map((f) => (f.id === fixture.id ? { ...f, ...patch } : f))); };
  const addBeobachtung = (b) => { if (!allow("personen")) return; setBeobachtungen((list) => [...list, { id: "b" + Date.now(), ...b }]); };
  const handleRespond = (req, answer, comment) => {
    if (!allow("eigene")) return;
    setResponses((s) => {
      const g = { ...(s[req.id] || {}) };
      if (answer) g[CURRENT_REFEREE_NAME] = { answer, comment, at: new Date().toISOString() };
      else delete g[CURRENT_REFEREE_NAME];
      return { ...s, [req.id]: g };
    });
  };
  // Ansetzung zurücknehmen (Admin oder Schiedsrichter): Das Spiel ist wieder offen und erscheint erneut in der Abfrage
  const reopenFixture = (fixture, note) => {
    setFixtures((fs) => fs.map((f) => (f.id === fixture.id ? { ...f, status: "offen", confirmedRefs: [], leader: null, referee: null, plannedRefs: undefined, plannedReferee: undefined, reopened: note, terminAenderung: null, reconfirmed: [] } : f)));
    setResponses((s) => { const g = { ...(s[fixture.id] || {}) }; [...(fixture.confirmedRefs || []), ...(fixture.referee ? [fixture.referee] : [])].forEach((n) => { delete g[n]; }); return { ...s, [fixture.id]: g }; });
  };
  const assignedNames = (fixture) => [...(fixture.confirmedRefs || []), ...(fixture.referee ? [fixture.referee] : [])];
  // Push an Schiedsrichter bei Rücknahme einer Ansetzung
  const pushRevocation = (names, fixture, hint) => names.forEach((n) => { const r = referees.find((x) => x.name === n); pushNotify(`Push an ${n}${r ? ` (${r.phone})` : ""}: Ansetzung zurückgenommen${hint ? ` (${hint})` : ""} — ${fixture.title}`); });
  const undoAssignment = (fixture) => {
    if (!allow("ansetzen")) return;
    reopenFixture(fixture, "Ansetzung vom Admin zurückgenommen");
    pushRevocation(assignedNames(fixture), fixture);
  };
  const withdrawAssignment = (fixture, reason) => {
    if (!allow("eigene")) return;
    const me = CURRENT_REFEREE_NAME;
    const remaining = (fixture.confirmedRefs || []).filter((n) => n !== me);
    const complete = remaining.length >= fixture.neededCount && (fixture.type !== "Turnier" || (fixture.referee && fixture.referee !== me));
    pushNotify(`Push an Ansetzer: ${me} hat die Ansetzung zurückgegeben — ${fixture.title}${reason ? ` ("${reason}")` : ""}`);
    if (complete) {
      // Turnier mit mehr als der Mindestzahl: Ansetzung bleibt bestehen, nur dieser Schiedsrichter entfällt
      setFixtures((fs) => fs.map((f) => (f.id === fixture.id ? { ...f, confirmedRefs: remaining } : f)));
      setResponses((s) => { const g = { ...(s[fixture.id] || {}) }; delete g[me]; return { ...s, [fixture.id]: g }; });
      return;
    }
    reopenFixture(fixture, `Von ${me} zurückgegeben${reason ? ` („${reason}“)` : ""}`);
    pushRevocation(assignedNames(fixture).filter((n) => n !== me), fixture, `${me} hat zurückgegeben`);
  };
  const createManualFixture = (fixture) => { if (!allow("ansetzen")) return; setFixtures((f) => [...f, fixture]); };
  const addNachweis = (refId, text, newValidUntil) => {
    if (!allow("personen")) return;
    setReferees((rs) => rs.map((r) => (r.id === refId ? { ...r, licenseValidUntil: newValidUntil, nachweise: [...r.nachweise, { date: new Date().toLocaleDateString("de-DE"), text }] } : r)));
    const r = referees.find((x) => x.id === refId);
    if (r) pushNotify(`Push an ${r.name} (${r.phone}): Lizenz verlängert bis ${newValidUntil} (Leistungsnachweis eingetragen)`);
  };
  const syncLicenseFromNuliga = (refId) => {
    if (!allow("personen")) return;
    const n = NULIGA_LICENSE_DATA[refId];
    const v = NULIGA_VEREIN[refId];
    const r = referees.find((x) => x.id === refId);
    if (!r) return;
    if (!n && !v) return;
    setReferees((rs) => rs.map((x) => (x.id === refId ? { ...x, ...(n ? { license: n.license, licenseValidUntil: n.licenseValidUntil } : {}), ...(v ? { verein: v } : {}), licenseSyncedAt: new Date().toLocaleDateString("de-DE") } : x)));
    // Push nur bei tatsächlicher Lizenzänderung; Vereins-Abgleich löst keine Mitteilung aus
    if (n && (n.license !== r.license || n.licenseValidUntil !== r.licenseValidUntil)) pushNotify(`Push an ${r.name} (${r.phone}): Lizenz geändert — ${n.license}, gültig bis ${n.licenseValidUntil}`);
  };
  const togglePersp = (refId, key, label) => {
    if (!allow("personen")) return;
    const r = referees.find((x) => x.id === refId);
    setReferees((rs) => rs.map((x) => (x.id === refId ? { ...x, [key]: !x[key] } : x)));
  };
  const syncAllLicensesFromNuliga = () => {
    referees.forEach((r) => syncLicenseFromNuliga(r.id));
  };
  const manualLicenseUpdate = (refId, license, validUntil) => {
    if (!allow("personen")) return;
    setReferees((rs) => rs.map((r) => (r.id === refId ? { ...r, license, licenseValidUntil: validUntil } : r)));
    const r = referees.find((x) => x.id === refId);
    if (r && (r.license !== license || r.licenseValidUntil !== validUntil)) pushNotify(`Push an ${r.name} (${r.phone}): Lizenz geändert — ${license}, gültig bis ${validUntil}`);
  };
  const updateRefereeProfile = (patch) => {
    if (!allow("eigene")) return;
    setReferees((rs) => rs.map((r) => (r.name === CURRENT_REFEREE_NAME ? { ...r, ...patch } : r)));
  };

  if (!auth) return <LoginScreen onLogin={handleLogin} notice={sessionNote} />;

  const licenseUpdatesPending = referees.filter((r) => { const n = NULIGA_LICENSE_DATA[r.id]; return n && (n.license !== r.license || n.licenseValidUntil !== r.licenseValidUntil); }).length;
  const activeFixtures = fixtures.filter((f) => !isPast(f));
  const stagedActive = staged.filter((s) => !isPast(s));
  // Spiele der Saisonabfrage: alle noch nicht bestätigten Ligaspiele (inkl. noch nicht übernommener NuLiga-Spiele) und Turniere
  const askGames = (() => {
    const league = buildSeasonGames(activeFixtures, stagedActive).filter((g) => g.status !== "bestätigt");
    const ids = new Set(league.map((g) => g.id));
    const others = activeFixtures.filter((f) => f.status !== "bestätigt" && !ids.has(f.id));
    return [...league, ...others].sort((a, b) => (gameDate(a) - gameDate(b)) || (startMin(a) - startMin(b)));
  })();
  const adminNav = [
    { id: "ansetzungen", label: "Abfragen (Ansetzung)", icon: CalendarDays },
    { id: "import", label: "NuLiga-Import", icon: RefreshCw, badge: stagedActive.filter((s) => classifyMatch(s).standard).length },
    { id: "statistik", label: "Statistik", icon: BarChart3 },
    { id: "karten", label: "Karten & Notizen", icon: MessageSquare },
    { id: "archiv", label: "Archiv", icon: Inbox },
    { id: "saisonplanung", label: "Saisonplanung", icon: CalendarClock },
    { id: "lizenzen", label: "Lizenzen", icon: Award, badge: licenseUpdatesPending },
    { id: "schiedsrichter", label: "Schiedsrichter", icon: Users },
    { id: "beobachtung", label: "Beobachtung", icon: TrendingUp },
    { id: "regelwerke", label: "Regelwerke", icon: BookOpen },
    { id: "unterkuenfte", label: "Unterkünfte", icon: BedDouble },
    { id: "karte", label: "Standorte", icon: MapPin },
  ];
  const schiriNav = [
    { id: "abfrage", label: "Abfrage", icon: Inbox },
    { id: "ansetzungstag", label: "Ansetzungen", icon: CalendarCheck2 },
    { id: "archiv", label: "Archiv", icon: CalendarClock },
    { id: "unterkuenfte", label: "Unterkünfte", icon: BedDouble },
    { id: "regelwerke", label: "Regelwerke", icon: BookOpen, badge: openReads(regel, CURRENT_REFEREE_NAME).length },
    { id: "meine-daten", label: "Meine Daten", icon: User },
  ];
  const lesendIds = ["ansetzungen", "statistik", "karten", "archiv", "regelwerke", "unterkuenfte", "karte"];
  const nav = auth.role === "master" ? [...adminNav, { id: "rollen", label: "Rollen", icon: ShieldCheck }] : auth.role === "admin" ? adminNav : auth.role === "lesend" ? adminNav.filter((n) => lesendIds.includes(n.id)) : schiriNav;
  const perm = (key) => can(auth.role, key);

  return (
    <div style={{ ...bodyFont, background: COLORS.bg, minHeight: "100vh", color: COLORS.ink }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: currentColor; cursor: pointer; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes slideIn { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: translateX(0); } }
      `}</style>
      <PushToasts toasts={toasts} />
      <div style={{ display: "flex", minHeight: "100vh" }}>
        <div style={{ width: 208, background: COLORS.court, padding: "22px 16px", flexShrink: 0, display: "flex", flexDirection: "column" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6 }}>
            <div style={{ width: 8, height: 8, borderRadius: "50%", background: COLORS.amber }} />
            <span style={{ ...displayFont, color: "#fff", fontSize: 16 }}>Ansetzung</span>
          </div>
          <div style={{ ...monoFont, fontSize: 10.5, color: "rgba(255,255,255,0.55)", textTransform: "uppercase", letterSpacing: "0.05em", marginBottom: 24 }}>{auth.role === "master" ? "Backend · Master-Admin" : auth.role === "admin" ? "Backend · Admin" : auth.role === "lesend" ? "Backend · Lesend" : "Frontend · Schiedsrichter"}</div>
          {nav.map((n) => {
            const Icon = n.icon; const active = view === n.id;
            return (
              <button key={n.id} onClick={() => { setView(n.id); setOpenFixture(null); }} style={{ width: "100%", display: "flex", alignItems: "center", gap: 10, background: active ? "rgba(255,255,255,0.14)" : "transparent", border: "none", color: active ? "#fff" : "rgba(255,255,255,0.65)", padding: "9px 10px", borderRadius: 8, fontSize: 13.5, ...bodyFont, fontWeight: active ? 600 : 400, cursor: "pointer", marginBottom: 4, textAlign: "left" }}>
                <Icon size={15} /> {n.label}
                {!!n.badge && <span style={{ marginLeft: "auto", background: COLORS.amber, color: "#3A2A0F", ...monoFont, fontSize: 10.5, borderRadius: 10, padding: "1px 6px" }}>{n.badge}</span>}
              </button>
            );
          })}
          <div style={{ flex: 1 }} />
          <button onClick={handleLogout} style={{ display: "flex", alignItems: "center", gap: 8, background: "transparent", border: "none", color: "rgba(255,255,255,0.55)", fontSize: 12.5, ...bodyFont, cursor: "pointer", padding: "9px 10px" }}><LogOut size={14} /> Abmelden</button>
        </div>

        <div style={{ flex: 1, display: "flex", flexDirection: "column" }}>
          <div style={{ display: "flex", justifyContent: "flex-end", alignItems: "center", gap: 12, padding: "14px 30px", borderBottom: `1px solid ${COLORS.hair}` }}>
            <NotificationBell notifications={notifications} />
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
              <div style={{ width: 26, height: 26, borderRadius: "50%", background: "#F1EFE6", display: "flex", alignItems: "center", justifyContent: "center", ...monoFont, fontSize: 11, color: COLORS.court }}>{auth.username.slice(0, 2).toUpperCase()}</div>
              <span style={{ ...bodyFont, fontSize: 12.5, color: COLORS.inkSoft }}>{auth.username}</span>
            </div>
          </div>
          <div style={{ flex: 1, padding: "30px 40px", maxWidth: 960 }}>
            {view === "ansetzungen" && (openFixture ? <VorschlagDetail fixture={openFixture} referees={referees} onBack={() => setOpenFixture(null)} onConfirm={confirmAssignment} onUndo={undoAssignment} onSave={saveSelection} readOnly={!perm("ansetzen")} responses={responses} showResponses={perm("ansetzen")} abfrageClosed={abfrageStatus(abfrage).state === "beendet"} /> : <AnsetzungsUebersicht readOnly={!perm("ansetzen")} responses={responses} referees={referees} showResponses={perm("ansetzen")} abfrageClosed={abfrageStatus(abfrage).state === "beendet"} fixtures={activeFixtures} onOpen={setOpenFixture} onCreate={createManualFixture} />)}
            {view === "import" && <NuligaImport staged={stagedActive} fixtures={fixtures} adminName={auth && auth.username} onImport={importOne} onImportAll={importAll} />}
            {view === "statistik" && <StatistikTab referees={referees} onAddNachweis={addNachweis} readOnly={!perm("personen")} />}
            {view === "saisonplanung" && perm("saisonplanung") && <SaisonPlanung readOnly={!perm("saisonplanung")} fixtures={activeFixtures} staged={stagedActive} referees={referees} responses={responses} abfrage={abfrage} onSetAbfrage={(v) => { if (allow("saisonplanung")) setAbfrage(v); }} onApply={applySeasonPlan} />}
            {view === "regelwerke" && <RegelwerkeTab regel={regel} isAdmin={perm("regel_verwalten")} isReferee={auth.role === "schiri"} adminName={auth.username} meName={CURRENT_REFEREE_NAME} referees={referees} onPush={pushNotify} />}
            {view === "schiedsrichter" && <SchiedsrichterListe referees={referees} onReveal={() => logAccess("Kontaktdaten in der Schiedsrichter-Liste angezeigt")} />}
            {view === "rollen" && perm("rollen") && <RollenVerwaltung users={users} log={roleLog} accessLog={accessLog} onSetRole={setUserRole} onToggleActive={toggleUserActive} onAdd={addUser} />}
            {view === "karten" && <KartenStatistik fixtures={fixtures} referees={referees} />}
            {view === "archiv" && <ArchivTab fixtures={fixtures} mode={auth.role === "schiri" ? "referee" : "admin"} meName={CURRENT_REFEREE_NAME} onSaveReport={(f, rep) => saveReport(f, rep, auth.role === "schiri" ? CURRENT_REFEREE_NAME : auth.username)} canEdit={perm("ansetzen")} referees={referees} onEditGame={editGame} />}
            {view === "beobachtung" && <BeobachtungsTab referees={referees} items={beobachtungen} onAdd={addBeobachtung} adminName={auth.username} />}
            {view === "lizenzen" && <LizenzVerwaltung referees={referees} onSync={syncLicenseFromNuliga} onSyncAll={syncAllLicensesFromNuliga} onManualUpdate={manualLicenseUpdate} onTogglePersp={togglePersp} />}
            {view === "unterkuenfte" && <UnterkuenfteTab hs={hs} fixtures={activeFixtures} userName={auth.role === "schiri" ? CURRENT_REFEREE_NAME : auth.username} canManage={perm("unterkunft_verwalten")} canPropose={perm("unterkunft_vorschlagen")} />}
            {view === "karte" && <KartenAnsicht referees={referees} fixtures={fixtures} hotels={hs.items || []} />}
            {view === "abfrage" && <AbfrageTab fixtures={askGames} me={referees.find((r) => r.name === CURRENT_REFEREE_NAME)} responses={responses} onRespond={handleRespond} abfrage={abfrage} />}
            {view === "ansetzungstag" && <AnsetzungstagView fixtures={activeFixtures} onWithdraw={withdrawAssignment} onReconfirm={reconfirmTermin} onSaveReport={saveReport} />}
            {view === "meine-daten" && <MeineDatenTab me={referees.find((r) => r.name === CURRENT_REFEREE_NAME)} onUpdate={updateRefereeProfile} />}
          </div>
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
