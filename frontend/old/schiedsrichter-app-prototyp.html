// Verein-Abgleich: Schiedsrichter dürfen keine Mannschaften des eigenen Vereins leiten.
function teamsOf(f) {
  if (f.homeTeam || f.awayTeam) return [f.homeTeam, f.awayTeam].filter(Boolean);
  const t = f.title.split("·").pop().trim();
  return t.includes(" vs. ") ? t.split(" vs. ").map((s) => s.trim()) : [];
}
function clubConflict(r, f) {
  if (!r.verein) return false;
  return teamsOf(f).some((t) => t === r.verein || t.startsWith(r.verein + " "));
}
const isLeagueMatch = (f) => f.type === "Begegnung" && IMPORT_LIGEN.includes(f.wettbewerb);
// Ranghöher = höhere Lizenzstufe; bei Gleichstand mehr Einsätze in der Saison
function pickLeader(refs) {
  return [...refs].sort((a, b) => licenseRank(b.license) - licenseRank(a.license) || b.saison - a.saison)[0];
}

function weightedScore(r, weights) {
  const distScore = Math.max(0, 1 - r.km / 40);
  const raw = distScore * weights.distance + r.avail * weights.avail + r.fair * weights.fair;
  return Math.round(raw * 100);
}

function ShuttleCompass({ weights, score }) {
  const size = 120, cx = size / 2, cy = size / 2, r = 46;
  const segments = [
    { key: "distance", color: COLORS.courtLine, value: weights.distance },
    { key: "avail", color: COLORS.moss, value: weights.avail },
    { key: "fair", color: COLORS.amber, value: weights.fair },
  ];
  const total = segments.reduce((s, x) => s + x.value, 0) || 1;
  let angleCursor = -90;
  const arcs = segments.map((seg) => {
    const sweep = (seg.value / total) * 360;
    const start = angleCursor, end = angleCursor + sweep;
    angleCursor = end;
    const toXY = (deg) => { const rad = (deg * Math.PI) / 180; return [cx + r * Math.cos(rad), cy + r * Math.sin(rad)]; };
    const [x1, y1] = toXY(start), [x2, y2] = toXY(end);
    const large = sweep > 180 ? 1 : 0;
    return <path key={seg.key} d={`M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2} Z`} fill={seg.color} opacity={0.85} />;
  });
  const needleAngle = -90 + (score / 100) * 360;
  const needleRad = (needleAngle * Math.PI) / 180;
  const nx = cx + (r + 9) * Math.cos(needleRad), ny = cy + (r + 9) * Math.sin(needleRad);
  return (
    <svg viewBox={`0 0 ${size} ${size}`} width={size} height={size}>
      <circle cx={cx} cy={cy} r={r + 12} fill="#FFFFFF" stroke={COLORS.hair} strokeWidth="1" />
      <g>{arcs}</g>
      <circle cx={cx} cy={cy} r={27} fill="#FFFFFF" />
      <text x={cx} y={cy - 2} textAnchor="middle" style={{ ...displayFont, fontSize: 19, fill: COLORS.ink }}>{score}</text>
      <text x={cx} y={cy + 13} textAnchor="middle" style={{ ...monoFont, fontSize: 8, fill: COLORS.inkSoft }}>SCORE</text>
      <line x1={cx} y1={cy} x2={nx} y2={ny} stroke={COLORS.ink} strokeWidth="2" strokeLinecap="round" />
      <circle cx={nx} cy={ny} r="3" fill={COLORS.ink} />
    </svg>
  );
}

function VorschlagDetail({ fixture, referees, onBack, onConfirm, onUndo, onSave, readOnly, responses, showResponses, abfrageClosed }) {
  const [weights, setWeights] = useState({ distance: 0.4, avail: 0.35, fair: 0.25 });
  const [selected, setSelected] = useState(null); // initialized once ranked is known
  const [decided, setDecided] = useState(!!readOnly || fixture.status === "bestätigt");
  const [confirmUndo, setConfirmUndo] = useState(false);
  const [savedMsg, setSavedMsg] = useState("");

  const isTurnier = fixture.type === "Turnier";
  const isLeague = isLeagueMatch(fixture);
  const [refereeId, setRefereeId] = useState(null);

  const scored = useMemo(() => referees.map((r) => ({ ...r, score: weightedScore(r, weights), conflict: clubConflict(r, fixture), blocked: !!isBlocked(r, fixture), declined: answerOf(responses, fixture, r) === "abgesagt", zusage: answerOf(responses, fixture, r) === "zugesagt", eligible: licenseRank(r.license) >= fixture.requiredLevel })), [referees, weights, fixture, responses]);
  // Reihenfolge: zuerst Verfügbare ohne Vereinsbezug, dann Verfügbare aus dem eigenen Verein, zuletzt nicht Verfügbare
  const tier = (r) => (r.conflict ? 1 : 0) + (r.avail && !r.blocked && !r.declined ? 0 : 2);
  const eligible = scored.filter((r) => r.eligible).sort((a, b) => tier(a) - tier(b) || (b.zusage ? 1 : 0) - (a.zusage ? 1 : 0) || b.score - a.score);
  const slotsNeeded = fixture.neededCount + (isTurnier ? 1 : 0);
  const ownClubAllowed = eligible.filter((r) => !r.conflict && r.avail && !r.blocked && !r.declined).length < slotsNeeded; // eigener Verein nur als Notlösung
  const ineligible = scored.filter((r) => !r.eligible);
  const umpirePool = eligible.filter((r) => r.id !== refereeId);

  useEffect(() => {
    // Turnier: Referee = höchste Lizenz, bei Gleichstand bester Score; Schiedsrichter danach aus dem Rest
    const done = fixture.status === "bestätigt";
    const refId = done ? (eligible.find((r) => r.name === fixture.referee)?.id ?? null) : fixture.plannedRefs ? (eligible.find((r) => r.name === fixture.plannedReferee)?.id ?? null) : isTurnier ? ([...eligible].sort((a, b) => licenseRank(b.license) - licenseRank(a.license) || b.score - a.score)[0]?.id ?? null) : null;
    setRefereeId(refId);
    const planned = fixture.plannedRefs ? eligible.filter((r) => fixture.plannedRefs.includes(r.name)).map((r) => r.id) : null;
    const confirmedIds = eligible.filter((r) => (fixture.confirmedRefs || []).includes(r.name)).map((r) => r.id);
    setSelected(done ? confirmedIds : planned ? planned : eligible.filter((r) => r.id !== refId).slice(0, fixture.neededCount).map((r) => r.id));
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [fixture.id]);

  const toggle = (id) => {
    setSelected((sel) => (sel.includes(id) ? sel.filter((x) => x !== id) : [...sel, id]));
  };
  const pickReferee = (id) => { setRefereeId(id); setSelected((sel) => (sel || []).filter((x) => x !== id)); };

  const chosen = eligible.filter((r) => selected?.includes(r.id));
  const leader = isLeague && chosen.length > 0 ? pickLeader(chosen) : null;
  const canConfirm = selected && (isTurnier ? selected.length >= fixture.neededCount : selected.length === fixture.neededCount) && (!isTurnier || refereeId !== null);

  return (
    <div>
      <button onClick={onBack} style={{ ...bodyFont, display: "flex", alignItems: "center", gap: 4, background: "none", border: "none", color: COLORS.inkSoft, cursor: "pointer", fontSize: 13, marginBottom: 14, padding: 0 }}>
        <ChevronLeft size={15} /> Zurück zur Übersicht
      </button>

      <h1 style={{ ...displayFont, fontSize: 22, color: COLORS.ink, margin: "0 0 4px" }}>{fixture.title}</h1>
      <div style={{ ...bodyFont, fontSize: 13, color: COLORS.inkSoft, marginBottom: 4 }}>{fixture.date} · {fixture.venue}</div>
      <div style={{ ...bodyFont, fontSize: 12, color: COLORS.inkSoft, marginBottom: 18 }}>
        {fixture.wettbewerb} · benötigt {isTurnier && "mindestens "}<strong>{fixture.neededCount}</strong> Schiedsrichter{isTurnier && " (mehr möglich)"}{isLeague && " (einer als verantwortlicher Leiter)"}{isTurnier && " + 1 Referee (Oberschiedsrichter)"} · mind. <strong>{requiredLevelLabel(fixture.requiredLevel)}</strong>
        {isTurnier && " · gilt für den gesamten Turniertag"}
      </div>

      <div style={{ display: "flex", gap: 20, flexWrap: "wrap" }}>
        <div style={{ background: COLORS.panel, border: `1px solid ${COLORS.hair}`, borderRadius: 12, padding: 18, width: 250, flexShrink: 0 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 14 }}>
            <Gauge size={15} color={COLORS.court} />
            <span style={{ ...bodyFont, fontSize: 13, fontWeight: 600, color: COLORS.ink }}>Gewichtung</span>
          </div>
          <WeightGauge label="Entfernung" value={weights.distance} color={COLORS.courtLine} onChange={(v) => setWeights((w) => ({ ...w, distance: v }))} />
          <WeightGauge label="Verfügbarkeit" value={weights.avail} color={COLORS.moss} onChange={(v) => setWeights((w) => ({ ...w, avail: v }))} />
          <WeightGauge label="Faire Verteilung" value={weights.fair} color={COLORS.amber} onChange={(v) => setWeights((w) => ({ ...w, fair: v }))} />
          <div style={{ display: "flex", justifyContent: "center", marginTop: 16 }}>
            <ShuttleCompass weights={weights} score={eligible[0]?.score ?? 0} />
          </div>
        </div>

        <div style={{ flex: 1, minWidth: 280 }}>
          {isTurnier && (
            <div style={{ marginBottom: 18 }}>
              <div style={{ ...bodyFont, fontSize: 12, color: refereeId !== null ? COLORS.moss : COLORS.amber, marginBottom: 10, fontWeight: 600 }}>Referee (Oberschiedsrichter) — 1 Person</div>
              {eligible.map((r) => {
                const isRef = refereeId === r.id;
                return (
                  <label key={"ref" + r.id} style={{ background: COLORS.panel, border: `1px solid ${isRef ? COLORS.amber : COLORS.hair}`, borderRadius: 10, padding: "10px 16px", marginBottom: 8, display: "flex", alignItems: "center", gap: 12, opacity: r.avail ? 1 : 0.5, cursor: decided ? "default" : "pointer" }}>
                    <input type="radio" name="referee" checked={isRef} disabled={decided || (r.conflict && !ownClubAllowed && !isRef) || ((r.blocked || r.declined) && !isRef)} onChange={() => pickReferee(r.id)} style={{ width: 16, height: 16, accentColor: COLORS.amber }} />
                    <div style={{ flex: 1 }}>
                      <span style={{ ...bodyFont, fontSize: 13.5, fontWeight: 600, color: COLORS.ink }}>{r.name}</span>
                      <span style={{ ...bodyFont, fontSize: 12, color: COLORS.inkSoft }}> · {r.license}</span>
                    </div>
                    {isRef && <CourtBadge tone="amber">Referee</CourtBadge>}
                    {r.conflict && <CourtBadge tone="rust">Eigener Verein</CourtBadge>}
                    {r.blocked && <CourtBadge tone="rust">Sperrzeit</CourtBadge>}
                    {showResponses && answerObj(responses, fixture, r) && <CourtBadge tone={answerOf(responses, fixture, r) === "zugesagt" ? "moss" : "rust"}>{answerOf(responses, fixture, r) === "zugesagt" ? "Zugesagt" : "Abgesagt"}</CourtBadge>}
                  </label>
                );
              })}
            </div>
          )}
          <div style={{ ...bodyFont, fontSize: 12, color: selected && canConfirm ? COLORS.moss : COLORS.amber, marginBottom: 10, fontWeight: 600 }}>
            {isTurnier ? `${selected ? selected.length : 0} ausgewählt (mindestens ${fixture.neededCount}, weitere möglich)` : `${selected ? selected.length : 0} von ${fixture.neededCount} benötigten Schiedsrichtern ausgewählt`}
          </div>
          {isLeague && (
            <div style={{ ...bodyFont, fontSize: 11.5, color: COLORS.inkSoft, marginBottom: 10 }}>Der ranghöhere Schiedsrichter (höhere Lizenzstufe, bei Gleichstand mehr Einsätze in der Saison) wird automatisch zum verantwortlichen Leiter ernannt.</div>
          )}
          {eligible.some((r) => r.conflict) && (
            <div style={{ ...bodyFont, fontSize: 11.5, color: COLORS.inkSoft, marginBottom: 10 }}>Schiedsrichter dürfen nicht ihren eigenen Verein leiten — außer, es stehen nicht genug andere zur Verfügung{ownClubAllowed ? " (hier der Fall)" : ""}.</div>
          )}
          {umpirePool.map((r) => {
            const isSel = selected?.includes(r.id);
            const isTop = umpirePool.slice(0, fixture.neededCount).some((t) => t.id === r.id);
            return (
              <label key={r.id} style={{ background: COLORS.panel, border: `1px solid ${isSel ? COLORS.court : COLORS.hair}`, borderRadius: 10, padding: "12px 16px", marginBottom: 10, display: "flex", alignItems: "center", gap: 12, opacity: r.avail ? 1 : 0.5, cursor: decided ? "default" : "pointer" }}>
                <input type="checkbox" checked={!!isSel} disabled={decided || (r.conflict && !ownClubAllowed && !isSel) || ((r.blocked || r.declined) && !isSel)} onChange={() => toggle(r.id)} style={{ width: 16, height: 16, accentColor: COLORS.court }} />
                <div style={{ ...monoFont, width: 30, height: 30, borderRadius: "50%", background: isSel ? COLORS.court : "#F1EFE6", color: isSel ? "#fff" : COLORS.inkSoft, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 12, flexShrink: 0 }}>{r.score}</div>
                <div style={{ flex: 1 }}>
                  <div style={{ ...bodyFont, fontSize: 14, fontWeight: 600, color: COLORS.ink }}>
                    {r.name} {isTop && <CourtBadge tone="court">Top-Vorschlag</CourtBadge>} {leader && leader.id === r.id && <CourtBadge tone="amber">Verantwortlicher Leiter</CourtBadge>} {r.conflict && <CourtBadge tone="rust">Eigener Verein</CourtBadge>} {r.blocked && <CourtBadge tone="rust">Sperrzeit</CourtBadge>}
                  </div>
                  <div style={{ ...bodyFont, fontSize: 12, color: COLORS.inkSoft, display: "flex", gap: 10, marginTop: 3, flexWrap: "wrap" }}>
                    <span>{r.license}</span><span>· {r.verein}</span>{r.perspInternational && <span>· Perspektiv-Team International</span>}{r.perspNational && <span>· Perspektiv-Team National</span>}<span>· {r.km} km</span><span>· {r.load} Einsätze/Monat</span>
                    {!r.avail && <span style={{ color: COLORS.rust }}>· nicht verfügbar</span>}
                  </div>
                  {showResponses && (() => {
                    const a = answerObj(responses, fixture, r);
                    return (
                      <div style={{ marginTop: 4 }}>
                        {a ? <CourtBadge tone={a.answer === "zugesagt" ? "moss" : "rust"}>{a.answer === "zugesagt" ? "Zugesagt" : "Abgesagt"}</CourtBadge> : <span style={{ ...bodyFont, fontSize: 11.5, color: abfrageClosed ? COLORS.rust : COLORS.inkSoft }}>{abfrageClosed ? "Keine Rückmeldung" : "Rückmeldung ausstehend"}</span>}
                        {a && a.comment && <div style={{ ...bodyFont, fontSize: 12, color: COLORS.ink, fontStyle: "italic", marginTop: 3 }}>„{a.comment}“</div>}
                      </div>
                    );
                  })()}
                </div>
              </label>
            );
          })}

          {ineligible.length > 0 && (
            <div style={{ marginTop: 14 }}>
              <div style={{ ...bodyFont, fontSize: 11.5, color: COLORS.inkSoft, marginBottom: 6 }}>Nicht lizenziert für diese Veranstaltung:</div>
              {ineligible.map((r) => (
                <div key={r.id} style={{ background: "#F1EFE6", borderRadius: 10, padding: "9px 14px", marginBottom: 6, display: "flex", alignItems: "center", gap: 10, opacity: 0.7 }}>
                  <div style={{ ...bodyFont, fontSize: 13, color: COLORS.inkSoft }}>{r.name}</div>
                  <span style={{ ...bodyFont, fontSize: 11.5, color: COLORS.inkSoft }}>· {r.license} (benötigt: {requiredLevelLabel(fixture.requiredLevel)})</span>
                </div>
              ))}
            </div>
          )}

          {readOnly ? (
            <div style={{ ...bodyFont, fontSize: 12.5, color: COLORS.inkSoft, marginTop: 14 }}>Nur Lesezugriff — mit deiner Rolle können Ansetzungen nicht geändert werden.</div>
          ) : !decided ? (
            <div>
              <button
                onClick={() => {
                  const referee = eligible.find((r) => r.id === refereeId) || null;
                  if (canConfirm) { setDecided(true); setSavedMsg(""); onConfirm(fixture, chosen, { leader, referee }); }
                  else { onSave(fixture, chosen, referee); setSavedMsg("Auswahl gespeichert — noch nicht vollständig, daher keine Benachrichtigung."); }
                }}
                style={{ marginTop: 16, background: canConfirm ? COLORS.court : "#fff", color: canConfirm ? "#fff" : COLORS.court, border: canConfirm ? "none" : `1px solid ${COLORS.court}`, borderRadius: 8, padding: "10px 18px", fontSize: 13, fontWeight: 600, cursor: "pointer", display: "flex", alignItems: "center", gap: 6 }}
              >
                <Check size={15} /> {canConfirm ? "Auswahl bestätigen" : "Auswahl speichern"}
              </button>
              {!canConfirm && <div style={{ ...bodyFont, fontSize: 11.5, color: COLORS.inkSoft, marginTop: 6 }}>Noch nicht vollständig besetzt ({selected ? selected.length : 0} von {fixture.neededCount}{isTurnier ? `, Referee ${refereeId !== null ? "gewählt" : "fehlt"}` : ""}). Speichern legt die Auswahl ab, ohne die Schiedsrichter zu benachrichtigen; bestätigt wird bei vollständiger Besetzung.</div>}
              {savedMsg && <div style={{ ...bodyFont, fontSize: 12.5, color: COLORS.moss, marginTop: 6 }}>✓ {savedMsg}</div>}
            </div>
          ) : (
            <div style={{ marginTop: 14 }}>
              <div style={{ ...bodyFont, fontSize: 13, color: COLORS.moss }}>✓ Ansetzung bestätigt — alle eingesetzten Schiedsrichter wurden per Push benachrichtigt.</div>
              {!confirmUndo ? (
                <button onClick={() => setConfirmUndo(true)} style={{ marginTop: 10, background: "#fff", color: COLORS.rust, border: `1px solid ${COLORS.rust}`, borderRadius: 8, padding: "8px 14px", fontSize: 12.5, cursor: "pointer", ...bodyFont }}>Ansetzung rückgängig machen</button>
              ) : (
                <div style={{ background: "#F8F6EF", borderRadius: 8, padding: 10, marginTop: 10, display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
                  <span style={{ ...bodyFont, fontSize: 12.5, color: COLORS.ink, flex: 1, minWidth: 200 }}>Ansetzung zurücknehmen? Die Schiedsrichter werden benachrichtigt, das Spiel erscheint wieder in der Abfrage.</span>
                  <button onClick={() => { onUndo(fixture); setDecided(false); setConfirmUndo(false); }} style={{ background: COLORS.rust, color: "#fff", border: "none", borderRadius: 6, padding: "7px 12px", fontSize: 12, fontWeight: 600, cursor: "pointer", ...bodyFont }}>Ja, rückgängig machen</button>
                  <button onClick={() => setConfirmUndo(false)} style={{ background: "#fff", color: COLORS.inkSoft, border: `1px solid ${COLORS.hair}`, borderRadius: 6, padding: "7px 12px", fontSize: 12, cursor: "pointer", ...bodyFont }}>Abbrechen</button>
                </div>
              )}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function NuligaImport({ staged, fixtures, adminName, onImport, onImportAll }) {
  const [syncing, setSyncing] = useState(false);
  const [lastSync, setLastSync] = useState("vor 2 Tagen");
  const [imported, setImported] = useState({});
  const [confirmId, setConfirmId] = useState(null);
  const [gf, setGf] = useState(GF0);
  const standardItems = staged.filter((s) => classifyMatch(s).standard && gameMatches(s, gf));
  const requestItems = staged.filter((s) => !classifyMatch(s).standard && gameMatches(s, gf));
  const runSync = () => { setSyncing(true); setTimeout(() => { setSyncing(false); setLastSync("gerade eben"); }, 900); };
  const handleImportOne = (item) => { setImported((s) => ({ ...s, [item.id]: true })); onImport(item); };
  const handleRequest = (item) => { setImported((s) => ({ ...s, [item.id]: true })); setConfirmId(null); onImport(item, { requestedBy: adminName || "Admin" }); };
  const handleImportAll = () => {
    const rest = standardItems.filter((s) => !imported[s.id]);
    setImported((s) => { const next = { ...s }; rest.forEach((r) => (next[r.id] = true)); return next; });
    onImportAll(rest);
  };
  const openCount = standardItems.filter((s) => !imported[s.id]).length;
  return (
    <div>
      <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", marginBottom: 6 }}>
        <h1 style={{ ...displayFont, fontSize: 26, color: COLORS.ink, margin: 0 }}>NuLiga-Import</h1>
        <span style={{ ...monoFont, fontSize: 12, color: COLORS.inkSoft }}>Letzter Abgleich: {lastSync}</span>
      </div>
      <div style={{ ...bodyFont, fontSize: 13, color: COLORS.inkSoft, marginBottom: 18 }}>{`Spiele der ${IMPORT_LIGEN.join(", ")} werden über die nuPortalRS-Schnittstelle (lesend) abgerufen. Regulär übernommen werden zunächst nur Heimspiele in Baden-Württemberg — alle anderen Spiele müssen separat von einem Admin angefordert werden.`}</div>
      <div style={{ background: COLORS.panel, border: `1px solid ${COLORS.hair}`, borderRadius: 12, padding: 16, marginBottom: 20, display: "flex", alignItems: "center", gap: 14 }}>
        <button onClick={runSync} disabled={syncing} style={{ display: "flex", alignItems: "center", gap: 7, background: COLORS.court, color: "#fff", border: "none", borderRadius: 8, padding: "9px 14px", ...bodyFont, fontSize: 13, fontWeight: 600, cursor: syncing ? "default" : "pointer", opacity: syncing ? 0.75 : 1 }}>
          <RefreshCw size={14} style={syncing ? { animation: "spin 0.9s linear infinite" } : undefined} />
          {syncing ? "Synchronisiere…" : "Jetzt mit NuLiga abgleichen"}
        </button>
        <div style={{ ...bodyFont, fontSize: 12.5, color: COLORS.inkSoft }}>{openCount > 0 ? `${openCount} Termin${openCount === 1 ? "" : "e"} bereit zur Übernahme` : "Alles auf dem aktuellen Stand"}</div>
        {openCount > 0 && <button onClick={handleImportAll} style={{ marginLeft: "auto", background: "#fff", color: COLORS.court, border: `1px solid ${COLORS.court}`, borderRadius: 8, padding: "8px 12px", ...bodyFont, fontSize: 12.5, fontWeight: 600, cursor: "pointer" }}>Alle übernehmen</button>}
      </div>
      <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 12 }}><GameFilter value={gf} onChange={setGf} /></div>
      <h2 style={{ ...displayFont, fontSize: 18, color: COLORS.ink, margin: "0 0 10px" }}>Heimspiele in Baden-Württemberg</h2>
      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        {standardItems.map((item) => {
          const done = imported[item.id];
          return (
            <div key={item.id} style={{ background: COLORS.panel, border: `1px solid ${COLORS.hair}`, borderRadius: 10, padding: "13px 16px", display: "flex", alignItems: "center", gap: 14, opacity: done ? 0.55 : 1 }}>
              <div style={{ width: 34, height: 34, borderRadius: 8, background: item.type === "Turnier" ? "#EAF1EC" : "#F1EFE6", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                {item.type === "Turnier" ? <Trophy size={16} color={COLORS.court} /> : <CalendarDays size={16} color={COLORS.court} />}
              </div>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ ...bodyFont, fontSize: 14, color: COLORS.ink, fontWeight: 600, marginBottom: 2 }}>{item.title}</div>
                <div style={{ ...bodyFont, fontSize: 12.5, color: COLORS.inkSoft }}>{item.date} · {item.venue} · {item.wettbewerb}</div>
                <div style={{ ...bodyFont, fontSize: 12.5, color: item.change === "neu" ? "#7A5214" : COLORS.court }}>{item.change === "neu" ? "Neu" : `Änderung: ${item.change}`}</div>
                {(() => {
                  const ex = fixtures.find((x) => x.title === item.title && x.status === "bestätigt");
                  return ex && item.change !== "neu" && !done ? <div style={{ ...bodyFont, fontSize: 12.5, color: COLORS.rust }}>Ansetzung betroffen: {[...ex.confirmedRefs, ...(ex.referee ? [ex.referee] : [])].join(", ")}</div> : null;
                })()}
                {(() => {
                  const ex = fixtures.find((x) => x.title === item.title && x.status === "bestätigt");
                  return ex && item.change !== "neu" && !done ? <div style={{ ...bodyFont, fontSize: 12.5, color: COLORS.rust }}>Neubestätigung durch die Angesetzten nötig</div> : null;
                })()}
              </div>
              {done ? <span style={{ display: "flex", alignItems: "center", gap: 5, color: COLORS.moss, ...bodyFont, fontSize: 12.5 }}><CheckCircle2 size={15} /> Übernommen</span> : (
                <button onClick={() => handleImportOne(item)} style={{ display: "flex", alignItems: "center", gap: 5, background: "#fff", color: COLORS.court, border: `1px solid ${COLORS.court}`, borderRadius: 7, padding: "7px 11px", ...bodyFont, fontSize: 12.5, fontWeight: 600, cursor: "pointer" }}>
                  <Download size={13} /> Übernehmen
                </button>
              )}
            </div>
          );
        })}
      </div>

      <div style={{ marginTop: 28 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 4 }}>
          <Lock size={14} color={COLORS.inkSoft} />
          <h2 style={{ ...displayFont, fontSize: 18, color: COLORS.ink, margin: 0 }}>Nur auf Anforderung</h2>
        </div>
        <div style={{ ...bodyFont, fontSize: 12.5, color: COLORS.inkSoft, marginBottom: 12 }}>Heimspiele außerhalb Baden-Württembergs, Auswärtsspiele von BW-Mannschaften und Spiele ohne BW-Beteiligung werden nicht über „Alle übernehmen“ importiert. Ein Admin muss sie einzeln anfordern.</div>
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          {requestItems.map((item) => {
            const done = imported[item.id];
            const cls = classifyMatch(item);
            const asking = confirmId === item.id;
            return (
              <div key={item.id} style={{ background: "#FBFAF5", border: `1px dashed ${COLORS.hair}`, borderRadius: 10, padding: "13px 16px", opacity: done ? 0.55 : 1 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
                  <div style={{ width: 34, height: 34, borderRadius: 8, background: "#F1EFE6", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                    <Lock size={16} color={COLORS.inkSoft} />
                  </div>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ ...bodyFont, fontSize: 14, color: COLORS.ink, fontWeight: 600, marginBottom: 2 }}>{item.title}</div>
                    <div style={{ ...bodyFont, fontSize: 12.5, color: COLORS.inkSoft }}>{item.date} · {item.venue} · Heim: {item.homeTeam} ({item.homeState}) · Gast: {item.awayTeam} ({item.awayState})</div>
                  </div>
                  <CourtBadge tone="rust">{cls.label}</CourtBadge>
                  {done ? (
                    <span style={{ display: "flex", alignItems: "center", gap: 5, color: COLORS.moss, ...bodyFont, fontSize: 12.5 }}><CheckCircle2 size={15} /> Angefordert</span>
                  ) : !asking && (
                    <button onClick={() => setConfirmId(item.id)} style={{ display: "flex", alignItems: "center", gap: 5, background: "#fff", color: COLORS.court, border: `1px solid ${COLORS.court}`, borderRadius: 7, padding: "7px 11px", ...bodyFont, fontSize: 12.5, fontWeight: 600, cursor: "pointer" }}>
                      <Download size={13} /> Anfordern
                    </button>
                  )}
                </div>
                {asking && !done && (
                  <div style={{ background: "#F8F6EF", borderRadius: 8, padding: 10, marginTop: 10, display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
                    <span style={{ ...bodyFont, fontSize: 12.5, color: COLORS.ink, flex: 1, minWidth: 200 }}>Dieses Spiel liegt außerhalb des BW-Fokus. Jetzt als {adminName || "Admin"} anfordern und in „Abfragen (Ansetzung)“ übernehmen?</span>
                    <button onClick={() => handleRequest(item)} style={{ background: COLORS.court, color: "#fff", border: "none", borderRadius: 6, padding: "7px 12px", fontSize: 12, fontWeight: 600, cursor: "pointer", ...bodyFont }}>Anfordern &amp; übernehmen</button>
                    <button onClick={() => setConfirmId(null)} style={{ background: "#fff", color: COLORS.inkSoft, border: `1px solid ${COLORS.hair}`, borderRadius: 6, padding: "7px 12px", fontSize: 12, cursor: "pointer", ...bodyFont }}>Abbrechen</button>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

function StatistikTab({ referees, onAddNachweis, readOnly }) {
  const maxSaison = Math.max(...referees.map((r) => r.saison));
  const [openId, setOpenId] = useState(null);
  const [text, setText] = useState("");
  const [newDate, setNewDate] = useState("");

  const submitNachweis = (r) => {
    if (!text || !newDate) return;
    onAddNachweis(r.id, text, newDate);
    setText(""); setNewDate(""); setOpenId(null);
  };

  return (
    <div>
      <h1 style={{ ...displayFont, fontSize: 26, color: COLORS.ink, margin: "0 0 4px" }}>Statistik</h1>
      <div style={{ ...bodyFont, fontSize: 13, color: COLORS.inkSoft, marginBottom: 18 }}>Einsatzstatistik, Lizenzen und Leistungsnachweise der Schiedsrichter</div>
      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        {[...referees].sort((a, b) => b.saison - a.saison).map((r) => (
          <div key={r.id} style={{ background: COLORS.panel, border: `1px solid ${COLORS.hair}`, borderRadius: 10, padding: "14px 16px" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 8 }}>
              <div style={{ width: 30, height: 30, borderRadius: "50%", background: "#F1EFE6", display: "flex", alignItems: "center", justifyContent: "center", ...monoFont, fontSize: 12, color: COLORS.court, flexShrink: 0 }}>{r.name.split(" ").map((p) => p[0]).join("")}</div>
              <div style={{ flex: 1 }}>
                <div style={{ ...bodyFont, fontSize: 14, fontWeight: 600, color: COLORS.ink }}>{r.name}</div>
                <div style={{ ...bodyFont, fontSize: 12, color: COLORS.inkSoft, display: "flex", gap: 8, flexWrap: "wrap" }}>
                  <CourtBadge tone="court">{r.license}</CourtBadge>
                  <span>Lizenz gültig bis {r.licenseValidUntil}</span>
                </div>
              </div>
              <div style={{ textAlign: "right" }}>
                <div style={{ ...displayFont, fontSize: 20, color: COLORS.ink }}>{r.saison}</div>
                <div style={{ ...bodyFont, fontSize: 11, color: COLORS.inkSoft }}>Einsätze/Saison</div>
              </div>
            </div>
            <div style={{ height: 6, background: "#F1EFE6", borderRadius: 4, overflow: "hidden", marginBottom: 6 }}>
              <div style={{ height: "100%", width: `${(r.saison / maxSaison) * 100}%`, background: COLORS.moss }} />
            </div>

            {r.nachweise.length > 0 && (
              <div style={{ marginBottom: 8 }}>

                  <button onClick={() => setOpenId(null)} style={{ background: "#fff", color: COLORS.inkSoft, border: `1px solid ${COLORS.hair}`, borderRadius: 6, padding: "6px 12px", fontSize: 12, cursor: "pointer", ...bodyFont }}>Abbrechen</button>

              <button onClick={() => setOpenId(r.id)} style={{ display: "flex", alignItems: "center", gap: 5, background: "none", border: "none", color: COLORS.court, fontSize: 12, fontWeight: 600, cursor: "pointer", padding: 0, ...bodyFont }}>
                <Plus size={13} /> Leistungsnachweis eintragen

            )}
          </div>
        ))}
      </div>
    </div>
  );
}

function AbfrageTab({ fixtures, me, responses, onRespond, abfrage }) {
  const [comments, setComments] = useState({});
  const ast = abfrageStatus(abfrage);
  const open = ast.state === "offen";
  const need = (f) => (f.requiredLevel !== undefined ? f.requiredLevel : requiredLevelFor(f.wettbewerb));
  // Offen sind alle noch nicht bestätigten Spiele, für die ich lizenziert bin (eigener Verein nur als Notlösung)
  const askable = fixtures.filter((f) => f.status !== "bestätigt" && licenseRank(me.license) >= need(f));
  const [gf, setGf] = useState(GF0);
  const requests = askable.filter((f) => !isBlocked(me, f) && gameMatches(f, gf));
  const hiddenBlocked = askable.length - askable.filter((f) => !isBlocked(me, f)).length;
  const mine = (f) => (responses[f.id] || {})[me.name] || null;
  const unanswered = requests.filter((f) => !mine(f));
  const submit = (req, answer) => onRespond(req, answer, comments[req.id] || "");
  const allYes = () => unanswered.forEach((f) => onRespond(f, "zugesagt", comments[f.id] || ""));
  const banner = { offen: { bg: "#EAF1EC", fg: COLORS.court }, vor: { bg: "#FBEEDD", fg: "#7A5214" }, beendet: { bg: "#FBEAE5", fg: COLORS.rust } }[ast.state];

  return (
    <div style={{ maxWidth: 720 }}>
      <h1 style={{ ...displayFont, fontSize: 26, color: COLORS.ink, margin: "0 0 4px" }}>Abfrage</h1>
      <div style={{ ...bodyFont, fontSize: 13, color: COLORS.inkSoft, marginBottom: 12 }}>Teile mit, zu welchen Spielen du grundsätzlich eingesetzt werden kannst. Die Admins legen die Ansetzungen danach fest; sie erscheinen dann in deinen Ansetzungen. Kommentare sehen alle Admins.</div>
      <div style={{ ...bodyFont, fontSize: 12.5, color: banner.fg, background: banner.bg, borderRadius: 10, padding: 12, marginBottom: 12 }}>
        {ast.text}{!open && ast.state === "beendet" ? " — Antworten sind nicht mehr möglich." : ""}{!open && ast.state === "vor" ? " — Antworten sind ab dann möglich." : ""}
      </div>
      <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 12 }}><GameFilter value={gf} onChange={setGf} /></div>
      {open && unanswered.length > 1 && (
        <button onClick={allYes} style={{ background: "#fff", color: COLORS.court, border: `1px solid ${COLORS.court}`, borderRadius: 8, padding: "8px 14px", fontSize: 12.5, fontWeight: 600, cursor: "pointer", marginBottom: 12, ...bodyFont }}>Alle {unanswered.length} offenen Spiele als „kann“ melden</button>
      )}
      {hiddenBlocked > 0 && <div style={{ ...bodyFont, fontSize: 12, color: COLORS.inkSoft, marginBottom: 10 }}>{hiddenBlocked} Spiel{hiddenBlocked === 1 ? " wird" : "e werden"} wegen deiner Sperrzeiten nicht abgefragt.</div>}
      {requests.length === 0 && <div style={{ ...bodyFont, fontSize: 13, color: COLORS.inkSoft, background: COLORS.panel, border: `1px solid ${COLORS.hair}`, borderRadius: 12, padding: 16 }}>Aktuell keine offenen Anfragen.</div>}
      {requests.map((req) => {
        const a = mine(req);
        return (
          <div key={req.id} style={{ background: COLORS.panel, border: `1px solid ${COLORS.hair}`, borderRadius: 12, padding: 16, marginBottom: 10 }}>
            <div style={{ ...bodyFont, fontSize: 13.5, fontWeight: 600, color: COLORS.ink, marginBottom: 3 }}>{req.title}{req.type === "Turnier" ? " (Turnier, ganzer Tag)" : ""}</div>
            {req.reopened && <div style={{ marginBottom: 6 }}><CourtBadge tone="amber">Erneut angefragt · {req.reopened}</CourtBadge></div>}
            {clubConflict(me, req) && <div style={{ ...bodyFont, fontSize: 11.5, color: COLORS.inkSoft, marginBottom: 6 }}>Eigener Verein — Ansetzung nur, wenn kein anderer Schiedsrichter verfügbar ist.</div>}
            <div style={{ ...bodyFont, fontSize: 12.5, color: COLORS.inkSoft, marginBottom: 10 }}>{req.date} · {req.venue} · {req.wettbewerb}</div>
            {a ? (
              <div>
                <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
                  <CourtBadge tone={a.answer === "zugesagt" ? "moss" : "rust"}>{a.answer === "zugesagt" ? "Du kannst" : "Du kannst nicht"}</CourtBadge>
                  {open && <button onClick={() => onRespond(req, null, "")} style={{ background: "none", border: "none", color: COLORS.court, fontSize: 12, cursor: "pointer", padding: 0, ...bodyFont }}>Antwort ändern</button>}
                </div>
                {a.comment && <div style={{ ...bodyFont, fontSize: 12, color: COLORS.inkSoft, marginTop: 6, fontStyle: "italic" }}>„{a.comment}“</div>}
              </div>
            ) : ast.state === "beendet" ? (
              <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
                <CourtBadge tone="rust">Keine Rückmeldung</CourtBadge>
                <span style={{ ...bodyFont, fontSize: 12, color: COLORS.inkSoft }}>Die Abfrage ist beendet.</span>
              </div>
            ) : (
              <div>
                <input value={comments[req.id] || ""} onChange={(e) => setComments((c) => ({ ...c, [req.id]: e.target.value }))} placeholder="Kommentar für die Admins (optional)" maxLength={500} disabled={!open} style={{ width: "100%", border: `1px solid ${COLORS.hair}`, borderRadius: 7, padding: "8px 10px", fontSize: 12.5, marginBottom: 8, boxSizing: "border-box", ...bodyFont }} />
                <div style={{ display: "flex", gap: 8 }}>
                  <button disabled={!open} onClick={() => submit(req, "zugesagt")} style={{ flex: 1, background: open ? COLORS.court : COLORS.hair, color: open ? "#fff" : COLORS.inkSoft, border: "none", borderRadius: 8, padding: "9px 0", fontSize: 13, fontWeight: 600, cursor: open ? "pointer" : "default", ...bodyFont }}>Ich kann</button>
                  <button disabled={!open} onClick={() => submit(req, "abgesagt")} style={{ flex: 1, background: "#fff", color: open ? COLORS.rust : COLORS.inkSoft, border: `1px solid ${open ? COLORS.rust : COLORS.hair}`, borderRadius: 8, padding: "9px 0", fontSize: 13, cursor: open ? "pointer" : "default", ...bodyFont }}>Ich kann nicht</button>
                </div>
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

function buildICS(fixtures, refName) {
  const pad = (n) => String(n).padStart(2, "0");
  const now = new Date();
  const stamp = `${now.getUTCFullYear()}${pad(now.getUTCMonth() + 1)}${pad(now.getUTCDate())}T${pad(now.getUTCHours())}${pad(now.getUTCMinutes())}00Z`;
  const events = fixtures.map((f, i) => `BEGIN:VEVENT\r\nUID:${f.id}-${i}@ansetzung-app\r\nDTSTAMP:${stamp}\r\nSUMMARY:${f.title}\r\nLOCATION:${f.venue}\r\nDESCRIPTION:${f.wettbewerb} — ${f.date}\r\nEND:VEVENT`).join("\r\n");
  return `BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Ansetzung//${refName}//DE\r\n${events}\r\nEND:VCALENDAR`;
}

function LizenzVerwaltung({ referees, onSync, onSyncAll, onManualUpdate, onTogglePersp }) {
  const [editId, setEditId] = useState(null);
  const [lvl, setLvl] = useState("");
  const [until, setUntil] = useState("");

  const diffFor = (r) => {
    const n = NULIGA_LICENSE_DATA[r.id];
    if (!n) return null;
    if (n.license !== r.license || n.licenseValidUntil !== r.licenseValidUntil) return n;
    return "same";
  };
  const pendingCount = referees.filter((r) => { const d = diffFor(r); return d && d !== "same"; }).length;

  const startEdit = (r) => { setEditId(r.id); setLvl(r.license); setUntil(r.licenseValidUntil); };
  const saveEdit = (r) => { if (!until) return; onManualUpdate(r.id, lvl, until); setEditId(null); };

  return (
    <div>
      <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", marginBottom: 6 }}>
        <h1 style={{ ...displayFont, fontSize: 26, color: COLORS.ink, margin: 0 }}>Lizenzen &amp; Perspektiv-Teams</h1>
        <button onClick={onSyncAll} style={{ display: "flex", alignItems: "center", gap: 6, background: COLORS.court, color: "#fff", border: "none", borderRadius: 7, padding: "7px 14px", fontSize: 12.5, fontWeight: 600, cursor: "pointer", ...bodyFont }}>
          <RefreshCw size={14} /> Alle mit NuLiga abgleichen{pendingCount > 0 ? ` (${pendingCount})` : ""}
        </button>
      </div>
      <div style={{ ...bodyFont, fontSize: 13, color: COLORS.inkSoft, marginBottom: 18 }}>Lizenzstufen und Gültigkeiten der Schiedsrichter — Lizenzdaten werden, wo verfügbar, automatisch aus NuLiga übernommen. Ohne NuLiga-Daten bleibt die manuelle Pflege möglich.</div>

      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        {referees.map((r) => {
          const diff = diffFor(r);
          return (
            <div key={r.id} style={{ background: COLORS.panel, border: `1px solid ${COLORS.hair}`, borderRadius: 10, padding: "14px 16px" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                <div style={{ width: 30, height: 30, borderRadius: "50%", background: "#F1EFE6", display: "flex", alignItems: "center", justifyContent: "center", ...monoFont, fontSize: 12, color: COLORS.court, flexShrink: 0 }}>{r.name.split(" ").map((p) => p[0]).join("")}</div>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ ...bodyFont, fontSize: 14, fontWeight: 600, color: COLORS.ink, marginBottom: 2 }}>{r.name}</div>
                  <div style={{ ...bodyFont, fontSize: 12, color: COLORS.inkSoft, display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center" }}>
                    <CourtBadge tone="court">{r.license}</CourtBadge>
                    <span>gültig bis {r.licenseValidUntil}</span>
                    {reminderDate(r) && <span>· Erinnerung {r.licenseRemindedFor === r.licenseValidUntil ? "gesendet" : `ab ${fmtDe(reminderDate(r))}`}</span>}
                    <span>· {r.licenseSyncedAt ? `zuletzt aus NuLiga synchronisiert am ${r.licenseSyncedAt}` : "noch nie mit NuLiga synchronisiert"}</span>
                  </div>
                </div>
                <div style={{ display: "flex", gap: 6, flexShrink: 0 }}>
                  {diff === null && <CourtBadge tone="rust">Keine NuLiga-Daten</CourtBadge>}
                  {diff === "same" && <CourtBadge tone="moss">Aktuell</CourtBadge>}
                  {diff && diff !== "same" && (
                    <button onClick={() => onSync(r.id)} style={{ display: "flex", alignItems: "center", gap: 5, background: "#FBEEDD", color: "#95611F", border: "none", borderRadius: 7, padding: "6px 10px", fontSize: 12, fontWeight: 600, cursor: "pointer", ...bodyFont }}>
                      <RefreshCw size={12} /> Update übernehmen: {diff.license}, bis {diff.licenseValidUntil}
                    </button>
                  )}
                </div>
              </div>

              {editId === r.id ? (
                <div style={{ background: "#F8F6EF", borderRadius: 8, padding: 10, marginTop: 10, display: "flex", gap: 6, alignItems: "flex-end", flexWrap: "wrap" }}>
                  <div>
                    <label style={{ fontSize: 11, color: COLORS.inkSoft, display: "block", marginBottom: 3 }}>Lizenzstufe</label>
                    <select value={lvl} onChange={(e) => setLvl(e.target.value)} style={{ border: `1px solid ${COLORS.hair}`, borderRadius: 6, padding: "6px 8px", fontSize: 12.5, ...bodyFont }}>
                      {LICENSE_LEVELS.map((l) => <option key={l} value={l}>{l}</option>)}
                    </select>
                  </div>
                  <div>
                    <label style={{ fontSize: 11, color: COLORS.inkSoft, display: "block", marginBottom: 3 }}>Gültig bis</label>
                    <input value={until} onChange={(e) => setUntil(e.target.value)} placeholder="TT.MM.JJJJ" style={{ border: `1px solid ${COLORS.hair}`, borderRadius: 6, padding: "6px 8px", fontSize: 12.5, ...bodyFont }} />
                  </div>

const MONTH_ORDER = { Sep: 0, Okt: 1, Nov: 2, Dez: 3, Jan: 4, Feb: 5, "Mär": 6, Apr: 7, Mai: 8 };
function dateKey(g) { return g.date.split(" · ")[0]; }
function gameSortKey(g) {
  const m = g.date.match(/(\d+)\.\s*([A-Za-zäÄ]+)/);
  const t = g.date.match(/(\d+):(\d+)/);
  return (m ? (MONTH_ORDER[m[2]] ?? 9) * 100 + Number(m[1]) : 999) * 10000 + (t ? Number(t[1]) * 100 + Number(t[2]) : 0);
}
function distKm(r, venue) {
  const a = refGeo(r);
  const v = venueGeo(venue);
  if (!a || !v) return 20;
  return Math.round(haversineKm(a, v) * 1.25); // Luftlinie x 1,25 als Näherung der Fahrstrecke
}
const tripCost = (r, g) => distKm(r, g.venue) * 2 * KM_RATE; // Hin- und Rückfahrt

// Doppeleinsatz: zwei Spiele desselben Vereins (z. B. 1. und 2. Mannschaft) am selben Spielort und Tag,
// mit mind. 2,5 Stunden Abstand, können nacheinander von einem Schiedsrichter übernommen werden (eine Fahrt).
function clubOfTeam(t) { return (t || "").replace(/\s+(?:[IVX]+|\d+)$/, "").trim(); }
function startMin(g) { const t = g.date.match(/(\d+):(\d+)/); return t ? Number(t[1]) * 60 + Number(t[2]) : 0; }
function sameTrip(a, b) {
  const ca = clubOfTeam(teamsOf(a)[0]);
  return !!ca && dateKey(a) === dateKey(b) && a.venue === b.venue && ca === clubOfTeam(teamsOf(b)[0]) && Math.abs(startMin(a) - startMin(b)) >= 150;
}

function buildSeasonGames(fixtures, staged) {
  const fromFix = fixtures.filter((f) => isLeagueMatch(f) && !isPast(f));
  const known = new Set(fromFix.map((f) => f.title));
  const fromStaged = staged.filter((s) => classifyMatch(s).standard && isLeagueMatch(s) && !isPast(s) && !known.has(s.title)).map((s) => ({ ...s, status: "offen", confirmedRefs: [] }));
  fromStaged.forEach((s) => known.add(s.title));
  const extra = SEASON_EXTRA.filter((s) => !isPast(s) && !known.has(s.title)).map((s) => ({ ...s, status: "offen", confirmedRefs: [] }));
  return [...fromFix, ...fromStaged, ...extra].sort((a, b) => (gameDate(a) - gameDate(b)) || (startMin(a) - startMin(b)));
}

// Kostenminimale Verteilung (Heuristik: engste Spiele zuerst, günstigste zulässige Schiedsrichter,
// danach Verbesserung durch Platzwechsel und Tausch). Nebenbedingungen: Lizenz, Vereinskonflikt,
// verfügbar gemeldet, max. 1 Spielort pro Tag (Doppeleinsatz nur bei gleichem Verein/Ort), Obergrenze je Schiedsrichter, bestätigte Spiele bleiben fix.
function planOnce(games, referees, opts, seed) {
  const pool = referees.filter((r) => r.avail);
  const rows = games.map((g) => ({ game: g, refs: [], locked: false }));
  const mine = {};
  pool.forEach((r) => (mine[r.id] = new Set()));
  const assign = (i, r) => { rows[i].refs.push(r); if (mine[r.id]) mine[r.id].add(i); };
  const unassign = (i, r) => { rows[i].refs = rows[i].refs.filter((x) => x.id !== r.id); if (mine[r.id]) mine[r.id].delete(i); };
  // Grenzkosten: Wer am selben Spielort/Tag schon ein Spiel desselben Vereins hat, fährt nicht noch einmal
  const nShare = (r, i) => 1 + [...(mine[r.id] || [])].filter((k) => k !== i && sameTrip(rows[k].game, rows[i].game)).length;
  // Eigener Verein ist nur Notlösung: hohe Strafkosten, damit er nur bei Engpass genutzt wird
  const ans = (r, i) => answerOf(opts.responses, rows[i].game, r);
  const bonus = (r, i) => (ans(r, i) === "zugesagt" ? ZUSAGE_BONUS : 0);
  const penalty = (r, i) => (clubConflict(r, rows[i].game) ? CONFLICT_PENALTY : 0);
  const cost = (r, i) => (nShare(r, i) > 1 ? 0 : tripCost(r, rows[i].game)) + penalty(r, i) - bonus(r, i);
  const share = (r, i) => tripCost(r, rows[i].game) / nShare(r, i);
  const planCost = () => rows.reduce((s, row, i) => s + row.refs.reduce((x, r) => x + share(r, i) + penalty(r, i) - bonus(r, i), 0), 0);
  const fits = (r, i, leaving) => {
    const g = rows[i].game;
    if (!mine[r.id] || licenseRank(r.license) < requiredLevelFor(g.wettbewerb) || isBlocked(r, g) || ans(r, i) === "abgesagt") return false;
    if (rows[i].refs.some((x) => x.id === r.id)) return false;
    return [...mine[r.id]].every((k) => k === leaving || dateKey(rows[k].game) !== dateKey(g) || sameTrip(rows[k].game, g));
  };

  rows.forEach((row, i) => {
    if (row.game.status === "bestätigt" && (row.game.confirmedRefs || []).length) {
      row.locked = true;
      row.game.confirmedRefs.forEach((n) => { const r = referees.find((x) => x.name === n); if (r) assign(i, r); });
    }
  });

  const open = rows.map((_, i) => i).filter((i) => !rows[i].locked);
  const nElig = {};
  open.forEach((i) => (nElig[i] = pool.filter((r) => fits(r, i)).length));
  let rnd = seed * 9301 + 49297;
  const jitter = () => { rnd = (rnd * 9301 + 49297) % 233280; return rnd / 233280; };
  const key = {};
  open.forEach((i) => (key[i] = nElig[i] + (seed ? jitter() * 3 : 0)));
  [...open].sort((a, b) => key[a] - key[b]).forEach((i) => {
    while (rows[i].refs.length < 2) {
      const c = pool.filter((r) => fits(r, i) && mine[r.id].size < opts.cap).sort((a, b) => cost(a, i) - cost(b, i))[0];
      if (!c) break;
      assign(i, c);
    }
  });

  // Jeder verfügbar gemeldete Schiedsrichter soll mindestens einen Einsatz erhalten können
  if (opts.minOne) {
    pool.forEach((r) => {
      if (mine[r.id].size > 0) return;
      let best = null;
      open.forEach((i) => {
        if (!fits(r, i) || clubConflict(r, rows[i].game)) return;
        if (rows[i].refs.length < 2) { const d = cost(r, i); if (!best || d < best.d) best = { i, a: null, d }; }
        rows[i].refs.forEach((a) => {
          if (mine[a.id] && mine[a.id].size < 2) return;
          const d = cost(r, i) - cost(a, i);
          if (!best || d < best.d) best = { i, a, d };
        });
      });
      if (best) { if (best.a) unassign(best.i, best.a); assign(best.i, r); }
    });
  }

  const minKeep = opts.minOne ? 2 : 1;
  for (let pass = 0; pass < 25; pass++) {
    let improved = false;
    // Platzwechsel: ein Schiedsrichter wird durch einen anderen ersetzt, wenn die Gesamtkosten sinken
    open.forEach((i) => rows[i].refs.slice().forEach((a) => {
      if (!mine[a.id] || mine[a.id].size < minKeep || !rows[i].refs.some((x) => x.id === a.id)) return;
      let bestB = null;
      let bestCost = planCost();
      pool.forEach((b) => {
        if (!fits(b, i) || mine[b.id].size >= opts.cap) return;
        unassign(i, a); assign(i, b);
        const c = planCost();
        unassign(i, b); assign(i, a);
        if (c < bestCost - 0.001) { bestCost = c; bestB = b; }
      });
      if (bestB) { unassign(i, a); assign(i, bestB); improved = true; }
    }));
    // Tausch zweier Schiedsrichter zwischen zwei Spielen
    open.forEach((i) => open.forEach((j) => {
      if (i >= j) return;
      rows[i].refs.slice().forEach((a) => rows[j].refs.slice().forEach((b) => {
        if (a.id === b.id || !rows[i].refs.some((x) => x.id === a.id) || !rows[j].refs.some((x) => x.id === b.id)) return;
        if (!fits(b, i, j) || !fits(a, j, i)) return;
        const before = planCost();
        unassign(i, a); unassign(j, b); assign(i, b); assign(j, a);
        if (planCost() < before - 0.001) improved = true;
        else { unassign(i, b); unassign(j, a); assign(i, a); assign(j, b); }
      }));
    }));
    if (!improved) break;
  }

  rows.forEach((row, i) => {
    row.leader = row.refs.length ? pickLeader(row.refs) : null;
    row.cost = row.refs.reduce((s, r) => s + share(r, i), 0);
    row.km = row.refs.reduce((s, r) => s + (distKm(r, row.game.venue) * 2) / nShare(r, i), 0);
    row.doubles = row.refs.filter((r) => nShare(r, i) > 1).map((r) => r.name);
    row.conflicts = row.refs.filter((r) => clubConflict(r, row.game)).map((r) => r.name);
    row.missing = Math.max(0, 2 - row.refs.length);
  });
  const openRows = rows.filter((r) => !r.locked);
  const baseline = openRows.reduce((s, row) => {
    const lic = pool.filter((r) => licenseRank(r.license) >= requiredLevelFor(row.game.wettbewerb) && !clubConflict(r, row.game));
    return s + (lic.length ? (lic.reduce((x, r) => x + tripCost(r, row.game), 0) / lic.length) * 2 : 0);
  }, 0);
  const perRef = pool.map((r) => {
    const idx = [...mine[r.id]];
    return { ref: r, games: idx.length, km: idx.reduce((s, i) => s + (distKm(r, rows[i].game.venue) * 2) / nShare(r, i), 0), cost: idx.reduce((s, i) => s + share(r, i), 0) };
  });
  return { rows, perRef, baseline, openCost: openRows.reduce((s, r) => s + r.cost, 0), total: rows.reduce((s, r) => s + r.cost, 0) };
}

// Mehrere Durchläufe mit wechselnder Reihenfolge; gewählt wird der Plan mit den wenigsten Lücken, dann den geringsten Kosten
function planSeason(games, referees, opts) {
  let best = null;
  for (let seed = 0; seed < 40; seed++) {
    const p = planOnce(games, referees, opts, seed);
    p.missing = p.rows.reduce((s, r) => s + r.missing, 0);
    p.ownClub = p.rows.reduce((s, r) => s + r.conflicts.length, 0);
    const better = !best || p.missing < best.missing || (p.missing === best.missing && (p.ownClub < best.ownClub || (p.ownClub === best.ownClub && p.openCost < best.openCost - 0.001)));
    if (better) best = p;
  }
  return best;
}

// Rückmeldungen der Schiedsrichter in der Saisonabfrage: responses[spielId][name] = { answer, comment, at }
function answerObj(responses, g, r) { return ((responses || {})[g.id] || {})[r.name] || null; }
function answerOf(responses, g, r) { const a = answerObj(responses, g, r); return a ? a.answer : null; }
function isoDays(n) { const d = new Date(); d.setDate(d.getDate() + n); return ymd(d); }
// Status des Abfragezeitraums
function abfrageStatus(a) {
  const t = ymd(new Date());
  if (!a || !a.von || !a.bis) return { state: "offen", text: "Kein Zeitraum festgelegt — Rückmeldungen jederzeit möglich" };
  if (t < a.von) return { state: "vor", text: `Die Abfrage startet am ${isoToDe(a.von)}` };
  if (t > a.bis) return { state: "beendet", text: `Die Abfrage ist seit dem ${isoToDe(a.bis)} beendet` };
  const days = Math.round((new Date(a.bis + "T00:00:00") - new Date(t + "T00:00:00")) / 86400000);
  return { state: "offen", text: `Abfragezeitraum ${isoToDe(a.von)} – ${isoToDe(a.bis)} (${days === 0 ? "letzter Tag" : `noch ${days} Tag${days === 1 ? "" : "e"}`})` };
}

// Bewertung eines (ggf. manuell angepassten) Plans: Kosten mit gemeinsamer Fahrt, Leiter, Hinweise
function evaluateRows(rows, referees) {
  const nShare = (r, i) => 1 + rows.reduce((n, row, k) => (k !== i && row.refs.some((x) => x.id === r.id) && sameTrip(row.game, rows[i].game) ? n + 1 : n), 0);
  const out = rows.map((row, i) => ({
    ...row,
    leader: row.refs.length ? pickLeader(row.refs) : null,
    cost: row.refs.reduce((s, r) => s + tripCost(r, row.game) / nShare(r, i), 0),
    km: row.refs.reduce((s, r) => s + (distKm(r, row.game.venue) * 2) / nShare(r, i), 0),
    doubles: row.refs.filter((r) => nShare(r, i) > 1).map((r) => r.name),
    conflicts: row.refs.filter((r) => clubConflict(r, row.game)).map((r) => r.name),
    missing: Math.max(0, 2 - row.refs.length),
  }));
  const perRef = referees.map((r) => {
    const idx = out.map((row, i) => (row.refs.some((x) => x.id === r.id) ? i : -1)).filter((i) => i >= 0);
    return {
      ref: r,
      games: idx.length,
      km: idx.reduce((s, i) => s + (distKm(r, out[i].game.venue) * 2) / nShare(r, i), 0),
      cost: idx.reduce((s, i) => s + tripCost(r, out[i].game) / nShare(r, i), 0),
    };
  });
  const openRows = out.filter((r) => !r.locked);
  return { rows: out, perRef, total: out.reduce((s, r) => s + r.cost, 0), openCost: openRows.reduce((s, r) => s + r.cost, 0) };
}

// Hinweise zu einer Zeile: Lizenz, Verein, Sperrzeit, Verfügbarkeit, Terminkollision, Rückmeldung (+ Kommentar)
function rowIssues(row, rows, responses, closed) {
  const out = [];
  const need = requiredLevelFor(row.game.wettbewerb);
  row.refs.forEach((r) => {
    if (licenseRank(r.license) < need) out.push({ t: `${r.name}: Lizenz reicht nicht (benötigt ${requiredLevelLabel(need)})`, tone: "rust" });
    if (clubConflict(r, row.game)) out.push({ t: `${r.name}: eigener Verein`, tone: "rust" });
    const b = isBlocked(r, row.game);
    if (b) out.push({ t: `${r.name}: Sperrzeit${b.grund ? ` (${b.grund})` : ""}`, tone: "rust" });
    if (!r.avail) out.push({ t: `${r.name}: nicht verfügbar gemeldet`, tone: "rust" });
    rows.forEach((o) => {
      if (o !== row && o.refs.some((x) => x.id === r.id) && dateKey(o.game) === dateKey(row.game) && !sameTrip(o.game, row.game)) out.push({ t: `${r.name}: am selben Tag auch in „${o.game.venue}“ eingeplant`, tone: "rust" });
    });
    const a = answerObj(responses, row.game, r);
    if (a && a.answer === "abgesagt") out.push({ t: `${r.name}: hat abgesagt${a.comment ? ` — „${a.comment}“` : ""}`, tone: "rust" });
    else if (a && a.comment) out.push({ t: `${r.name}: „${a.comment}“`, tone: "ink" });
    else if (!a && !row.locked) out.push({ t: `${r.name}: ${closed ? "keine Rückmeldung" : "Rückmeldung ausstehend"}`, tone: closed ? "rust" : "amber" });
  });
  if (row.refs.length < 2) out.push({ t: row.refs.length === 0 ? "Beide Plätze offen" : "Ein Platz offen", tone: "rust" });
  return out;
}

const seasonLabel = () => {
  const n = new Date();
  const y = n.getMonth() >= 6 ? n.getFullYear() : n.getFullYear() - 1;
  return `${y}/${String(y + 1).slice(2)}`;
};

function SaisonPlanung({ fixtures, staged, referees, responses, abfrage, onSetAbfrage, onApply, readOnly }) {
  const games = useMemo(() => buildSeasonGames(fixtures, staged), [fixtures, staged]);
  const pool = referees.filter((r) => r.avail);
  const minCap = Math.max(1, Math.ceil((games.length * 2) / Math.max(1, pool.length)));
  const maxCap = Math.max(minCap, games.length);
  const [capInput, setCapInput] = useState(null);
  const [minOne, setMinOne] = useState(true);
  const [applied, setApplied] = useState(false);
  const [edits, setEdits] = useState({}); // Spiel-ID -> manuell gewählte Schiedsrichter (Namen)
  const [showTeams, setShowTeams] = useState(false);
  const [openResp, setOpenResp] = useState({});
  const [gf, setGf] = useState(GF0);
  const autoCap = useMemo(() => {
    for (let c = minCap; c <= maxCap; c++) { if (planSeason(games, referees, { cap: c, minOne: true, responses }).missing === 0) return c; }
    return maxCap;
  }, [games, referees, minCap, maxCap, responses]);
  const cap = Math.min(Math.max(capInput ?? autoCap, minCap), maxCap);
  const base = useMemo(() => planSeason(games, referees, { cap, minOne, responses }), [games, referees, cap, minOne, responses]);
  const plan = useMemo(() => {
    const merged = base.rows.map((row) => {
      const names = edits[row.game.id];
      if (row.locked || !names) return { ...row, edited: false };
      return { ...row, refs: names.map((n) => referees.find((r) => r.name === n)).filter(Boolean), edited: true };
    });
    return evaluateRows(merged, referees);
  }, [base, edits, referees]);

  const eur = (n) => n.toLocaleString("de-DE", { style: "currency", currency: "EUR" });
  const missing = plan.rows.reduce((s, r) => s + r.missing, 0);
  const saving = base.baseline - plan.openCost;
  const editedCount = plan.rows.filter((r) => r.edited).length;
  const overCap = plan.perRef.filter((p) => p.games > cap);
  const toApply = plan.rows.filter((r) => !r.locked);
  const fullCount = toApply.filter((r) => r.refs.length >= 2).length;
  const cols = "96px 1fr 230px 230px 78px";
  const ast = abfrageStatus(abfrage);
  const periodErr = abfrage && abfrage.von && abfrage.bis && abfrage.bis < abfrage.von;
  const tone = { rust: COLORS.rust, amber: "#7A5214", ink: COLORS.inkSoft, moss: COLORS.moss };

  // Rückmeldungsstand der Abfrage
  let zus = 0;
  let abg = 0;
  let possible = 0;
  games.forEach((g) => pool.forEach((r) => {
    if (licenseRank(r.license) < requiredLevelFor(g.wettbewerb)) return;
    possible++;
    const x = answerOf(responses, g, r);
    if (x === "zugesagt") zus++; else if (x === "abgesagt") abg++;
  }));
  const respCount = (r) => games.reduce((acc, g) => { const x = answerOf(responses, g, r); if (x === "zugesagt") acc.z++; else if (x === "abgesagt") acc.a++; return acc; }, { z: 0, a: 0 });

  const teamsByLiga = useMemo(() => {
    const m = {};
    games.forEach((g) => { m[g.wettbewerb] = m[g.wettbewerb] || new Set(); teamsOf(g).forEach((t) => m[g.wettbewerb].add(t)); });
    return IMPORT_LIGEN.filter((l) => m[l]).map((l) => ({ liga: l, teams: [...m[l]].sort((a, b) => a.localeCompare(b, "de")), games: games.filter((g) => g.wettbewerb === l).length }));
  }, [games]);

  const setSlot = (row, idx, name) => {
    const cur = [row.refs[0] ? row.refs[0].name : "", row.refs[1] ? row.refs[1].name : ""];
    cur[idx] = name;
    setEdits((e) => ({ ...e, [row.game.id]: cur.filter(Boolean) }));
    setApplied(false);
  };
  const resetRow = (id) => { setEdits((e) => { const n = { ...e }; delete n[id]; return n; }); setApplied(false); };
  const optionLabel = (r, g) => {
    const flags = [];
    const a = answerOf(responses, g, r);
    if (a === "zugesagt") flags.push("zugesagt");
    if (a === "abgesagt") flags.push("abgesagt");
    if (licenseRank(r.license) < requiredLevelFor(g.wettbewerb)) flags.push("Lizenz");
    if (clubConflict(r, g)) flags.push("Verein");
    if (isBlocked(r, g)) flags.push("Sperrzeit");
    if (!r.avail) flags.push("nicht verfügbar");
    return flags.length ? `${r.name} (${flags.join(", ")})` : r.name;
  };

  const dateIn = { border: `1px solid ${COLORS.hair}`, borderRadius: 6, padding: "6px 8px", fontSize: 12.5, ...bodyFont, background: "#fff" };

  return (
    <div>
      <h1 style={{ ...displayFont, fontSize: 26, color: COLORS.ink, margin: "0 0 4px" }}>Saisonplanung {seasonLabel()}</h1>
      <div style={{ ...bodyFont, fontSize: 13, color: COLORS.inkSoft, marginBottom: 10 }}>Ablauf: Die Schiedsrichter melden in der Saisonabfrage, zu welchen Spielen sie grundsätzlich eingesetzt werden können. Auf Basis der in den Ligen vertretenen Mannschaften ({IMPORT_LIGEN.join(", ")}) und vor allem dieser Rückmeldungen wird eine kostensparende Verteilung vorgeschlagen, die sich direkt in der Liste bearbeiten lässt. Danach legen die Admins die Ansetzungen fest, und sie erscheinen in den Ansetzungen der Schiedsrichter. Berücksichtigt werden Zusagen (bevorzugt) und Absagen (ausgeschlossen), Lizenzstufe, Terminkollisionen, Sperrzeiten und die Verfügbarkeitsmeldung; der eigene Verein wird nur angesetzt, wenn kein anderer Schiedsrichter verfügbar ist. Kosten = Fahrtkosten ({KM_RATE.toLocaleString("de-DE", { style: "currency", currency: "EUR" })}/km, Hin- und Rückfahrt); zwei Spiele desselben Vereins am selben Spielort und Tag (mind. 2,5 Stunden Abstand) kann ein Schiedsrichter nacheinander übernehmen — die Fahrt wird dann nur einmal berechnet. Spiele außerhalb des BW-Fokus fließen erst nach separater Anforderung ein.</div>
      <button onClick={() => setShowTeams((v) => !v)} style={{ background: "none", border: "none", color: COLORS.court, fontSize: 12.5, cursor: "pointer", padding: 0, marginBottom: 12, ...bodyFont }}>{showTeams ? "Mannschaften ausblenden" : `Mannschaften in den Ligen anzeigen (${teamsByLiga.reduce((n, l) => n + l.teams.length, 0)})`}</button>
      {showTeams && (
        <div style={{ background: COLORS.panel, border: `1px solid ${COLORS.hair}`, borderRadius: 12, padding: 14, marginBottom: 14 }}>
          {teamsByLiga.map((l) => (
            <div key={l.liga} style={{ marginBottom: 8 }}>
              <div style={{ ...bodyFont, fontSize: 12.5, fontWeight: 600, color: COLORS.ink }}>{l.liga} · {l.teams.length} Mannschaften · {l.games} Spiele</div>
              <div style={{ ...bodyFont, fontSize: 12, color: COLORS.inkSoft }}>{l.teams.join(", ")}</div>
            </div>
          ))}
        </div>
      )}

      <div style={{ background: COLORS.panel, border: `1px solid ${COLORS.hair}`, borderRadius: 12, padding: 16, marginBottom: 14 }}>
        <div style={{ ...bodyFont, fontSize: 13, fontWeight: 600, color: COLORS.ink, marginBottom: 8 }}>Abfragezeitraum für die Rückmeldungen der Schiedsrichter</div>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center", marginBottom: 8 }}>
          <label style={{ ...bodyFont, fontSize: 12, color: COLORS.inkSoft }}>von <input type="date" value={(abfrage && abfrage.von) || ""} disabled={readOnly} onChange={(e) => onSetAbfrage({ ...abfrage, von: e.target.value })} style={dateIn} /></label>
          <label style={{ ...bodyFont, fontSize: 12, color: COLORS.inkSoft }}>bis <input type="date" value={(abfrage && abfrage.bis) || ""} disabled={readOnly} onChange={(e) => onSetAbfrage({ ...abfrage, bis: e.target.value })} style={dateIn} /></label>
          <CourtBadge tone={ast.state === "offen" ? "moss" : ast.state === "vor" ? "amber" : "rust"}>{ast.state === "offen" ? "Läuft" : ast.state === "vor" ? "Noch nicht gestartet" : "Beendet"}</CourtBadge>
        </div>
        <div style={{ ...bodyFont, fontSize: 12.5, color: periodErr ? COLORS.rust : COLORS.inkSoft }}>{periodErr ? "Das Ende liegt vor dem Beginn." : ast.text}</div>
        <div style={{ ...bodyFont, fontSize: 12.5, color: COLORS.ink, marginTop: 4 }}>Rückmeldungen: {zus + abg} von {possible} möglichen ({zus} zugesagt, {abg} abgesagt{ast.state === "beendet" ? `, ${possible - zus - abg} ohne Rückmeldung` : ""})</div>
      </div>

      <div style={{ display: "flex", gap: 12, flexWrap: "wrap", marginBottom: 14 }}>
        {[["Ligaspiele", String(plan.rows.length)], ["Gesamtkosten", eur(plan.total)], ["Ø je Spiel", eur(plan.rows.length ? plan.total / plan.rows.length : 0)], ["Ersparnis*", `${eur(Math.max(0, saving))}${base.baseline > 0 ? ` (${Math.round((Math.max(0, saving) / base.baseline) * 100)} %)` : ""}`], ["Manuell angepasst", String(editedCount)]].map(([l, v]) => (
          <div key={l} style={{ background: COLORS.panel, border: `1px solid ${COLORS.hair}`, borderRadius: 10, padding: "10px 14px", minWidth: 130 }}>
            <div style={{ ...bodyFont, fontSize: 11.5, color: COLORS.inkSoft }}>{l}</div>
            <div style={{ ...displayFont, fontSize: 19, color: COLORS.ink }}>{v}</div>
          </div>
        ))}
      </div>

      <div style={{ background: COLORS.panel, border: `1px solid ${COLORS.hair}`, borderRadius: 12, padding: 16, marginBottom: 14 }}>
        <div style={{ display: "flex", gap: 24, flexWrap: "wrap", alignItems: "center", marginBottom: 12 }}>
          <label style={{ ...bodyFont, fontSize: 12.5, color: COLORS.ink, display: "flex", alignItems: "center", gap: 8 }}>
            Max. Einsätze je Schiedsrichter: <strong>{cap}</strong> <span style={{ color: COLORS.inkSoft }}>(Minimum ohne Lücken: {autoCap})</span>
            <input type="range" min={minCap} max={maxCap} value={cap} onChange={(e) => { setCapInput(Number(e.target.value)); setApplied(false); }} style={{ accentColor: COLORS.court }} />
          </label>
          <label style={{ ...bodyFont, fontSize: 12.5, color: COLORS.ink, display: "flex", alignItems: "center", gap: 6, cursor: "pointer" }}>
            <input type="checkbox" checked={minOne} onChange={(e) => { setMinOne(e.target.checked); setApplied(false); }} style={{ accentColor: COLORS.court }} />
            Jeder verfügbar gemeldete Schiedsrichter erhält mind. 1 Einsatz
          </label>
          {editedCount > 0 && <button onClick={() => { setEdits({}); setApplied(false); }} style={{ background: "#fff", color: COLORS.rust, border: `1px solid ${COLORS.rust}`, borderRadius: 7, padding: "6px 12px", fontSize: 12, cursor: "pointer", ...bodyFont }}>Vorschlag neu berechnen (Änderungen verwerfen)</button>}
        </div>
        {referees.map((r) => {
          const st = plan.perRef.find((p) => p.ref.id === r.id);
          const show = r.avail || (st && st.games > 0);
          const rc = respCount(r);
          return (
            <div key={r.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "5px 0", flexWrap: "wrap" }}>
              <div style={{ ...bodyFont, fontSize: 12.5, width: 130, color: r.avail ? COLORS.ink : COLORS.inkSoft }}>{r.name}</div>
              {show ? (
                <>
                  <div style={{ flex: 1, minWidth: 80, background: "#F1EFE6", borderRadius: 4, height: 8 }}><div style={{ width: `${Math.min(100, (st.games / cap) * 100)}%`, background: st.games > cap ? COLORS.rust : COLORS.court, height: 8, borderRadius: 4 }} /></div>
                  <div style={{ ...monoFont, fontSize: 11.5, color: st.games > cap ? COLORS.rust : COLORS.inkSoft, width: 200 }}>{st.games} Einsätze · {Math.round(st.km)} km · {eur(st.cost)}</div>
                  <div style={{ ...bodyFont, fontSize: 11.5, color: COLORS.inkSoft, width: 150 }}>{rc.z} zugesagt · {rc.a} abgesagt</div>

      {overCap.length > 0 && <div style={{ ...bodyFont, fontSize: 12.5, color: COLORS.rust, marginBottom: 6 }}>Obergrenze überschritten: {overCap.map((p) => `${p.ref.name} (${p.games})`).join(", ")}</div>}

      <div style={{ background: COLORS.panel, border: `1px solid ${COLORS.hair}`, borderRadius: 12, overflow: "hidden" }}>

          <div>Termin</div><div>Spiel</div><div>Schiedsrichter 1</div><div>Schiedsrichter 2</div><div style={{ textAlign: "right" }}>Kosten</div>
        </div>
        {plan.rows.filter((row) => gameMatches(row.game, gf)).map((row) => {
          const issues = rowIssues(row, plan.rows, responses, ast.state === "beendet");
          const other = (idx) => (row.refs[1 - idx] ? row.refs[1 - idx].name : "");
          const slot = (idx) => {

            return (
              <div>

              </div>

        <button disabled={toApply.length === 0 || !!applied} onClick={() => { onApply(toApply, "vorschlag"); setApplied("vorschlag"); }} style={{ background: "#fff", color: toApply.length === 0 || applied ? COLORS.inkSoft : COLORS.court, border: `1px solid ${toApply.length === 0 || applied ? COLORS.hair : COLORS.court}`, borderRadius: 8, padding: "9px 16px", fontSize: 12.5, cursor: toApply.length === 0 || applied ? "default" : "pointer", ...bodyFont }}>Nur als Vorschläge nach „Abfragen (Ansetzung)“</button>
        {applied === "festlegen" && <span style={{ ...bodyFont, fontSize: 12.5, color: COLORS.moss }}>✓ festgelegt — die Schiedsrichter sehen ihre Ansetzungen jetzt in ihren Ansetzungen</span>}
        {applied === "vorschlag" && <span style={{ ...bodyFont, fontSize: 12.5, color: COLORS.moss }}>✓ übernommen — in „Abfragen (Ansetzung)“ je Spiel prüfen und bestätigen</span>}
        {!applied && (missing > 0 || fullCount < toApply.length) && <span style={{ ...bodyFont, fontSize: 12, color: COLORS.inkSoft }}>Unvollständig besetzte Spiele bleiben „offen“ und werden nicht festgelegt.</span>}
      </div>
    </div>
  );
}

// Hilfsfunktionen: Datum, Sperrzeiten, Lizenz-Erinnerung

const MONTHS_DE = { Jan: 0, Feb: 1, "Mär": 2, Apr: 3, Mai: 4, Jun: 5, Jul: 6, Aug: 7, Sep: 8, Okt: 9, Nov: 10, Dez: 11 };
const ymd = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const isoToDe = (s) => (s || "").split("-").reverse().join(".");
// Spieltermine tragen kein Jahr: das Jahr ergibt sich aus dem Datum, das dem heutigen Tag am nächsten liegt
function gameDate(g) {
  const m = g.date.match(/(\d+)\.\s*([A-Za-zä]+)/);
  if (!m || MONTHS_DE[m[2]] === undefined) return null;
  const mon = MONTHS_DE[m[2]];
  const now = new Date();
  let best = null;
  [now.getFullYear() - 1, now.getFullYear(), now.getFullYear() + 1].forEach((y) => {
    const c = new Date(y, mon, Number(m[1]));
    if (!best || Math.abs(c - now) < Math.abs(best - now)) best = c;
  });
  return best;
}
// Archiv: Spiele mit Datum vor heute (der Spieltag selbst gilt noch als aktuell)
function isPast(g) {
  const d = gameDate(g);
  const t = new Date();
  t.setHours(0, 0, 0, 0);
  return !!d && d < t;
}
// Demo-Termine relativ zu heute: weeks = 0 -> kommendes Wochenende, negativ = Vergangenheit
function demoDay(weeks, sunday) {
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  const toSat = ((6 - d.getDay() + 7) % 7) || 7;
  d.setDate(d.getDate() + toSat + weeks * 7 + (sunday ? 1 : 0));
  return d;
}
function demoDate(weeks, sunday, time) {
  const WD = ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"];
  const MON = ["Jan", "Feb", "Mär", "Apr", "Mai", "Jun", "Jul", "Aug", "Sep", "Okt", "Nov", "Dez"];
  const d = demoDay(weeks, sunday);
  return `${WD[d.getDay()]}, ${d.getDate()}. ${MON[d.getMonth()]} · ${time}`;
}
function demoIso(weeks, sunday) {
  const d = demoDay(weeks, sunday);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function isBlocked(r, g) {
  const list = r.sperrzeiten || [];
  if (!list.length) return null;
  const d = gameDate(g);
  if (!d) return null;
  const k = ymd(d);
  return list.find((s) => s.von <= k && k <= (s.bis || s.von)) || null;
}
function parseDe(s) {
  const m = /^(\d{1,2})\.(\d{1,2})\.(\d{4})$/.exec(s || "");
  return m ? new Date(Number(m[3]), Number(m[2]) - 1, Number(m[1])) : null;
}
// Erinnerung: 1 Jahr vor Lizenzende
function reminderDate(r) {
  const end = parseDe(r.licenseValidUntil);
  if (!end) return null;
  const d = new Date(end);
  d.setFullYear(d.getFullYear() - 1);
  return d;
}
function reminderDue(r) {
  const d = reminderDate(r);
  return !!d && new Date() >= d && r.licenseRemindedFor !== r.licenseValidUntil;
}
const fmtDe = (d) => d.toLocaleDateString("de-DE");
const slugName = (n) => n.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
