// Regelwerke: Admins stellen PDFs ein, Schiedsrichter haben sie immer aktuell dabei (auch offline)
// ---------------------------------------------------------------------------
const REGEL_KATEGORIEN = ["Spielregeln", "Wettspielordnung", "Durchführungsbestimmungen", "Schiedsrichter-Leitfaden", "Formulare", "Sonstiges"];
const fmtSize = (b) => (b >= 1048576 ? `${(b / 1048576).toFixed(1).replace(".", ",")} MB` : `${Math.max(1, Math.round(b / 1024))} KB`);
const fmtDay = (iso) => { const d = new Date(iso); return isNaN(d) ? "" : d.toLocaleDateString("de-DE"); };
const regelErr = (e) => (e && e.code === "too_large" ? "Die Datei ist größer als 20 MB." : e && e.code === "quota_or_state" ? "Der Speicherplatz dieser Seite ist voll." : e && (e.code === "not_granted" || e.code === "invalid_argument") ? "Keine Berechtigung zum Speichern — Bearbeiterrechte erforderlich." : "Speichern fehlgeschlagen. Bitte erneut versuchen.");

// Zwischenspeicher im Browser des Betrachters (IndexedDB) für den Offline-Zugriff; Inhalte werden mit AES-256-GCM verschlüsselt
function idbOpen() {
  return new Promise((resolve, reject) => {
    try {
      const req = indexedDB.open("regelwerke-cache", 2);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains("pdf")) db.createObjectStore("pdf");
        if (!db.objectStoreNames.contains("keys")) db.createObjectStore("keys");
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    } catch (e) { reject(e); }
  });
}
const idbReq = (r) => new Promise((resolve, reject) => { r.onsuccess = () => resolve(r.result); r.onerror = () => reject(r.error); });
// Schlüssel: nicht exportierbarer AES-Schlüssel, der nur in diesem Browser liegt
async function cacheKey() {
  const db = await idbOpen();
  let key = await idbReq(db.transaction("keys").objectStore("keys").get("aes"));
  if (!key) {
    key = await crypto.subtle.generateKey({ name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
    await idbReq(db.transaction("keys", "readwrite").objectStore("keys").put(key, "aes"));
  }
  return key;
}
async function cacheGet(id) {
  try {
    const db = await idbOpen();
    const rec = await idbReq(db.transaction("pdf").objectStore("pdf").get(id));
    if (!rec || !rec.iv || !rec.data) return null; // alte, unverschlüsselte Einträge werden ignoriert
    const key = await cacheKey();
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: rec.iv }, key, rec.data);
    return new Blob([plain], { type: rec.type || "application/pdf" });
  } catch (e) { return null; }
}
async function cachePut(id, blob) {
  try {
    const key = await cacheKey();
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const data = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, await blob.arrayBuffer());
    const db = await idbOpen();
    await idbReq(db.transaction("pdf", "readwrite").objectStore("pdf").put({ iv, data, type: blob.type }, id));
  } catch (e) { /* ohne Zwischenspeicher weiter */ }
}
async function cacheKeys() {
  try { const db = await idbOpen(); return await idbReq(db.transaction("pdf").objectStore("pdf").getAllKeys()); } catch (e) { return []; }
}
async function cacheDelete(id) {
  try { const db = await idbOpen(); await idbReq(db.transaction("pdf", "readwrite").objectStore("pdf").delete(id)); } catch (e) { /* egal */ }
}

// Gemeinsamer Speicher (Dokumente + Lesebestätigungen), auf App-Ebene geladen
function useRegelStore() {
  const [docs, setDocs] = useState(null);
  const [gelesen, setGelesen] = useState({});
  const [store, setStore] = useState({ db: null, assets: null, downloads: null, ready: false });
  useEffect(() => {
    let dead = false;
    let timer = null;
    const unsubs = [];
    const use = async (name) => { try { return window.claude && window.claude.use ? await window.claude.use(name) : null; } catch (e) { return null; } };
    (async () => {
      const db = await use("db");
      const assets = await use("assets");
      const downloads = await use("downloads");
      if (dead) return;
      setStore({ db, assets, downloads, ready: true });
      if (!db) { setDocs([]); return; }
      timer = setTimeout(() => setDocs((d) => d || []), 10000);
      unsubs.push(db.collection("regelwerke").onSnapshot(
        (snap) => { clearTimeout(timer); setDocs(snap.docs.map((s) => ({ id: s.id, ...s.data() }))); },
        () => { clearTimeout(timer); setDocs((d) => d || []); }
      ));
      unsubs.push(db.collection("gelesen").onSnapshot(
        (snap) => { const m = {}; snap.docs.forEach((s) => { m[s.id] = s.data(); }); setGelesen(m); },
        () => {}
      ));
    })();
    return () => { dead = true; clearTimeout(timer); unsubs.forEach((u) => u && u()); };
  }, []);
  const confirmRead = async (name, d) => {
    if (!store.db) return;
    const key = slugName(name);
    const prev = (gelesen[key] && gelesen[key].bestaetigt) || {};
    await store.db.doc("gelesen/" + key).set({ name, bestaetigt: { ...prev, [d.id]: d.version }, updatedAt: new Date().toISOString() });
  };
  return { docs, gelesen, store, confirmRead };
}
const readOf = (regel, name) => ((regel.gelesen[slugName(name)] || {}).bestaetigt) || {};
const openReads = (regel, name) => (regel.docs || []).filter((d) => d.pflicht && readOf(regel, name)[d.id] !== d.version);

// ---------------------------------------------------------------------------
// PDF-Anzeige in der App (pdf.js, Darstellung auf einer Leinwand – ohne eval; Schriften aus dem PDF bzw. vom Gerät)
// ---------------------------------------------------------------------------
const PDFJS_VERSION = "3.11.174";
let pdfjsPromise = null;
function loadPdfJs() {
  if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if (pdfjsPromise) return pdfjsPromise;
  pdfjsPromise = new Promise((resolve, reject) => {
    const sc = document.createElement("script");
    sc.src = `https://cdnjs.cloudflare.com/ajax/libs/pdf.js/${PDFJS_VERSION}/pdf.min.js`;
    sc.onload = () => {
      const lib = window.pdfjsLib;
      if (!lib) { pdfjsPromise = null; reject(new Error("pdfjs")); return; }
      lib.GlobalWorkerOptions.workerSrc = `https://cdnjs.cloudflare.com/ajax/libs/pdf.js/${PDFJS_VERSION}/pdf.worker.min.js`;
      resolve(lib);
    };
    sc.onerror = () => { pdfjsPromise = null; reject(new Error("pdfjs-load")); };
    document.head.appendChild(sc);
  });
  return pdfjsPromise;
}

// Kommentare im PDF (Anmerkungen): Links, Formularfelder und Popups zählen nicht
const PDF_SKIP_ANN = ["Link", "Widget", "Popup"];
const annText = (a) => { const t = a.contentsObj && a.contentsObj.str !== undefined ? a.contentsObj.str : a.contents; return (t || "").toString().trim(); };
const annAuthor = (a) => { const t = a.titleObj && a.titleObj.str !== undefined ? a.titleObj.str : a.title; return (t || "").toString().trim(); };

// Eine Seite des endlosen Dokuments: wird nur gezeichnet, solange sie sichtbar oder nahe am Sichtbereich ist
function PdfPage({ pdf, num, scale, base, query, cur, pickedId, onPick, rootRef, register }) {
  const holder = useRef(null);
  const canvas = useRef(null);
  const textBox = useRef(null);
  const divsRef = useRef([]);
  const taskRef = useRef(null);
  const [visible, setVisible] = useState(false);
  const [size, setSize] = useState(null);
  const [marks, setMarks] = useState([]);
  const [ready, setReady] = useState(0);
  const w = size && size.scale === scale ? size.w : Math.floor(base.w * scale);
  const h = size && size.scale === scale ? size.h : Math.floor(base.h * scale);

  useEffect(() => {
    register(num, holder.current);
    const el = holder.current;
    if (!el || !rootRef.current || typeof IntersectionObserver === "undefined") { setVisible(true); return undefined; }
    const io = new IntersectionObserver((es) => setVisible(es[es.length - 1].isIntersecting), { root: rootRef.current, rootMargin: "1400px 0px" });
    io.observe(el);
    return () => io.disconnect();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  // Seite zeichnen (Bild, Textebene, Kommentar-Markierungen)
  useEffect(() => {
    if (!visible) {
      const c = canvas.current;
      if (c) { c.width = 0; c.height = 0; }
      if (textBox.current) textBox.current.innerHTML = "";
      divsRef.current = [];
      return undefined;
    }
    let dead = false;
    (async () => {
      try {
        const p = await pdf.getPage(num);
        const vp = p.getViewport({ scale });
        const dpr = window.devicePixelRatio || 1;
        const c = canvas.current;
        if (!c || dead) return;
        c.width = Math.floor(vp.width * dpr);
        c.height = Math.floor(vp.height * dpr);
        c.style.width = `${Math.floor(vp.width)}px`;
        c.style.height = `${Math.floor(vp.height)}px`;
        setSize({ w: Math.floor(vp.width), h: Math.floor(vp.height), scale });
        if (taskRef.current) { try { taskRef.current.cancel(); } catch (e) { /* egal */ } }
        const am = window.pdfjsLib && window.pdfjsLib.AnnotationMode ? window.pdfjsLib.AnnotationMode.ENABLE_STORAGE : undefined;
        const task = p.render({ canvasContext: c.getContext("2d"), viewport: vp, transform: dpr !== 1 ? [dpr, 0, 0, dpr, 0, 0] : null, ...(am !== undefined ? { annotationMode: am } : {}) });
        taskRef.current = task;
        await task.promise;
        if (dead) return;
        const tc = await p.getTextContent();
        if (dead || !textBox.current) return;
        textBox.current.innerHTML = "";
        const divs = [];
        const tl = window.pdfjsLib.renderTextLayer({ textContentSource: tc, container: textBox.current, viewport: vp, textDivs: divs });
        await tl.promise;
        if (dead) return;
        divsRef.current = divs;
        setReady((n) => n + 1);
        const an = (await p.getAnnotations()).filter((a) => !PDF_SKIP_ANN.includes(a.subtype) && annText(a));
        if (dead) return;
        setMarks(an.map((a) => {
          const r = vp.convertToViewportRectangle(a.rect);
          return { id: `${num}-${a.id}`, x: Math.min(r[0], r[2]), y: Math.min(r[1], r[3]), w: Math.max(18, Math.abs(r[2] - r[0])), h: Math.max(18, Math.abs(r[3] - r[1])), text: annText(a), author: annAuthor(a) };
        }));
      } catch (e) { /* abgebrochene Darstellung ignorieren */ }
    })();
    return () => { dead = true; };
  }, [visible, scale]);

  // Suchtreffer in der Textebene hervorheben
  useEffect(() => {
    const divs = divsRef.current || [];
    const q = (query || "").trim().toLowerCase();
    let k = 0;
    divs.forEach((d) => {
      if (d.dataset.t === undefined) d.dataset.t = d.textContent || "";
      const txt = d.dataset.t;
      if (!txt) return;
      const low = txt.toLowerCase();
      if (q.length < 2 || !low.includes(q)) {
        if (d.dataset.m === "1") { d.textContent = txt; d.dataset.m = "0"; }
        return;
      }
      const frag = document.createDocumentFragment();
      let pos = 0;
      let at = low.indexOf(q, pos);
      while (at !== -1) {
        if (at > pos) frag.appendChild(document.createTextNode(txt.slice(pos, at)));
        const m = document.createElement("mark");
        if (cur && cur.page === num && cur.k === k) m.className = "cur";
        m.textContent = txt.slice(at, at + q.length);
        frag.appendChild(m);
        k++;
        pos = at + q.length;
        at = low.indexOf(q, pos);
      }
      if (pos < txt.length) frag.appendChild(document.createTextNode(txt.slice(pos)));
      d.textContent = "";
      d.appendChild(frag);
      d.dataset.m = "1";
    });
  }, [query, cur, ready]);

  return (
    <div ref={holder} className="pdf-page" style={{ width: w, height: h }}>
      <canvas ref={canvas} style={{ display: "block" }} />
      <div ref={textBox} className="pdf-text" />
      {marks.map((m) => (
        <div key={m.id} onClick={() => onPick(m.id)} title={`${m.author ? m.author + ": " : ""}${m.text}`} style={{ position: "absolute", left: m.x, top: m.y, width: m.w, height: m.h, border: `2px solid ${pickedId === m.id ? "#D9480F" : "#E8A900"}`, background: pickedId === m.id ? "rgba(217,72,15,0.16)" : "rgba(255,196,0,0.18)", borderRadius: 3, cursor: "pointer", zIndex: 2 }} />
      ))}
    </div>
  );
}

function PdfViewer({ title, label, getBlob, canSave, onSave, extra, onClose }) {
  const rootRef = useRef(null);
  const pageEls = useRef({});
  const listRef = useRef(null);
  const [pdf, setPdf] = useState(null);
  const [base, setBase] = useState(null);
  const [cw, setCw] = useState(640);
  const [zoom, setZoom] = useState(1);
  const [busy, setBusy] = useState(true);
  const [err, setErr] = useState("");
  const [curPage, setCurPage] = useState(1);
  const [query, setQuery] = useState("");
  const [index, setIndex] = useState(null);
  const [indexing, setIndexing] = useState(false);
  const [comments, setComments] = useState([]);
  const [showComments, setShowComments] = useState(true);
  const [picked, setPicked] = useState(null);
  const [hit, setHit] = useState(0);

  // Dokument laden, Kommentare einsammeln
  useEffect(() => {
    let dead = false;
    (async () => {
      try {
        const lib = await loadPdfJs();
        const blob = await getBlob();
        const buf = await blob.arrayBuffer();
        const doc = await lib.getDocument({ data: new Uint8Array(buf), isEvalSupported: false, useSystemFonts: true }).promise;
        const p1 = await doc.getPage(1);
        const v = p1.getViewport({ scale: 1 });
        if (dead) return;
        setBase({ w: v.width, h: v.height });
        setPdf(doc);
        setBusy(false);
        const out = [];
        for (let i = 1; i <= doc.numPages; i++) {
          try {
            const p = await doc.getPage(i);
            const an = await p.getAnnotations();
            an.forEach((a) => { if (!PDF_SKIP_ANN.includes(a.subtype) && annText(a)) out.push({ id: `${i}-${a.id}`, page: i, author: annAuthor(a), text: annText(a) }); });
          } catch (e) { /* weiter */ }
        }
        if (!dead) setComments(out);
      } catch (e) {
        if (!dead) { setErr("Das Dokument konnte hier nicht dargestellt werden. Du kannst es stattdessen speichern und mit einer PDF-App öffnen."); setBusy(false); }
      }
    })();
    return () => { dead = true; };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  // Breite des Lesebereichs
  useEffect(() => {
    const m = () => { if (rootRef.current) setCw(rootRef.current.clientWidth); };
    m();
    window.addEventListener("resize", m);
    return () => window.removeEventListener("resize", m);
  }, [pdf]);

  // Suchindex: Text je Seite, wird beim ersten Suchbegriff aufgebaut
  useEffect(() => {
    if (!pdf || index || indexing || query.trim().length < 2) return;
    setIndexing(true);
    (async () => {
      const out = [];
      for (let i = 1; i <= pdf.numPages; i++) {
        try {
          const p = await pdf.getPage(i);
          const tc = await p.getTextContent();
          out.push(tc.items.map((x) => x.str).filter((x) => x && x.length));
        } catch (e) { out.push([]); }
      }
      setIndex(out);
      setIndexing(false);
    })();
  }, [query, pdf]);

  const q = query.trim().toLowerCase();
  const results = useMemo(() => {
    if (q.length < 2) return [];
    const out = [];
    if (index) {
      index.forEach((items, pi) => {
        let k = 0;
        items.forEach((txt) => {
          const low = txt.toLowerCase();
          let pos = 0;
          let at = low.indexOf(q, pos);
          while (at !== -1) {
            out.push({ type: "text", page: pi + 1, k, snip: txt.slice(Math.max(0, at - 28), at + q.length + 28) });
            k++;
            pos = at + q.length;
            at = low.indexOf(q, pos);
          }
        });
      });
    }
    comments.forEach((c) => { if (`${c.text} ${c.author}`.toLowerCase().includes(q)) out.push({ type: "comment", page: c.page, id: c.id, snip: c.text.slice(0, 80) }); });
    return out.sort((a, b) => a.page - b.page);
  }, [q, index, comments]);

  const goPage = (n) => {
    const el = pageEls.current[n];
    if (el && rootRef.current) rootRef.current.scrollTo({ top: el.offsetTop - 10 });
  };
  useEffect(() => {
    if (results.length > 0) { setHit(0); goPage(results[0].page); if (results[0].type === "comment") setPicked(results[0].id); }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [q, index, comments.length]);
  const step = (d) => {
    if (!results.length) return;
    const nx = (hit + d + results.length) % results.length;
    setHit(nx);
    goPage(results[nx].page);
    if (results[nx].type === "comment") setPicked(results[nx].id);
  };
  const curHit = results[hit];
  const curMark = curHit && curHit.type === "text" ? { page: curHit.page, k: curHit.k } : null;

  const onScroll = () => {
    const root = rootRef.current;
    if (!root || !pdf) return;
    const top = root.scrollTop + 60;
    let best = 1;
    for (let i = 1; i <= pdf.numPages; i++) {
      const el = pageEls.current[i];
      if (!el) continue;
      if (el.offsetTop <= top) best = i; else break;
    }
    if (best !== curPage) setCurPage(best);
  };

  // Escape schließt
  useEffect(() => {
    const onKey = (e) => { if (e.key === "Escape") onClose(); };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, []);

  const n = pdf ? pdf.numPages : 0;
  const scale = base ? Math.max(0.2, ((cw - 32) / base.w) * zoom) : 1;
  const tb = { background: "#fff", color: COLORS.ink, border: `1px solid ${COLORS.hair}`, borderRadius: 6, padding: "5px 10px", fontSize: 12.5, cursor: "pointer", ...bodyFont };
  const cmtMatches = (c) => q.length >= 2 && `${c.text} ${c.author}`.toLowerCase().includes(q);
  return (
    <div role="dialog" aria-label={`Regelwerk ${title}`} style={{ position: "fixed", inset: 0, background: "rgba(27,36,31,0.55)", zIndex: 60, display: "flex", alignItems: "center", justifyContent: "center", padding: 12 }}>
      <div style={{ background: COLORS.panel, borderRadius: 12, width: "min(1000px, 100%)", height: "100%", maxHeight: "100%", display: "flex", flexDirection: "column", overflow: "hidden", boxShadow: "0 12px 40px rgba(0,0,0,0.3)" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "10px 16px", borderBottom: `1px solid ${COLORS.hair}`, flexWrap: "wrap" }}>
          <div style={{ flex: 1, minWidth: 160 }}>
            <div style={{ ...bodyFont, fontSize: 14, fontWeight: 600, color: COLORS.ink }}>{title}</div>
            {label && <div style={{ ...bodyFont, fontSize: 11.5, color: COLORS.inkSoft }}>{label}</div>}
          </div>
          {canSave && <button onClick={onSave} style={tb}>Speichern</button>}
          <button onClick={onClose} style={{ ...tb, background: COLORS.court, color: "#fff", border: "none", fontWeight: 600 }}>Schließen</button>
        </div>
        {pdf && (
          <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "8px 16px", borderBottom: `1px solid ${COLORS.hair}`, flexWrap: "wrap", background: "#F8F6EF" }}>
            <input value={query} onChange={(e) => setQuery(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter") step(e.shiftKey ? -1 : 1); }} placeholder="Im Dokument und in Kommentaren suchen …" aria-label="Suche" style={{ flex: 1, minWidth: 180, border: `1px solid ${COLORS.hair}`, borderRadius: 6, padding: "6px 9px", fontSize: 12.5, ...bodyFont }} />
            <button onClick={() => step(-1)} disabled={!results.length} style={{ ...tb, opacity: results.length ? 1 : 0.5 }} aria-label="Voriger Treffer">↑</button>
            <button onClick={() => step(1)} disabled={!results.length} style={{ ...tb, opacity: results.length ? 1 : 0.5 }} aria-label="Nächster Treffer">↓</button>
            <span style={{ ...bodyFont, fontSize: 12, color: COLORS.inkSoft, minWidth: 90 }}>{q.length < 2 ? "" : indexing ? "Suche …" : results.length ? `Treffer ${hit + 1} von ${results.length}` : "Keine Treffer"}</span>
            <span style={{ ...bodyFont, fontSize: 12.5, color: COLORS.ink }}>Seite <input type="number" min={1} max={n} value={curPage} onChange={(e) => { const v = Number(e.target.value); if (v >= 1 && v <= n) { setCurPage(v); goPage(v); } }} style={{ width: 52, border: `1px solid ${COLORS.hair}`, borderRadius: 6, padding: "4px 6px", fontSize: 12.5, ...bodyFont }} /> von {n}</span>
            <button onClick={() => setShowComments((v) => !v)} style={{ ...tb, borderColor: showComments ? COLORS.court : COLORS.hair }}>Kommentare ({comments.length})</button>
            <button onClick={() => setZoom((z) => Math.max(0.5, Math.round((z - 0.25) * 100) / 100))} style={tb} aria-label="Verkleinern">−</button>
            <span style={{ ...monoFont, fontSize: 12, color: COLORS.ink, minWidth: 44, textAlign: "center" }}>{Math.round(zoom * 100)} %</span>
            <button onClick={() => setZoom((z) => Math.min(3, Math.round((z + 0.25) * 100) / 100))} style={tb} aria-label="Vergrößern">+</button>
            <button onClick={() => setZoom(1)} style={tb}>Breite</button>
          </div>
        )}
        {pdf && showComments && (
          <div ref={listRef} style={{ maxHeight: 150, overflow: "auto", borderBottom: `1px solid ${COLORS.hair}`, background: "#FFFCF3", padding: "6px 16px" }}>
            {comments.length === 0 && <div style={{ ...bodyFont, fontSize: 12, color: COLORS.inkSoft, padding: "4px 0" }}>Dieses Dokument enthält keine Kommentare.</div>}
            {comments.map((c) => (
              <div key={c.id} onClick={() => { setPicked(c.id); goPage(c.page); }} style={{ cursor: "pointer", padding: "5px 6px", borderRadius: 6, marginBottom: 2, background: picked === c.id ? "rgba(217,72,15,0.12)" : cmtMatches(c) ? "rgba(255,196,0,0.30)" : "transparent", ...bodyFont, fontSize: 12.5, color: COLORS.ink }}>
                <span style={{ color: COLORS.inkSoft, fontSize: 11.5 }}>Seite {c.page}{c.author ? ` · ${c.author}` : ""}: </span>{c.text}
              </div>
            ))}
          </div>
        )}
        <div ref={rootRef} onScroll={onScroll} style={{ position: "relative", overflow: "auto", flex: 1, minHeight: 200, background: "#E9E6DC", padding: "10px 0" }}>
          {busy && <div style={{ ...bodyFont, fontSize: 13, color: COLORS.inkSoft, padding: 40, textAlign: "center" }}>Dokument wird geladen …</div>}
          {err && <div style={{ ...bodyFont, fontSize: 13, color: COLORS.rust, padding: 24, textAlign: "center" }}>{err}</div>}
          {pdf && base && Array.from({ length: n }, (_, i) => (
            <PdfPage key={i + 1} pdf={pdf} num={i + 1} scale={scale} base={base} query={query} cur={curMark} pickedId={picked} onPick={(id) => { setPicked(id); setShowComments(true); }} rootRef={rootRef} register={(num, el) => { pageEls.current[num] = el; }} />
          ))}
        </div>
        {extra && <div style={{ padding: "10px 16px", borderTop: `1px solid ${COLORS.hair}` }}>{extra}</div>}
      </div>
    </div>
  );
}

async function isPdf(file) {
  try {
    const b = new Uint8Array(await file.slice(0, 5).arrayBuffer());
    return String.fromCharCode(...b) === "%PDF-";
  } catch (e) { return false; }
}

function RegelwerkeTab({ regel, isAdmin, isReferee, adminName, meName, referees, onPush }) {
  const { docs, gelesen, store, confirmRead } = regel;
  const [query, setQuery] = useState("");
  const [form, setForm] = useState({ titel: "", kategorie: REGEL_KATEGORIEN[0], version: "", gueltigAb: "", pflicht: false });
  const [file, setFile] = useState(null);
  const [fileKey, setFileKey] = useState(0);
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState(null);
  const [opening, setOpening] = useState(null);
  const [verId, setVerId] = useState(null);
  const [verForm, setVerForm] = useState({ version: "", gueltigAb: "", pflicht: false });
  const [delId, setDelId] = useState(null);
  const [cached, setCached] = useState({});
  const [viewer, setViewer] = useState(null);

  const canUpload = store.ready && !!store.db && !!store.assets;
  const myReads = readOf(regel, meName);
  const openList = (docs || []).filter((d) => d.pflicht && myReads[d.id] !== d.version);

  // Offline-Zugriff: aktuelle PDFs im Hintergrund auf dem Gerät zwischenspeichern, veraltete entfernen
  useEffect(() => {
    if (!docs || !store.ready || !store.db) return;
    let dead = false;
    (async () => {
      const wanted = docs.map((d) => d.assetId).filter(Boolean);
      const have = {};
      for (const id of wanted) {
        if (await cacheGet(id)) { have[id] = true; continue; }
        try {
          const res = await fetch("/_blob/" + id);
          if (res.ok) { await cachePut(id, await res.blob()); have[id] = true; }
        } catch (e) { /* offline: später erneut */ }
        if (dead) return;
      }
      for (const k of await cacheKeys()) { if (!wanted.includes(k)) await cacheDelete(k); }
      if (!dead) setCached(have);
    })();
    return () => { dead = true; };
  }, [docs, store.ready]);

  const getAssetBlob = async (assetId) => {
    let blob = await cacheGet(assetId);
    if (!blob) {
      const res = await fetch("/_blob/" + assetId);
      if (!res.ok) throw new Error("http " + res.status);
      blob = await res.blob();
      await cachePut(assetId, blob);
      setCached((c) => ({ ...c, [assetId]: true }));
    }
    return blob;
  };
  const pdfName = (filename, titel) => (filename && /\.pdf$/i.test(filename) ? filename : `${titel || "Regelwerk"}.pdf`);
  // Datei auf dem Gerät speichern
  const saveAsset = async (assetId, filename, titel) => {
    setMsg(null);
    try {
      const blob = await getAssetBlob(assetId);
      if (store.downloads) await store.downloads.save({ filename: pdfName(filename, titel), data: blob });
    } catch (e) {
      if (!(e && e.code === "declined")) setMsg({ tone: "rust", text: "Die Datei konnte nicht geladen werden. Bitte Verbindung prüfen und erneut versuchen." });
    }
  };
  // Direkt in der App anzeigen
  const openAsset = (key, assetId, filename, titel, label, docId, old) => { setMsg(null); setViewer({ key, assetId, filename, titel, label, docId, old }); };

  const checkFile = (f) => {
    if (!f) return "Bitte eine PDF-Datei auswählen.";
    if (f.type !== "application/pdf" && !/\.pdf$/i.test(f.name)) return "Es sind nur PDF-Dateien möglich.";
    if (f.size > 20 * 1024 * 1024) return "Die Datei ist größer als 20 MB.";
    return null;
  };
  const pushPflicht = (titel, version) => onPush(`Push an alle Schiedsrichter (${referees.length}): Neue Pflichtlektüre — ${titel}, Version ${version}. Bitte Kenntnisnahme bestätigen.`);

  const submitNew = async () => {
    if (busy) return;
    const err = !form.titel.trim() ? "Bitte einen Titel angeben." : !form.version.trim() ? "Bitte Version bzw. Stand angeben." : checkFile(file);
    if (err) { setMsg({ tone: "rust", text: err }); return; }
    if (!(await isPdf(file))) { setMsg({ tone: "rust", text: "Die Datei ist kein gültiges PDF (Dateikennung fehlt)." }); return; }
    setBusy(true);
    setMsg(null);
    try {
      const up = await store.assets.upload(file, { type: "application/pdf" });
      const body = { titel: form.titel.trim(), kategorie: form.kategorie, version: form.version.trim(), gueltigAb: form.gueltigAb.trim(), pflicht: !!form.pflicht, filename: file.name, sizeBytes: up.sizeBytes, assetId: up.id, updatedAt: new Date().toISOString(), updatedBy: adminName || "Admin", verlauf: [] };
      await store.db.collection("regelwerke").doc().set(body);
      if (body.pflicht) pushPflicht(body.titel, body.version);
      setForm({ ...form, titel: "", version: "", gueltigAb: "", pflicht: false });
      setFile(null);
      setFileKey((k) => k + 1);
      setMsg({ tone: "moss", text: "Regelwerk hochgeladen — für alle Schiedsrichter sichtbar." });
    } catch (e) { setMsg({ tone: "rust", text: regelErr(e) }); }
    setBusy(false);
  };

  const submitVersion = async (d) => {
    if (busy) return;
    const err = !verForm.version.trim() ? "Bitte die neue Version angeben." : checkFile(file);
    if (err) { setMsg({ tone: "rust", text: err }); return; }
    if (!(await isPdf(file))) { setMsg({ tone: "rust", text: "Die Datei ist kein gültiges PDF (Dateikennung fehlt)." }); return; }
    setBusy(true);
    setMsg(null);
    try {
      const up = await store.assets.upload(file, { type: "application/pdf" });
      const { id, ...rest } = d;
      const prev = { version: d.version, gueltigAb: d.gueltigAb || "", filename: d.filename, assetId: d.assetId, ersetztAm: new Date().toISOString() };
      const body = { ...rest, version: verForm.version.trim(), gueltigAb: verForm.gueltigAb.trim(), pflicht: !!verForm.pflicht, filename: file.name, sizeBytes: up.sizeBytes, assetId: up.id, updatedAt: new Date().toISOString(), updatedBy: adminName || "Admin", verlauf: [...(d.verlauf || []), prev] };
      await store.db.doc("regelwerke/" + id).set(body);
      if (body.pflicht) pushPflicht(body.titel, body.version);
      setVerId(null);
      setFile(null);
      setFileKey((k) => k + 1);
      setMsg({ tone: "moss", text: "Neue Version eingestellt — Schiedsrichter sehen ab sofort diese Fassung." });
    } catch (e) { setMsg({ tone: "rust", text: regelErr(e) }); }
    setBusy(false);
  };

  const removeDoc = async (d) => {
    if (busy) return;
    setBusy(true);
    try {
      await store.db.doc("regelwerke/" + d.id).delete();
      for (const aid of [d.assetId, ...(d.verlauf || []).map((v) => v.assetId)].filter(Boolean)) {
        try { await store.assets.delete(aid); } catch (e) { /* Datei evtl. schon entfernt */ }
        cacheDelete(aid);
      }
      setDelId(null);
    } catch (e) { setMsg({ tone: "rust", text: regelErr(e) }); }
    setBusy(false);
  };

  const q = query.trim().toLowerCase();
  const visible = (docs || []).filter((d) => !q || `${d.titel} ${d.kategorie} ${d.filename}`.toLowerCase().includes(q));
  const groups = REGEL_KATEGORIEN.map((k) => ({ k, items: visible.filter((d) => d.kategorie === k).sort((a, b) => a.titel.localeCompare(b.titel, "de")) })).filter((g) => g.items.length > 0);
  const inputStyle = { border: `1px solid ${COLORS.hair}`, borderRadius: 6, padding: "7px 9px", fontSize: 12.5, ...bodyFont, boxSizing: "border-box" };
  const btn = (primary) => ({ background: primary ? COLORS.court : "#fff", color: primary ? "#fff" : COLORS.inkSoft, border: primary ? "none" : `1px solid ${COLORS.hair}`, borderRadius: 7, padding: "8px 14px", fontSize: 12.5, fontWeight: primary ? 600 : 400, cursor: busy ? "default" : "pointer", opacity: busy ? 0.6 : 1, ...bodyFont });
  const linkBtn = (color) => ({ background: "none", border: "none", color, fontSize: 12, cursor: "pointer", padding: 0, ...bodyFont });

  return (
    <div style={{ maxWidth: 760 }}>
      <h1 style={{ ...displayFont, fontSize: 26, color: COLORS.ink, margin: "0 0 4px" }}>Regelwerke</h1>
      <div style={{ ...bodyFont, fontSize: 13, color: COLORS.inkSoft, marginBottom: 18 }}>{isAdmin ? "Stelle hier die gültigen Regelwerke als PDF ein. Schiedsrichter sehen immer die aktuelle Version und können sie offline nutzen; frühere Fassungen bleiben für Admins abrufbar." : "Die aktuell gültigen Regelwerke — immer in der neuesten Fassung. „Öffnen“ zeigt das PDF direkt in der App; Offline-Kopien liegen verschlüsselt auf dem Gerät."}</div>

      {store.ready && !store.db && (
        <div style={{ ...bodyFont, fontSize: 12.5, color: COLORS.rust, background: "#FBEAE5", borderRadius: 10, padding: 12, marginBottom: 14 }}>Der Speicher für Regelwerke ist in dieser Ansicht nicht verfügbar. Bitte die Seite neu laden oder in claude.ai öffnen.</div>
      )}

      {isReferee && openList.length > 0 && (
        <div style={{ ...bodyFont, fontSize: 12.5, color: "#7A5214", background: "#FBEEDD", borderRadius: 10, padding: 12, marginBottom: 14 }}>
          {openList.length === 1 ? "1 Regelwerk wartet" : `${openList.length} Regelwerke warten`} auf deine Lesebestätigung.
        </div>
      )}

      {isAdmin && store.ready && store.db && (
        <div style={{ background: COLORS.panel, border: `1px solid ${COLORS.hair}`, borderRadius: 12, padding: 16, marginBottom: 16 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>
            <Upload size={16} color={COLORS.court} />
            <span style={{ ...bodyFont, fontSize: 13, fontWeight: 600, color: COLORS.ink }}>Regelwerk hochladen</span>
          </div>
          {!canUpload ? (
            <div style={{ ...bodyFont, fontSize: 12.5, color: COLORS.inkSoft }}>Hochladen ist nur mit Bearbeiterrechten an dieser Seite möglich.</div>
          ) : (
            <>
              <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 10 }}>
                <input value={form.titel} onChange={(e) => setForm({ ...form, titel: e.target.value })} placeholder="Titel, z. B. Spielregeln" style={{ ...inputStyle, flex: 2, minWidth: 180 }} />
                <select value={form.kategorie} onChange={(e) => setForm({ ...form, kategorie: e.target.value })} style={{ ...inputStyle, flex: 1, minWidth: 150 }}>
                  {REGEL_KATEGORIEN.map((k) => <option key={k} value={k}>{k}</option>)}
                </select>
                <input value={form.version} onChange={(e) => setForm({ ...form, version: e.target.value })} placeholder="Version / Stand" style={{ ...inputStyle, width: 130 }} />
                <input value={form.gueltigAb} onChange={(e) => setForm({ ...form, gueltigAb: e.target.value })} placeholder="Gültig ab (TT.MM.JJJJ)" style={{ ...inputStyle, width: 160 }} />
              </div>
              <label style={{ ...bodyFont, fontSize: 12.5, color: COLORS.ink, display: "flex", alignItems: "center", gap: 6, marginBottom: 10, cursor: "pointer" }}>
                <input type="checkbox" checked={form.pflicht} onChange={(e) => setForm({ ...form, pflicht: e.target.checked })} style={{ accentColor: COLORS.court }} />
                Lesebestätigung erforderlich (benachrichtigt alle Schiedsrichter)
              </label>
              <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" }}>
                <input key={fileKey} type="file" accept="application/pdf,.pdf" onChange={(e) => setFile(e.target.files[0] || null)} style={{ fontSize: 12 }} />
                <button onClick={submitNew} disabled={busy} style={btn(true)}>{busy ? "Wird hochgeladen …" : "Hochladen"}</button>
                <span style={{ ...bodyFont, fontSize: 11.5, color: COLORS.inkSoft }}>nur PDF, bis 20 MB</span>
              </div>
            </>
          )}
        </div>
      )}

      {msg && <div style={{ ...bodyFont, fontSize: 12.5, color: msg.tone === "moss" ? COLORS.moss : COLORS.rust, marginBottom: 12 }}>{msg.text}</div>}

      <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder="Regelwerke durchsuchen …" style={{ ...inputStyle, width: "100%", marginBottom: 16 }} />

      {docs === null ? (
        <div style={{ ...bodyFont, fontSize: 13, color: COLORS.inkSoft }}>Lade Regelwerke …</div>
      ) : groups.length === 0 ? (
        <div style={{ ...bodyFont, fontSize: 13, color: COLORS.inkSoft, background: COLORS.panel, border: `1px solid ${COLORS.hair}`, borderRadius: 12, padding: 16 }}>{q ? "Keine Treffer." : isAdmin ? "Noch keine Regelwerke eingestellt — lade oben das erste PDF hoch." : "Aktuell sind noch keine Regelwerke hinterlegt."}</div>
      ) : groups.map((g) => (
        <div key={g.k} style={{ marginBottom: 18 }}>
          <div style={{ ...bodyFont, fontSize: 11.5, fontWeight: 600, color: COLORS.inkSoft, textTransform: "uppercase", letterSpacing: "0.04em", marginBottom: 8 }}>{g.k}</div>
          {g.items.map((d) => {
            const recent = d.updatedAt && Date.now() - new Date(d.updatedAt).getTime() < 30 * 86400000;
            const needs = d.pflicht && myReads[d.id] !== d.version;
            return (
              <div key={d.id} style={{ background: COLORS.panel, border: `1px solid ${COLORS.hair}`, borderRadius: 10, padding: "12px 16px", marginBottom: 8 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                  <div style={{ width: 34, height: 34, borderRadius: 8, background: "#F1EFE6", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}><FileText size={16} color={COLORS.court} /></div>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ ...bodyFont, fontSize: 13.5, fontWeight: 600, color: COLORS.ink }}>{d.titel} {recent && <CourtBadge tone="amber">Aktualisiert</CourtBadge>} {d.pflicht && <CourtBadge tone="court">Pflicht</CourtBadge>}</div>
                    <div style={{ ...bodyFont, fontSize: 12, color: COLORS.inkSoft }}>Version {d.version}{d.gueltigAb ? ` · gültig ab ${d.gueltigAb}` : ""} · {fmtSize(d.sizeBytes || 0)} · eingestellt am {fmtDay(d.updatedAt)}{cached[d.assetId] ? " · offline verfügbar" : ""}</div>
                  </div>
                  <button onClick={() => openAsset(d.id, d.assetId, d.filename, d.titel, `Version ${d.version}`, d.id, false)} disabled={opening === d.id} style={{ background: COLORS.court, color: "#fff", border: "none", borderRadius: 7, padding: "7px 14px", fontSize: 12.5, fontWeight: 600, cursor: "pointer", ...bodyFont }}>{opening === d.id ? "Lädt …" : "Öffnen"}</button>
                  {store.downloads && <button onClick={() => saveAsset(d.assetId, d.filename, d.titel)} style={{ background: "#fff", color: COLORS.court, border: `1px solid ${COLORS.court}`, borderRadius: 7, padding: "6px 12px", fontSize: 12.5, cursor: "pointer", ...bodyFont }}>Speichern</button>}
                </div>

                {isReferee && d.pflicht && (
                  <div style={{ marginTop: 10, paddingTop: 10, borderTop: `1px solid ${COLORS.hair}`, display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
                    {needs ? (
                      <>
                        <CourtBadge tone="amber">Bestätigung offen</CourtBadge>
                        <button onClick={() => confirmRead(meName, d)} style={{ background: "#fff", color: COLORS.court, border: `1px solid ${COLORS.court}`, borderRadius: 7, padding: "6px 12px", fontSize: 12.5, fontWeight: 600, cursor: "pointer", ...bodyFont }}>Gelesen &amp; verstanden</button>
                      </>
                    ) : <span style={{ ...bodyFont, fontSize: 12.5, color: COLORS.moss, display: "flex", alignItems: "center", gap: 5 }}><CheckCircle2 size={14} /> Kenntnisnahme bestätigt</span>}
                  </div>
                )}

                {isAdmin && (
                  <div style={{ marginTop: 10, paddingTop: 10, borderTop: `1px solid ${COLORS.hair}` }}>
                    {d.pflicht && (() => {
                      const done = referees.filter((r) => readOf(regel, r.name)[d.id] === d.version);
                      const open = referees.filter((r) => !done.includes(r));
                      return <div style={{ ...bodyFont, fontSize: 12, color: open.length ? "#7A5214" : COLORS.moss, marginBottom: 8 }}>Lesebestätigung: {done.length} von {referees.length}{open.length ? ` · ausstehend: ${open.map((r) => r.name).join(", ")}` : " · alle bestätigt"}</div>;
                    })()}
                    {verId === d.id ? (
                      <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center" }}>
                        <input value={verForm.version} onChange={(e) => setVerForm({ ...verForm, version: e.target.value })} placeholder="Neue Version / Stand" style={{ ...inputStyle, width: 150 }} />
                        <input value={verForm.gueltigAb} onChange={(e) => setVerForm({ ...verForm, gueltigAb: e.target.value })} placeholder="Gültig ab" style={{ ...inputStyle, width: 120 }} />
                        <label style={{ ...bodyFont, fontSize: 12, color: COLORS.ink, display: "flex", alignItems: "center", gap: 5, cursor: "pointer" }}>
                          <input type="checkbox" checked={verForm.pflicht} onChange={(e) => setVerForm({ ...verForm, pflicht: e.target.checked })} style={{ accentColor: COLORS.court }} /> Lesebestätigung
                        </label>
                        <input key={fileKey} type="file" accept="application/pdf,.pdf" onChange={(e) => setFile(e.target.files[0] || null)} style={{ fontSize: 12 }} />
                        <button onClick={() => submitVersion(d)} disabled={busy} style={btn(true)}>{busy ? "…" : "Hochladen"}</button>
                        <button onClick={() => { setVerId(null); setFile(null); }} style={btn(false)}>Abbrechen</button>
                      </div>
                    ) : delId === d.id ? (
                      <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center" }}>
                        <span style={{ ...bodyFont, fontSize: 12.5, color: COLORS.ink, flex: 1, minWidth: 200 }}>Regelwerk samt allen früheren Versionen endgültig löschen?</span>
                        <button onClick={() => removeDoc(d)} disabled={busy} style={{ ...btn(true), background: COLORS.rust }}>Ja, löschen</button>
                        <button onClick={() => setDelId(null)} style={btn(false)}>Abbrechen</button>
                      </div>
                    ) : (
                      <div style={{ display: "flex", gap: 16, alignItems: "center", flexWrap: "wrap" }}>
                        <button onClick={() => { setVerId(d.id); setVerForm({ version: "", gueltigAb: "", pflicht: !!d.pflicht }); setFile(null); setFileKey((k) => k + 1); setMsg(null); }} style={linkBtn(COLORS.court)}>Neue Version hochladen</button>
                        <button onClick={() => setDelId(d.id)} style={linkBtn(COLORS.rust)}>Löschen</button>
                        {(d.verlauf || []).length > 0 && (
                          <span style={{ ...bodyFont, fontSize: 11.5, color: COLORS.inkSoft }}>Frühere Versionen: {d.verlauf.map((v, i) => <button key={i} onClick={() => openAsset(d.id + "-" + i, v.assetId, v.filename, d.titel, `Version ${v.version} (frühere Fassung)`, d.id, true)} style={{ ...linkBtn(COLORS.court), marginRight: 8, fontSize: 11.5 }}>{v.version}</button>)}</span>
                        )}
                      </div>
                    )}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      ))}
      {viewer && (() => {
        const vd = (docs || []).find((x) => x.id === viewer.docId);
        const showRead = isReferee && vd && vd.pflicht && !viewer.old;
        const needs = showRead && myReads[vd.id] !== vd.version;
        const extra = showRead ? (needs ? (
          <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
            <CourtBadge tone="amber">Bestätigung offen</CourtBadge>
            <button onClick={() => confirmRead(meName, vd)} style={{ background: COLORS.court, color: "#fff", border: "none", borderRadius: 7, padding: "7px 14px", fontSize: 12.5, fontWeight: 600, cursor: "pointer", ...bodyFont }}>Gelesen &amp; verstanden</button>
          </div>
        ) : <span style={{ ...bodyFont, fontSize: 12.5, color: COLORS.moss }}>✓ Kenntnisnahme bestätigt</span>) : null;
        return <PdfViewer key={viewer.assetId} title={viewer.titel} label={viewer.label} getBlob={() => getAssetBlob(viewer.assetId)} canSave={!!store.downloads} onSave={() => saveAsset(viewer.assetId, viewer.filename, viewer.titel)} extra={extra} onClose={() => setViewer(null)} />;
      })()}
    </div>
  );
}

// Admin: Schiedsrichter-Übersicht (filterbar)

const maskPhone = (p) => { const t = p || ""; return t.length <= 6 ? "•••" : t.slice(0, 4) + "•".repeat(Math.max(3, t.length - 6)) + t.slice(-2); };
const maskMail = (e) => { const t = e || ""; const at = t.indexOf("@"); return at < 1 ? "•••" : t[0] + "•••" + t.slice(at); };
function SchiedsrichterListe({ referees, onReveal }) {
  const [reveal, setReveal] = useState(false);
  const [q, setQ] = useState("");
  const [lvl, setLvl] = useState("alle");
  const [pt, setPt] = useState("alle");
  const [av, setAv] = useState("alle");
  const [soon, setSoon] = useState(false);
  const [sort, setSort] = useState("name");

  const rows = referees.filter((r) => {
    const hay = `${r.name} ${r.verein}${reveal ? ` ${r.email} ${r.phone}` : ""}`.toLowerCase();
    if (q.trim() && !hay.includes(q.trim().toLowerCase())) return false;
    if (lvl !== "alle" && r.license !== lvl) return false;
    if (pt === "national" && !r.perspNational) return false;
    if (pt === "international" && !r.perspInternational) return false;
    if (pt === "keins" && (r.perspNational || r.perspInternational)) return false;
    if (av === "ja" && !r.avail) return false;
    if (av === "nein" && r.avail) return false;
    if (soon) { const d = reminderDate(r); if (!d || new Date() < d) return false; }
    return true;
  }).sort((a, b) => (sort === "lizenz" ? licenseRank(b.license) - licenseRank(a.license) || a.name.localeCompare(b.name, "de") : sort === "verein" ? (a.verein || "").localeCompare(b.verein || "", "de") : a.name.localeCompare(b.name, "de")));

  const sel = { border: `1px solid ${COLORS.hair}`, borderRadius: 6, padding: "7px 9px", fontSize: 12.5, ...bodyFont, background: "#fff" };
  const cols = "1.3fr 1.1fr 1fr 1.1fr 1.6fr";
  return (
    <div>
      <h1 style={{ ...displayFont, fontSize: 26, color: COLORS.ink, margin: "0 0 4px" }}>Schiedsrichter</h1>
      <div style={{ ...bodyFont, fontSize: 13, color: COLORS.inkSoft, marginBottom: 16 }}>Alle Schiedsrichter mit Lizenzstufe und Kontaktdaten. Die Liste lässt sich filtern und sortieren.</div>
      <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap", marginBottom: 12 }}>
        <button onClick={() => { if (!reveal && onReveal) onReveal(); setReveal((v) => !v); }} style={{ background: reveal ? "#fff" : COLORS.court, color: reveal ? COLORS.court : "#fff", border: `1px solid ${COLORS.court}`, borderRadius: 7, padding: "7px 12px", fontSize: 12.5, fontWeight: 600, cursor: "pointer", ...bodyFont }}>{reveal ? "Kontaktdaten ausblenden" : "Kontaktdaten anzeigen"}</button>
        <span style={{ ...bodyFont, fontSize: 11.5, color: COLORS.inkSoft }}>Telefon und E-Mail sind standardmäßig maskiert; das Anzeigen wird protokolliert.</span>
      </div>
      <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center", marginBottom: 14 }}>
        <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Suche: Name, Verein, E-Mail, Telefon" style={{ ...sel, flex: 1, minWidth: 220 }} />
        <select value={lvl} onChange={(e) => setLvl(e.target.value)} style={sel}>
          <option value="alle">Alle Lizenzstufen</option>
          {LICENSE_LEVELS.map((l) => <option key={l} value={l}>{l}</option>)}
        </select>
        <select value={pt} onChange={(e) => setPt(e.target.value)} style={sel}>
          <option value="alle">Perspektiv-Team: alle</option>
          <option value="national">PT National</option>
          <option value="international">PT International</option>
          <option value="keins">Ohne Perspektiv-Team</option>
        </select>
        <select value={av} onChange={(e) => setAv(e.target.value)} style={sel}>
          <option value="alle">Verfügbarkeit: alle</option>
          <option value="ja">Verfügbar gemeldet</option>
          <option value="nein">Nicht verfügbar</option>
        </select>
        <label style={{ ...bodyFont, fontSize: 12.5, color: COLORS.ink, display: "flex", alignItems: "center", gap: 5, cursor: "pointer" }}>
          <input type="checkbox" checked={soon} onChange={(e) => setSoon(e.target.checked)} style={{ accentColor: COLORS.court }} /> Lizenz läuft in &lt; 12 Monaten ab
        </label>
        <select value={sort} onChange={(e) => setSort(e.target.value)} style={sel}>
          <option value="name">Sortiert nach Name</option>
          <option value="lizenz">Sortiert nach Lizenzstufe</option>
          <option value="verein">Sortiert nach Verein</option>
        </select>
      </div>
      <div style={{ background: COLORS.panel, border: `1px solid ${COLORS.hair}`, borderRadius: 12, overflow: "hidden" }}>
        <div style={{ display: "grid", gridTemplateColumns: cols, gap: 10, padding: "9px 14px", background: "#F8F6EF", ...bodyFont, fontSize: 11.5, color: COLORS.inkSoft, fontWeight: 600 }}>
          <div>Name</div><div>Lizenzstufe</div><div>Perspektiv-Team</div><div>Telefon</div><div>E-Mail</div>
        </div>
        {rows.length === 0 && <div style={{ ...bodyFont, fontSize: 13, color: COLORS.inkSoft, padding: 16 }}>Keine Schiedsrichter für diese Filter.</div>}
        {rows.map((r) => (
          <div key={r.id} style={{ display: "grid", gridTemplateColumns: cols, gap: 10, alignItems: "center", padding: "10px 14px", borderTop: `1px solid ${COLORS.hair}`, ...bodyFont, fontSize: 12.5, color: COLORS.ink }}>
            <div>
              <div style={{ fontWeight: 600 }}>{r.name}</div>
              <div style={{ fontSize: 11.5, color: COLORS.inkSoft }}>{r.verein}{r.avail ? "" : " · nicht verfügbar"}</div>
            </div>
            <div>
              <CourtBadge tone="court">{r.license}</CourtBadge>
              <div style={{ fontSize: 11.5, color: COLORS.inkSoft, marginTop: 3 }}>bis {r.licenseValidUntil}</div>
            </div>
            <div>{r.perspNational || r.perspInternational ? <>{r.perspNational && <CourtBadge tone="amber">National</CourtBadge>} {r.perspInternational && <CourtBadge tone="amber">International</CourtBadge>}</> : <span style={{ color: COLORS.inkSoft }}>—</span>}</div>
            <div style={monoFont}>{reveal ? r.phone : maskPhone(r.phone)}</div>
            <div style={{ ...monoFont, overflow: "hidden", textOverflow: "ellipsis" }}>{reveal ? r.email : maskMail(r.email)}</div>
          </div>
        ))}
      </div>
      <div style={{ ...bodyFont, fontSize: 11.5, color: COLORS.inkSoft, marginTop: 8 }}>{rows.length} von {referees.length} Schiedsrichtern</div>
    </div>
  );
}

const KARTE_FARBEN = { gelb: "#E8C23A", rot: "#C0392B", schwarz: "#1B241F" };
const KARTE_LABEL = { gelb: "Gelb", rot: "Rot", schwarz: "Schwarz" };

function KartenChip({ k }) {
  return (
    <span style={{ display: "inline-flex", alignItems: "center", gap: 6, background: "#F8F6EF", borderRadius: 6, padding: "3px 8px", marginRight: 6, marginBottom: 4, ...bodyFont, fontSize: 11.5, color: COLORS.ink }}>
      <span style={{ width: 9, height: 13, borderRadius: 2, background: KARTE_FARBEN[k.farbe], display: "inline-block" }} />
      {KARTE_LABEL[k.farbe]} · {k.team}{k.person ? ` · ${k.person}` : ""}{k.grund ? ` · ${k.grund}` : ""}{k.geber ? ` · vergeben von ${k.geber}` : ""}
    </span>
  );
}

function SpielNotizForm({ f, onSave, onCancel }) {
  const teams = teamsOf(f).length ? teamsOf(f) : ["Heim", "Gast"];
  const [notiz, setNotiz] = useState((f.report && f.report.notiz) || "");
  const [karten, setKarten] = useState((f.report && f.report.karten) || []);
  // Schiedsrichter, die an diesem Spiel beteiligt waren; Standard: ich selbst, sonst der erste
  const crew = [...new Set([...(f.confirmedRefs || []), ...(f.referee ? [f.referee] : [])])];
  const defaultGeber = crew.includes(CURRENT_REFEREE_NAME) ? CURRENT_REFEREE_NAME : crew[0] || "";
  const add = (farbe) => setKarten((k) => [...k, { farbe, team: teams[0], person: "", grund: "", geber: defaultGeber }]);
  const upd = (i, patch) => setKarten((k) => k.map((x, j) => (j === i ? { ...x, ...patch } : x)));
  const inp = { border: `1px solid ${COLORS.hair}`, borderRadius: 6, padding: "6px 8px", fontSize: 12.5, ...bodyFont, boxSizing: "border-box" };
  return (
    <div style={{ background: "#F8F6EF", borderRadius: 8, padding: 10, marginTop: 10 }}>
      <label style={{ ...bodyFont, fontSize: 11.5, color: COLORS.inkSoft, display: "block", marginBottom: 4 }}>Anmerkungen zum Spiel</label>
      <textarea value={notiz} onChange={(e) => setNotiz(e.target.value)} rows={3} maxLength={1000} placeholder="z. B. Besonderheiten, Verzögerungen, Auffälligkeiten" style={{ ...inp, width: "100%", marginBottom: 10, resize: "vertical" }} />
      <div style={{ ...bodyFont, fontSize: 11.5, color: COLORS.inkSoft, marginBottom: 6 }}>Karten</div>
      {karten.length === 0 && <div style={{ ...bodyFont, fontSize: 12, color: COLORS.inkSoft, marginBottom: 6 }}>Keine Karten vergeben.</div>}
      {karten.map((k, i) => (
        <div key={i} style={{ display: "flex", gap: 6, alignItems: "center", flexWrap: "wrap", marginBottom: 6 }}>
          <span style={{ width: 12, height: 17, borderRadius: 2, background: KARTE_FARBEN[k.farbe], flexShrink: 0 }} title={KARTE_LABEL[k.farbe]} />
          <select value={k.team} onChange={(e) => upd(i, { team: e.target.value })} style={{ ...inp, background: "#fff" }} aria-label="Mannschaft">{teams.map((t) => <option key={t} value={t}>{t}</option>)}</select>
          <select value={k.geber || ""} onChange={(e) => upd(i, { geber: e.target.value })} style={{ ...inp, background: "#fff" }} aria-label="Karte vergeben von">
            <option value="">— vergeben von —</option>
            {[...new Set([...crew, ...(k.geber ? [k.geber] : [])])].map((n) => <option key={n} value={n}>{n}</option>)}
          </select>
          <input value={k.person} onChange={(e) => upd(i, { person: e.target.value })} maxLength={100} placeholder="Spieler/in (optional)" style={{ ...inp, width: 140 }} />
          <input value={k.grund} onChange={(e) => upd(i, { grund: e.target.value })} maxLength={100} placeholder="Grund (optional)" style={{ ...inp, flex: 1, minWidth: 120 }} />
          <button onClick={() => setKarten((x) => x.filter((_, j) => j !== i))} style={{ background: "none", border: "none", color: COLORS.rust, cursor: "pointer", fontSize: 12, ...bodyFont }}>Entfernen</button>
        </div>
      ))}
      <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 10 }}>
        {["gelb", "rot", "schwarz"].map((c) => (
          <button key={c} onClick={() => add(c)} style={{ display: "flex", alignItems: "center", gap: 6, background: "#fff", border: `1px solid ${COLORS.hair}`, borderRadius: 6, padding: "5px 10px", fontSize: 12, cursor: "pointer", ...bodyFont, color: COLORS.ink }}>
            <span style={{ width: 9, height: 13, borderRadius: 2, background: KARTE_FARBEN[c] }} /> + {KARTE_LABEL[c]}e Karte
          </button>
        ))}
      </div>
      <div style={{ display: "flex", gap: 8 }}>
        <button onClick={() => onSave({ notiz: notiz.trim(), karten })} style={{ background: COLORS.court, color: "#fff", border: "none", borderRadius: 6, padding: "7px 12px", fontSize: 12, fontWeight: 600, cursor: "pointer", ...bodyFont }}>Speichern</button>
        <button onClick={onCancel} style={{ background: "#fff", color: COLORS.inkSoft, border: `1px solid ${COLORS.hair}`, borderRadius: 6, padding: "7px 12px", fontSize: 12, cursor: "pointer", ...bodyFont }}>Abbrechen</button>
      </div>
    </div>
  );
}

function KartenStatistik({ fixtures, referees }) {
  const [liga, setLiga] = useState("alle");
  const [farbe, setFarbe] = useState("alle");
  const [nur, setNur] = useState("alle");
  const [typ, setTyp] = useState("alle");
  const [refF, setRefF] = useState("alle");
  const withRep = fixtures.filter((f) => f.report);
  const ligen = [...new Set(withRep.map((f) => f.wettbewerb))];
  const reps = withRep.filter((f) => (liga === "alle" || f.wettbewerb === liga) && gameMatches(f, { typ, liga: "alle" }) && (nur === "alle" || (nur === "karten" ? (f.report.karten || []).length > 0 : !!f.report.notiz)) && (refF === "alle" || (f.report.karten || []).some((k) => k.geber === refF)));
  const allCards = reps.flatMap((f) => (f.report.karten || []).map((k) => ({ ...k, f })));
  const cardsR = refF === "alle" ? allCards : allCards.filter((k) => k.geber === refF);
  const shown = farbe === "alle" ? cardsR : cardsR.filter((k) => k.farbe === farbe);
  const group = (keyFn) => {
    const m = {};
    shown.forEach((k) => { const key = keyFn(k); m[key] = m[key] || { gelb: 0, rot: 0, schwarz: 0 }; m[key][k.farbe]++; });
    return Object.entries(m).map(([name, c]) => ({ name, ...c, total: c.gelb + c.rot + c.schwarz })).sort((a, b) => b.total - a.total);
  };
  const byTeam = group((k) => k.team);
  const byLiga = group((k) => k.f.wettbewerb);
  // Karten je Schiedsrichter (vergeben von) und Einsätze im gewählten Bereich
  const inScope = (f) => (liga === "alle" || f.wettbewerb === liga) && gameMatches(f, { typ, liga: "alle" });
  const officiated = fixtures.filter((f) => f.status === "bestätigt" && isPast(f) && inScope(f));
  const refNames = [...new Set([...(referees || []).map((r) => r.name), ...allCards.map((k) => k.geber).filter(Boolean)])];
  const byRef = refNames.map((n) => {
    const mine = allCards.filter((k) => k.geber === n);
    const einsaetze = officiated.filter((f) => (f.confirmedRefs || []).includes(n) || f.referee === n).length;
    return { name: n, einsaetze, gelb: mine.filter((k) => k.farbe === "gelb").length, rot: mine.filter((k) => k.farbe === "rot").length, schwarz: mine.filter((k) => k.farbe === "schwarz").length };
  }).map((r) => ({ ...r, total: r.gelb + r.rot + r.schwarz })).filter((r) => r.einsaetze > 0 || r.total > 0).sort((a, b) => b.total - a.total || a.name.localeCompare(b.name, "de"));
  const ohneGeber = allCards.filter((k) => !k.geber);
  const sel = { border: `1px solid ${COLORS.hair}`, borderRadius: 6, padding: "7px 9px", fontSize: 12.5, ...bodyFont, background: "#fff" };
  const table = (title, rows) => (
    <div style={{ background: COLORS.panel, border: `1px solid ${COLORS.hair}`, borderRadius: 12, overflow: "hidden", flex: 1, minWidth: 280 }}>
      <div style={{ ...bodyFont, fontSize: 12.5, fontWeight: 600, color: COLORS.ink, padding: "10px 14px", background: "#F8F6EF" }}>{title}</div>
      {rows.length === 0 && <div style={{ ...bodyFont, fontSize: 12.5, color: COLORS.inkSoft, padding: 14 }}>Keine Daten.</div>}
      {rows.map((r) => (
        <div key={r.name} style={{ display: "grid", gridTemplateColumns: "1fr 44px 44px 44px 44px", gap: 6, padding: "8px 14px", borderTop: `1px solid ${COLORS.hair}`, ...bodyFont, fontSize: 12.5, color: COLORS.ink }}>
          <div>{r.name}</div>
          {["gelb", "rot", "schwarz"].map((c) => <div key={c} style={{ ...monoFont, textAlign: "right", color: r[c] ? COLORS.ink : COLORS.hair }}>{r[c]}</div>)}
          <div style={{ ...monoFont, textAlign: "right", fontWeight: 600 }}>{r.total}</div>
        </div>
      ))}
      <div style={{ display: "grid", gridTemplateColumns: "1fr 44px 44px 44px 44px", gap: 6, padding: "6px 14px", borderTop: `1px solid ${COLORS.hair}`, ...bodyFont, fontSize: 11, color: COLORS.inkSoft }}>
        <div></div>{["gelb", "rot", "schwarz"].map((c) => <div key={c} style={{ textAlign: "right" }}><span style={{ display: "inline-block", width: 8, height: 11, borderRadius: 2, background: KARTE_FARBEN[c] }} /></div>)}<div style={{ textAlign: "right" }}>Σ</div>
      </div>
    </div>
  );
  return (
    <div>
      <h1 style={{ ...displayFont, fontSize: 26, color: COLORS.ink, margin: "0 0 4px" }}>Karten &amp; Notizen</h1>
      <div style={{ ...bodyFont, fontSize: 13, color: COLORS.inkSoft, marginBottom: 16 }}>Auswertung der von den Schiedsrichtern erfassten Anmerkungen und Karten (gelb, rot, schwarz).</div>
      <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 14 }}>
        <select value={typ} onChange={(e) => setTyp(e.target.value)} style={sel}><option value="alle">Ligaspiele &amp; Turniere</option><option value="liga">Nur Ligaspiele</option><option value="turnier">Nur Turniere</option></select>
        <select value={liga} onChange={(e) => setLiga(e.target.value)} style={sel}><option value="alle">Alle Wettbewerbe</option>{ligen.map((l) => <option key={l} value={l}>{l}</option>)}</select>
        <select value={farbe} onChange={(e) => setFarbe(e.target.value)} style={sel}><option value="alle">Alle Kartenfarben</option>{["gelb", "rot", "schwarz"].map((c) => <option key={c} value={c}>{KARTE_LABEL[c]}</option>)}</select>
        <select value={nur} onChange={(e) => setNur(e.target.value)} style={sel}><option value="alle">Alle Spiele mit Eintrag</option><option value="karten">Nur mit Karten</option><option value="notizen">Nur mit Anmerkung</option></select>
        <select value={refF} onChange={(e) => setRefF(e.target.value)} style={sel} aria-label="Schiedsrichter"><option value="alle">Alle Schiedsrichter</option>{(referees || []).map((r) => <option key={r.id} value={r.name}>{r.name}</option>)}</select>
      </div>
      <div style={{ display: "flex", gap: 12, flexWrap: "wrap", marginBottom: 16 }}>
        {[["Spiele mit Eintrag", reps.length, null], ...["gelb", "rot", "schwarz"].map((c) => [`${KARTE_LABEL[c]}e Karten`, cardsR.filter((k) => k.farbe === c).length, c])].map(([l, v, c]) => (
          <div key={l} style={{ background: COLORS.panel, border: `1px solid ${COLORS.hair}`, borderRadius: 10, padding: "10px 14px", minWidth: 130 }}>
            <div style={{ ...bodyFont, fontSize: 11.5, color: COLORS.inkSoft, display: "flex", alignItems: "center", gap: 6 }}>{c && <span style={{ width: 9, height: 13, borderRadius: 2, background: KARTE_FARBEN[c] }} />}{l}</div>
            <div style={{ ...displayFont, fontSize: 22, color: COLORS.ink }}>{v}</div>
          </div>
        ))}
      </div>
      <div style={{ display: "flex", gap: 14, flexWrap: "wrap", marginBottom: 18 }}>
        {table("Karten je Mannschaft", byTeam)}
        {table("Karten je Wettbewerb", byLiga)}
      </div>
      <div style={{ background: COLORS.panel, border: `1px solid ${COLORS.hair}`, borderRadius: 12, overflow: "hidden", marginBottom: 18 }}>
        <div style={{ ...bodyFont, fontSize: 12.5, fontWeight: 600, color: COLORS.ink, padding: "10px 14px", background: "#F8F6EF" }}>Karten je Schiedsrichter (vergeben von)</div>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 74px 44px 44px 44px 44px 84px", gap: 6, padding: "7px 14px", ...bodyFont, fontSize: 11, color: COLORS.inkSoft }}>
          <div>Schiedsrichter</div><div style={{ textAlign: "right" }}>Einsätze</div>
          {["gelb", "rot", "schwarz"].map((c) => <div key={c} style={{ textAlign: "right" }}><span style={{ display: "inline-block", width: 8, height: 11, borderRadius: 2, background: KARTE_FARBEN[c] }} /></div>)}
          <div style={{ textAlign: "right" }}>Σ</div><div style={{ textAlign: "right" }}>je Einsatz</div>
        </div>
        {byRef.length === 0 && ohneGeber.length === 0 && <div style={{ ...bodyFont, fontSize: 12.5, color: COLORS.inkSoft, padding: "10px 14px", borderTop: `1px solid ${COLORS.hair}` }}>Keine Daten.</div>}
        {byRef.map((r) => (
          <div key={r.name} style={{ display: "grid", gridTemplateColumns: "1fr 74px 44px 44px 44px 44px 84px", gap: 6, padding: "8px 14px", borderTop: `1px solid ${COLORS.hair}`, ...bodyFont, fontSize: 12.5, color: COLORS.ink, background: refF === r.name ? "#EAF1EC" : "transparent" }}>

            <div style={{ ...monoFont, textAlign: "right", fontWeight: 600 }}>{r.total}</div>
            <div style={{ ...monoFont, textAlign: "right" }}>{r.einsaetze ? (r.total / r.einsaetze).toFixed(2).replace(".", ",") : "–"}</div>

        ))}
        {ohneGeber.length > 0 && <div style={{ ...bodyFont, fontSize: 12, color: "#7A5214", padding: "8px 14px", borderTop: `1px solid ${COLORS.hair}` }}>{ohneGeber.length} Karte{ohneGeber.length === 1 ? "" : "n"} ohne Angabe, wer sie vergeben hat (ältere Einträge).</div>}
      </div>

      <h2 style={{ ...displayFont, fontSize: 18, color: COLORS.ink, margin: "0 0 10px" }}>Spiele mit Anmerkungen oder Karten</h2>
      {reps.length === 0 && <div style={{ ...bodyFont, fontSize: 13, color: COLORS.inkSoft, background: COLORS.panel, border: `1px solid ${COLORS.hair}`, borderRadius: 12, padding: 16 }}>Noch keine Einträge — Schiedsrichter erfassen sie in ihren Ansetzungen.</div>}
      {reps.map((f) => (
        <div key={f.id} style={{ background: COLORS.panel, border: `1px solid ${COLORS.hair}`, borderRadius: 10, padding: "12px 16px", marginBottom: 8 }}>
          <div style={{ ...bodyFont, fontSize: 13.5, fontWeight: 600, color: COLORS.ink }}>{f.title}</div>
          <div style={{ ...bodyFont, fontSize: 12, color: COLORS.inkSoft, marginBottom: 6 }}>{f.date} · {f.venue} · erfasst von {f.report.von} am {f.report.am}</div>

          <div>{(f.report.karten || []).filter((k) => farbe === "alle" || k.farbe === farbe).map((k, i) => <KartenChip key={i} k={k} />)}</div>
        </div>
      ))}
    </div>
  );
}

const BEOBACHTUNGEN_INITIAL = [
  { id: "b1", refId: 2, datum: "13.09.2026", spiel: "Regionalliga Südost · SG Talheim vs. BV Fils", beobachter: "Admin", scores: { regelkenntnis: 4, auftreten: 4, spielleitung: 3, teamarbeit: 4 }, staerken: "Sichere Regelanwendung, ruhige Kommunikation mit den Spielern.", entwicklung: "Bei Zeitspiel früher und konsequenter eingreifen.", empfehlung: "Weiter beobachten" },

];

function BeobachtungsTab({ referees, items, onAdd, adminName }) {
  const members = referees.filter((r) => r.perspNational || r.perspInternational);
  const [selId, setSelId] = useState(members[0] ? members[0].id : null);
  const emptyForm = () => ({ datum: new Date().toLocaleDateString("de-DE"), spiel: "", scores: { regelkenntnis: 3, auftreten: 3, spielleitung: 3, teamarbeit: 3 }, staerken: "", entwicklung: "", empfehlung: "Weiter beobachten" });
  const [f, setF] = useState(emptyForm());
  const [err, setErr] = useState("");
  const sel = members.find((r) => r.id === selId) || members[0] || null;
  const mine = sel ? items.filter((b) => b.refId === sel.id).slice().reverse() : [];
  const avg = (key) => (mine.length ? mine.reduce((s, b) => s + b.scores[key], 0) / mine.length : 0);
  const inp = { border: `1px solid ${COLORS.hair}`, borderRadius: 6, padding: "7px 9px", fontSize: 12.5, ...bodyFont, boxSizing: "border-box", background: "#fff" };
  const tone = (e) => (e === "Aufstufung empfohlen" ? "moss" : e === "Noch nicht" ? "rust" : "amber");

  const submit = () => {
    if (!f.spiel.trim()) { setErr("Bitte das beobachtete Spiel angeben."); return; }
    setErr("");
    onAdd({ refId: sel.id, ...f, spiel: f.spiel.trim(), staerken: f.staerken.trim(), entwicklung: f.entwicklung.trim(), beobachter: adminName || "Admin" });
    setF(emptyForm());
  };

  if (members.length === 0) {
    return <div><h1 style={{ ...displayFont, fontSize: 26, color: COLORS.ink, margin: "0 0 4px" }}>Beobachtung &amp; Entwicklung</h1><div style={{ ...bodyFont, fontSize: 13, color: COLORS.inkSoft }}>Noch kein Schiedsrichter im Perspektiv-Team — Zuordnung unter „Lizenzen &amp; Perspektiv-Teams“.</div></div>;
  }
  return (
    <div>
      <h1 style={{ ...displayFont, fontSize: 26, color: COLORS.ink, margin: "0 0 4px" }}>Beobachtung &amp; Entwicklung</h1>
      <div style={{ ...bodyFont, fontSize: 13, color: COLORS.inkSoft, marginBottom: 16 }}>Beobachtungsbögen für Mitglieder der Perspektiv-Teams — zur Dokumentation der Aufstufung zu National bzw. International.</div>
      <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 16 }}>
        {members.map((r) => {
          const n = items.filter((b) => b.refId === r.id).length;
          const active = sel && sel.id === r.id;
          return (
            <button key={r.id} onClick={() => setSelId(r.id)} style={{ textAlign: "left", background: active ? "#EAF1EC" : COLORS.panel, border: `1px solid ${active ? COLORS.court : COLORS.hair}`, borderRadius: 10, padding: "9px 14px", cursor: "pointer", ...bodyFont }}>
              <div style={{ fontSize: 13, fontWeight: 600, color: COLORS.ink }}>{r.name}</div>
              <div style={{ fontSize: 11.5, color: COLORS.inkSoft }}>{r.license} → PT {r.perspInternational ? "International" : "National"} · {n} Beobachtung{n === 1 ? "" : "en"}</div>
            </button>
          );
        })}
      </div>

      <div style={{ display: "flex", gap: 16, flexWrap: "wrap", alignItems: "flex-start" }}>
        <div style={{ flex: 1.3, minWidth: 300 }}>
          <div style={{ background: COLORS.panel, border: `1px solid ${COLORS.hair}`, borderRadius: 12, padding: 14, marginBottom: 12 }}>
            <div style={{ ...bodyFont, fontSize: 12.5, fontWeight: 600, color: COLORS.ink, marginBottom: 8 }}>Durchschnitt über {mine.length} Beobachtung{mine.length === 1 ? "" : "en"}</div>
            {BEO_KRITERIEN.map(([k, label]) => (
              <div key={k} style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 5 }}>
                <div style={{ ...bodyFont, fontSize: 12, color: COLORS.inkSoft, width: 190 }}>{label}</div>
                <div style={{ flex: 1, background: "#F1EFE6", borderRadius: 4, height: 8 }}><div style={{ width: `${(avg(k) / 5) * 100}%`, background: COLORS.court, height: 8, borderRadius: 4 }} /></div>
                <div style={{ ...monoFont, fontSize: 12, color: COLORS.ink, width: 28, textAlign: "right" }}>{mine.length ? avg(k).toFixed(1).replace(".", ",") : "–"}</div>
              </div>
            ))}
          </div>
          {mine.length === 0 && <div style={{ ...bodyFont, fontSize: 13, color: COLORS.inkSoft }}>Noch keine Beobachtung erfasst.</div>}
          {mine.map((b) => (
            <div key={b.id} style={{ background: COLORS.panel, border: `1px solid ${COLORS.hair}`, borderRadius: 10, padding: "12px 16px", marginBottom: 8 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 4 }}>
                <div style={{ ...bodyFont, fontSize: 13, fontWeight: 600, color: COLORS.ink, flex: 1 }}>{b.spiel}</div>
                <CourtBadge tone={tone(b.empfehlung)}>{b.empfehlung}</CourtBadge>
              </div>
              <div style={{ ...bodyFont, fontSize: 11.5, color: COLORS.inkSoft, marginBottom: 6 }}>{b.datum} · beobachtet von {b.beobachter} · {BEO_KRITERIEN.map(([k, l]) => `${l.split(" ")[0]} ${b.scores[k]}`).join(" · ")}</div>

        <div style={{ flex: 1, minWidth: 280, background: COLORS.panel, border: `1px solid ${COLORS.hair}`, borderRadius: 12, padding: 14 }}>
          <div style={{ ...bodyFont, fontSize: 13, fontWeight: 600, color: COLORS.ink, marginBottom: 10 }}>Neue Beobachtung für {sel.name}</div>
          <input value={f.datum} onChange={(e) => setF({ ...f, datum: e.target.value })} placeholder="Datum" style={{ ...inp, width: "100%", marginBottom: 8 }} />
          <input value={f.spiel} onChange={(e) => setF({ ...f, spiel: e.target.value })} placeholder="Beobachtetes Spiel / Turnier" style={{ ...inp, width: "100%", marginBottom: 10 }} />
          {BEO_KRITERIEN.map(([k, label]) => (
            <div key={k} style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6 }}>
              <div style={{ ...bodyFont, fontSize: 12, color: COLORS.ink, flex: 1 }}>{label}</div>
              <select value={f.scores[k]} onChange={(e) => setF({ ...f, scores: { ...f.scores, [k]: Number(e.target.value) } })} style={inp}>{[1, 2, 3, 4, 5].map((n) => <option key={n} value={n}>{n}</option>)}</select>
            </div>
          ))}
          <textarea value={f.staerken} onChange={(e) => setF({ ...f, staerken: e.target.value })} rows={2} maxLength={1000} placeholder="Stärken" style={{ ...inp, width: "100%", margin: "6px 0", resize: "vertical" }} />
          <textarea value={f.entwicklung} onChange={(e) => setF({ ...f, entwicklung: e.target.value })} rows={2} maxLength={1000} placeholder="Entwicklungsfelder" style={{ ...inp, width: "100%", marginBottom: 8, resize: "vertical" }} />
          <select value={f.empfehlung} onChange={(e) => setF({ ...f, empfehlung: e.target.value })} style={{ ...inp, width: "100%", marginBottom: 10 }}>{BEO_EMPFEHLUNG.map((e) => <option key={e} value={e}>{e}</option>)}</select>
          {err && <div style={{ ...bodyFont, fontSize: 12, color: COLORS.rust, marginBottom: 8 }}>{err}</div>}
          <button onClick={submit} style={{ background: COLORS.court, color: "#fff", border: "none", borderRadius: 7, padding: "8px 14px", fontSize: 12.5, fontWeight: 600, cursor: "pointer", ...bodyFont }}>Beobachtung speichern</button>
          <div style={{ ...bodyFont, fontSize: 11, color: COLORS.inkSoft, marginTop: 8 }}>Bewertung 1 (schwach) bis 5 (sehr stark).</div>
        </div>
      </div>
    </div>
  );
}

const PERM_MATRIX = [

  [false, "Datenschutz-Dokumentation: Einwilligung für Telefonnummer und Push-Mitteilungen, Verzeichnis der Verarbeitungstätigkeiten, Auftragsverarbeitung."],
];
function RollenVerwaltung({ users, log, accessLog, onSetRole, onToggleActive, onAdd }) {
  const [q, setQ] = useState("");
  const [rf, setRf] = useState("alle");
  const [msg, setMsg] = useState(null);
  const [nu, setNu] = useState({ name: "", username: "", email: "", role: "schiri" });
  const activeMasters = users.filter((u) => u.role === "master" && u.active).length;
  const isLastMaster = (u) => u.role === "master" && u.active && activeMasters <= 1;
  const LAST = { tone: "rust", text: "Es muss mindestens ein aktiver Master-Admin bleiben." };

  const changeRole = (u, role) => {
    if (role === u.role) return;
    if (isLastMaster(u)) { setMsg(LAST); return; }
    setMsg(null);
    onSetRole(u.id, role);
  };
  const toggle = (u) => {
    if (u.active && isLastMaster(u)) { setMsg(LAST); return; }
    setMsg(null);
    onToggleActive(u.id);
  };
  const add = () => {
    const un = nu.username.trim().toLowerCase();
    if (!nu.name.trim() || !un) { setMsg({ tone: "rust", text: "Bitte Name und NuLiga-Benutzername angeben." }); return; }
    if (users.some((u) => u.username === un)) { setMsg({ tone: "rust", text: "Dieser Benutzername ist bereits vergeben." }); return; }
    onAdd({ name: nu.name.trim(), username: un, email: nu.email.trim(), role: nu.role });
    setNu({ name: "", username: "", email: "", role: "schiri" });
    setMsg({ tone: "moss", text: "Konto angelegt." });
  };

  const rows = users.filter((u) => (rf === "alle" || u.role === rf) && (!q.trim() || `${u.name} ${u.username} ${u.email}`.toLowerCase().includes(q.trim().toLowerCase())));
  const inp = { border: `1px solid ${COLORS.hair}`, borderRadius: 6, padding: "7px 9px", fontSize: 12.5, ...bodyFont, boxSizing: "border-box", background: "#fff" };
  const cols = "1.4fr 1.5fr 150px 110px";

  return (
    <div style={{ maxWidth: 900 }}>
      <h1 style={{ ...displayFont, fontSize: 26, color: COLORS.ink, margin: "0 0 4px" }}>Rollen</h1>
      <div style={{ ...bodyFont, fontSize: 13, color: COLORS.inkSoft, marginBottom: 16 }}>Konten und Rollen verwalten. Die Rolle bestimmt, welche Bereiche jemand sieht und ändern darf. Änderungen gelten ab der nächsten Anmeldung.</div>

      <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 12 }}>
        <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Suche: Name, Benutzername, E-Mail" style={{ ...inp, flex: 1, minWidth: 220 }} />
        <select value={rf} onChange={(e) => setRf(e.target.value)} style={inp}>
          <option value="alle">Alle Rollen</option>
          {ROLE_ORDER.map((r) => <option key={r} value={r}>{ROLE_LABEL[r]}</option>)}
        </select>
      </div>
      {msg && <div style={{ ...bodyFont, fontSize: 12.5, color: msg.tone === "moss" ? COLORS.moss : COLORS.rust, marginBottom: 10 }}>{msg.text}</div>}

      <div style={{ background: COLORS.panel, border: `1px solid ${COLORS.hair}`, borderRadius: 12, overflow: "hidden", marginBottom: 20 }}>
        <div style={{ display: "grid", gridTemplateColumns: cols, gap: 10, padding: "9px 14px", background: "#F8F6EF", ...bodyFont, fontSize: 11.5, color: COLORS.inkSoft, fontWeight: 600 }}>
          <div>Konto</div><div>E-Mail</div><div>Rolle</div><div>Status</div>
        </div>
        {rows.length === 0 && <div style={{ ...bodyFont, fontSize: 13, color: COLORS.inkSoft, padding: 16 }}>Keine Konten für diesen Filter.</div>}
        {rows.map((u) => (
          <div key={u.id} style={{ display: "grid", gridTemplateColumns: cols, gap: 10, alignItems: "center", padding: "10px 14px", borderTop: `1px solid ${COLORS.hair}`, opacity: u.active ? 1 : 0.55, ...bodyFont, fontSize: 12.5, color: COLORS.ink }}>
            <div>
              <div style={{ fontWeight: 600 }}>{u.name}</div>
              <div style={{ ...monoFont, fontSize: 11, color: COLORS.inkSoft }}>{u.username}</div>
            </div>
            <div style={{ ...monoFont, fontSize: 11.5, overflow: "hidden", textOverflow: "ellipsis" }}>{u.email || "—"}</div>
            <select value={u.role} onChange={(e) => changeRole(u, e.target.value)} style={inp}>
              {ROLE_ORDER.map((r) => <option key={r} value={r}>{ROLE_LABEL[r]}</option>)}
            </select>
            <button onClick={() => toggle(u)} style={{ background: u.active ? "#EAF1EC" : "#FBEAE5", color: u.active ? COLORS.court : COLORS.rust, border: "none", borderRadius: 999, padding: "5px 10px", fontSize: 11.5, fontWeight: 600, cursor: "pointer", ...bodyFont }}>{u.active ? "Aktiv" : "Deaktiviert"}</button>
          </div>
        ))}
      </div>

      <div style={{ background: COLORS.panel, border: `1px solid ${COLORS.hair}`, borderRadius: 12, padding: 16, marginBottom: 20 }}>
        <div style={{ ...bodyFont, fontSize: 13, fontWeight: 600, color: COLORS.ink, marginBottom: 10 }}>Konto anlegen</div>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          <input value={nu.name} onChange={(e) => setNu({ ...nu, name: e.target.value })} placeholder="Name" style={{ ...inp, flex: 1.2, minWidth: 150 }} />
          <input value={nu.username} onChange={(e) => setNu({ ...nu, username: e.target.value })} placeholder="NuLiga-Benutzername" style={{ ...inp, flex: 1, minWidth: 150 }} />
          <input value={nu.email} onChange={(e) => setNu({ ...nu, email: e.target.value })} placeholder="E-Mail (optional)" style={{ ...inp, flex: 1.2, minWidth: 170 }} />
          <select value={nu.role} onChange={(e) => setNu({ ...nu, role: e.target.value })} style={inp}>{ROLE_ORDER.map((r) => <option key={r} value={r}>{ROLE_LABEL[r]}</option>)}</select>
          <button onClick={add} style={{ background: COLORS.court, color: "#fff", border: "none", borderRadius: 7, padding: "8px 14px", fontSize: 12.5, fontWeight: 600, cursor: "pointer", ...bodyFont }}>Anlegen</button>
        </div>
      </div>

      <div style={{ background: COLORS.panel, border: `1px solid ${COLORS.hair}`, borderRadius: 12, overflow: "hidden", marginBottom: 20 }}>
        <div style={{ ...bodyFont, fontSize: 13, fontWeight: 600, color: COLORS.ink, padding: "12px 14px", background: "#F8F6EF" }}>Berechtigungen je Rolle</div>
        <div style={{ display: "grid", gridTemplateColumns: "1fr repeat(4, 92px)", gap: 8, padding: "8px 14px", ...bodyFont, fontSize: 11.5, color: COLORS.inkSoft, fontWeight: 600 }}>
          <div></div>{ROLE_ORDER.map((r) => <div key={r} style={{ textAlign: "center" }}>{ROLE_LABEL[r]}</div>)}
        </div>
        {PERM_MATRIX.map((p) => (
